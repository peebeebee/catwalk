      }
      if (cat.crouch) {
        cat.crouch.t += dt;
        if (cat.crouch.t >= cat.crouch.dur || !cat.onGround) {
          cat.crouch = null;
          launch = true;
        }
      }

      if (launch) {
        // A running take-off springs forward at leap speed straight away.
        const running = moveDir !== 0 && Math.sign(nextVx) === moveDir && Math.abs(nextVx) > 120;
        const leapVx = running ? moveDir * Math.max(Math.abs(nextVx), LEAP_SPEED * zoom) : nextVx;
        Body.setVelocity(physics.catBody, {
          x: leapVx / MATTER_FPS,
          y: -cat.jumpSpeed * (zoom > 1 ? 1.08 : 1) / MATTER_FPS
        });
        // The body rears up about the shoulders while planted hind paws push.
        cat.pose.launch = running ? LAUNCH_PITCH_RUN : LAUNCH_PITCH;
        for (const leg of cat.legs) {
          leg.pushing = leg.name.startsWith("rear") && leg.mode !== "air";
          if (leg.pushing) {
            leg.plant.x = leg.foot.x;
            leg.plant.y = leg.foot.y;
          }
        }
        cat.onGround = false;
        cat.supportSurface = null;
        cat.support = null;
        cat.justJumped = true;
        cat.leapt = true;
        cat.jumpCut = false;
      } else if (!cat.onGround) {
        let vy = physics.catBody.velocity.y * MATTER_FPS;
        if (vy < 0 && !input.Space && !cat.jumpCut) {
          vy *= JUMP_CUT;
          cat.jumpCut = true;
        }
        if (vy > 0) vy += GRAVITY * FALL_BOOST * dt;
        Body.setVelocity(physics.catBody, {
          x: physics.catBody.velocity.x,
          y: vy / MATTER_FPS
        });
      }

      // One-way platforms: solid only while the cat's feet are at or above
      // the top and it isn't dropping through on purpose.
      cat.dropTimer = Math.max(0, cat.dropTimer - dt);
      const bottomBefore = colliderRectAt().bottom;
      // A small threshold: resting contact can leave a hint of upward speed.
      const rising = physics.catBody.velocity.y * MATTER_FPS < -30;
      let mask = 0xffffffff;
      for (const platform of world.platforms) {
        const solid = cat.dropTimer <= 0 && !rising && bottomBefore <= platform.top + 2;
        if (!solid) mask &= ~platform.category;
      }
      physics.catBody.collisionFilter.mask = mask;

      Engine.update(physics.engine, dt * 1000);

      const nextRealVx = physics.catBody.velocity.x * MATTER_FPS;
      const nextRealVy = physics.catBody.velocity.y * MATTER_FPS;
      cat.ax = (nextRealVx - cat.vx) / Math.max(dt, 0.001);
      cat.ay = (nextRealVy - cat.vy) / Math.max(dt, 0.001);
      cat.vx = nextRealVx;
      cat.vy = nextRealVy;
      cat.x = physics.catBody.position.x;
      cat.y = physics.catBody.position.y - cat.collider.offsetY;

      // A fast landing can sink into the box top for a frame. That is a
      // landing, not a side hit: settle the cat on top, or the side resolver
      // below would shove it off the box.
      const box = boxRect();
      const landed = colliderRectAt();
      if (bottomBefore <= box.top + 2 && landed.bottom > box.top && landed.right > box.left && landed.left < box.right) {
        const sink = landed.bottom - box.top;
        Body.setPosition(physics.catBody, { x: physics.catBody.position.x, y: physics.catBody.position.y - sink });
        Body.setVelocity(physics.catBody, { x: physics.catBody.velocity.x, y: 0 });
        cat.y -= sink;
        cat.vy = 0;
      }

      resolveSidePenetration();

      // Keep the visible rig in the room even when inertia pushes aggressively.
      const visualBoundaryPadding = cat.collider.w / 2 + 84;
      const clampedX = clamp(cat.x, visualBoundaryPadding, ROOM_W - visualBoundaryPadding);
      if (Math.abs(clampedX - cat.x) > 0.001) {
        Body.setPosition(physics.catBody, {
          x: clampedX,
          y: physics.catBody.position.y
        });
        Body.setVelocity(physics.catBody, {
          x: 0,
          y: physics.catBody.velocity.y
        });
        cat.x = clampedX;
        cat.vx = 0;
      }

      // Ground classification drives gait and leg planting.
      const support = isOnBoxTop() ? walkableSurfaces().find((s) => s.kind === "box") : surfaceUnderCat();
      cat.support = support;
      cat.onGround = !!support;
      cat.supportSurface = support ? support.kind : null;
      if (cat.onGround) {
        cat.coyoteTime = Math.max(cat.coyoteTime, 0.11);
        cat.leapt = false;
      }
      tryCling();
    }

    function updatePose(dt) {
      // Pose values are low-frequency offsets that drive torso motion.
      const speed = Math.abs(cat.vx);
      cat.gaitParams = gaitParams(speed);
      const gaitCadence = cat.gaitParams.cadenceHz * (cat.onGround ? 1 : 0.45);
      cat.gait = normalizedPhase(cat.gait + dt * TAU * gaitCadence);

      const gaitStrength = clamp(speed / 320, 0, 1);
      const gaitBob = Math.sin(cat.gait * 2) * (0.8 + gaitStrength * 1.9);
      const breathing = Math.sin(nowSeconds * 2.15) * 0.95;
      // Standing still, the chest and belly rise and fall with each breath.
      cat.pose.breath = breathing * (1 - gaitStrength);
      cat.pose.land *= Math.exp(-dt * 7);
      const cling = cat.cling;
      // Stuck in the curtains, the cat wriggles, harder after each key press.
      const wriggle = cling ? Math.sin(cling.t * 16) * (0.03 + cling.struggle * 0.09) : 0;
      cat.pose.sneak = approach(cat.pose.sneak, cat.sneaking ? 1 : 0, dt * 6);
      // Gathering for a jump, the hindquarters sink onto the hind legs.
      const gatherT = cat.crouch ? clamp(cat.crouch.t / cat.crouch.dur, 0, 1) : 0;
      const gather = gatherT * gatherT * (3 - 2 * gatherT);
      // Running cats carry themselves a little lower; a sneaking cat sinks
      // until its chest nearly brushes the floor.
      const crouch = gaitStrength * 5 + cat.pose.sneak * 24 + gather * 6;
      cat.pose.bob = cling
        ? 0
        : cat.onGround
          ? (-0.7 + breathing * (1 - cat.pose.sneak * 0.6) + gaitBob + crouch + cat.pose.land * 7)
          : (Math.sin(nowSeconds * 8.7) * 0.8);
      // The back stays nearly level on the ground, rocking a little with each
      // step. A leap pitches the body nose-up off the push and well nose-down
      // as it falls, the forepaws reaching for the landing, and a landing dips
      // the shoulders as the forelegs take the weight first.
      // A gallop (zoomies) rocks the body once a stride: nose up as the hind
      // legs drive, nose down onto the forepaws. Hanging in the curtains, the
      // cat is nearly upright.
      const rock = -Math.sin(cat.gait - 0.6) * 0.07 * cat.gaitParams.toGallop * gaitStrength;
      const walkRock = Math.sin(cat.gait * 2 + 0.8) * 0.022 * gaitStrength * (1 - cat.gaitParams.toGallop);
      const tiltTarget = cling
        ? -cat.facing * (CLING_TILT + wriggle)
        : cat.onGround
          ? clamp(cat.vx / 420, -1, 1) * 0.035 + cat.facing * (cat.pose.land * 0.1 + cat.pose.sneak * 0.03 + rock + walkRock)
          : cat.facing * (cat.vy < 0 ? clamp(cat.vy / 1300, -1, 0) * 0.32 : clamp(cat.vy / 1100, 0, 1) * 0.62) +
            clamp(cat.vx / 420, -1, 1) * 0.02;
      // Swinging up into the curtains and dropping out of them turns slower.
      const leanRate = cling || cat.clingCooldown > CLING_REST - 0.5 ? 6 : 10;
      cat.pose.lean = lerp(cat.pose.lean, tiltTarget, 1 - Math.exp(-dt * leanRate));
      // The rear-up of a take-off eases off as the hind legs leave the ground.
      cat.pose.launch = cat.crouch ? gather * 0.14 : cat.pose.launch * Math.exp(-dt * 9);
      cat.pose.tilt = cat.pose.lean - cat.facing * cat.pose.launch;

      // The spine bends like a real cat's. It bunches and rounds up in the
      // crouch, stretches long and straight off the push and through the
      // flight, starts rounding toward the landing, and humps up hard as the
      // hindquarters come down after the forepaws land. Running flexes it a
      // little with each stride, a gallop (zoomies) a lot; sneaking hollows it.
      let archTarget;
      let lengthTarget;
      if (cling) {
        // Hanging: stretched long, the back curling with the wriggle.
        archTarget = 3 + wriggle * 30;
        lengthTarget = 1.12;
      } else if (cat.crouch) {
        archTarget = 11 * gather;
        lengthTarget = 1 - 0.13 * gather;
      } else if (!cat.onGround) {
        const fall = clamp(cat.vy / 1400, -1, 1);
        archTarget = fall < 0 ? 4 * fall : 9 * fall;
        lengthTarget = 1.2 - 0.1 * Math.max(fall, 0);
      } else {
        // Speeding up stretches the body as the hind legs drive; braking
        // bunches it up.
        const drive = clamp((cat.ax * cat.facing) / 2600, -1, 1) * gaitStrength;
        const flex = Math.sin(cat.gait * 2) * gaitStrength * (1 + cat.gaitParams.toGallop * 2.5);
        archTarget = flex * 2.6 + cat.pose.land * 17 - cat.pose.sneak * 3 + Math.max(0, -drive) * 4;
        lengthTarget = 1 - flex * 0.035 - cat.pose.land * 0.2 + cat.pose.sneak * 0.03 + drive * 0.04;
      }
      // Springy, a touch bouncy; two steps keep it steady at low frame rates.
      for (let step = 0; step < 2; step += 1) {
        const h = dt / 2;
        cat.pose.archVel += (420 * (archTarget - cat.pose.arch) - 26 * cat.pose.archVel) * h;
        cat.pose.arch += cat.pose.archVel * h;
        cat.pose.lengthVel += (380 * (lengthTarget - cat.pose.length) - 25 * cat.pose.lengthVel) * h;
        cat.pose.length += cat.pose.lengthVel * h;
      }

      // The deep coat and belly swing a moment behind the body: bouncy
      // springs pushed by its change of speed. A landing swings the belly
      // down, a take-off too (it lags the rise), and a start or stop swings
      // it back or forward.
      const visX = cat.x;
      const visY = cat.y + cat.pose.bob;
      const loose = cat.pose.loose;
      if (loose.x !== null && dt > 0) {
        const vx = (visX - loose.x) / dt;
        const vy = (visY - loose.y) / dt;
        if (loose.vx !== null) {
          loose.sagVel -= clamp(vy - loose.vy, -1600, 1600) * 0.09;
          loose.swingVel -= clamp(vx - loose.vx, -1600, 1600) * 0.05;
        }
        loose.vx = vx;
        loose.vy = vy;
      }
      loose.x = visX;
      loose.y = visY;
      for (let step = 0; step < 2; step += 1) {
        const h = dt / 2;
        loose.sagVel += (-480 * loose.sag - 13 * loose.sagVel) * h;
        loose.sag = clamp(loose.sag + loose.sagVel * h, -6, 8);
        loose.swingVel += (-420 * loose.swing - 12 * loose.swingVel) * h;
        loose.swing = clamp(loose.swing + loose.swingVel * h, -6, 6);
      }
    }

    // The top of a foreleg's shoulder blade, or a hind leg's hip. Sneaking
    // hunches the shoulder blades up above the line of the back.
    function legAnchor(leg) {
      const front = leg.name.startsWith("front");
      return bodyPoint(leg.localX * cat.facing, leg.localY - (front ? cat.pose.sneak * 9 : 0));
    }

    // Roughly how far ahead of or behind its anchor a leg can plant a paw on a
    // surface at surfaceY.
    function legHorizontalReach(leg, hip, surfaceY) {
      const front = leg.name.startsWith("front");
      const top = front ? hip.y + leg.blade * 0.9 : hip.y;
      const ankleY = surfaceY - leg.distal * 0.95;
      const chain = (leg.upper + leg.lower) * 0.97;
      const reach = Math.sqrt(Math.max(chain * chain - (ankleY - top) ** 2, 0));
      return reach + (front ? leg.blade * 0.35 : leg.distal * 0.3);
    }

    function updateLegs(dt) {
      // Four-state leg controller: stance/swing on ground, tuck in air. It
      // places the toes; the joints above them are solved from there.
      if (cat.pawTap) {
        cat.pawTap.t += dt;
        if (cat.pawTap.t > PAW_TAP_TIME) cat.pawTap = null;
      }
      const speed = Math.abs(cat.vx);
      const speedRatio = clamp(speed / 340, 0, 1);
      const gait = cat.gaitParams;

      for (const leg of cat.legs) {
        const isFront = leg.name.startsWith("front");
        const hip = legAnchor(leg);
        leg.hip.x = hip.x;
        leg.hip.y = hip.y;
        let angleTarget;
        let angleRate = 30;
        // Bends of the two joints: elbows back, knees forward (see below).
        let bend = (isFront ? 1 : -1) * cat.facing;

        if (cat.cling) {
          // Stuck in a curtain: forepaws stretched up with their claws in
          // the cloth, hind feet braced against it below the hips, the belly
          // to the cloth. The hind feet scrabble and the forepaws re-grip,
          // harder while the cat struggles.
          const c = cat.cling;
          const center = bodyCenter();
          const phase = (leg.near ? 0 : 1.9) + (isFront ? 0 : 0.8);
          const effort = 0.35 + c.struggle;
          const gripX = (isFront ? (leg.near ? 4 : -4) : (leg.near ? 22 : 13)) * cat.facing;
          const gripY = isFront
            ? (leg.near ? -94 : -88) - Math.max(0, Math.sin(c.t * 6 + phase)) * 7 * effort
            : (leg.near ? 40 : 46) - Math.sin(c.t * 15 + phase) * 6 * effort;
          if (leg.mode !== "cling") {
            leg.mode = "cling";
            leg.pushing = false;
            leg.landing = false;
          }
          const ease = 1 - Math.exp(-dt * 18);
          leg.target.x = lerp(leg.target.x, center.x + gripX, ease);
          leg.target.y = lerp(leg.target.y, center.y + gripY, ease);
          angleTarget = isFront ? 2.75 : 2.3;
          angleRate = 14;
          // A paw reaching up bends its elbow down, away from the cloth.
          if (isFront) bend = -cat.facing;
        } else if (!cat.onGround) {
          // Airborne pose phases:
          // ascent  -> hind legs trail and front stays compact
          // descent -> forelegs reach for landing, hind recovers under body
          // Easing happens on the hip-relative offset: easing the world-space
          // target lags behind a fast fall and flips the paws up over the back.
          // Just after take-off the hind paws stay planted, toes last, while
          // the legs straighten; they let go once the leg can't reach them.
          if (leg.pushing && (leg.strained || cat.vy >= 0)) {
            leg.pushing = false;
            leg.airOffset = { x: leg.foot.x - hip.x, y: leg.foot.y - hip.y };
          }
          if (leg.pushing) {
            leg.mode = "air";
            leg.target.x = leg.plant.x;
            leg.target.y = leg.plant.y;
            angleTarget = -0.9;
            angleRate = 40;
          } else {
            if (leg.mode !== "air") {
              leg.airOffset = { x: leg.target.x - hip.x, y: leg.target.y - hip.y };
            }
            leg.mode = "air";
            let supportY = supportSurfaceYForFoot(
              hip.x + leg.stanceX * cat.facing,
              hip.x,
              hip.y
            );
            // A box top at or above hip height can't be reached mid-air; aiming
            // for it folds the legs up over the back, so fall back to the floor.
            if (supportY < hip.y + 8) supportY = floorY;
            const airTarget = computeAirLegTarget({
              hip,
              facing: cat.facing,
              isFront,
              vy: cat.vy,
              supportY
            });
            // The forepaws snap up under the chest as the front rears up.
            const ease = Math.min(1, dt * (isFront && cat.pose.launch > 0.15 ? 26 : 16));
            leg.airOffset.x = lerp(leg.airOffset.x, airTarget.x - hip.x, ease);
            leg.airOffset.y = lerp(leg.airOffset.y, airTarget.y - hip.y, ease);
            leg.target.x = hip.x + leg.airOffset.x;
            leg.target.y = hip.y + leg.airOffset.y;
            angleTarget = airTarget.angle;
            angleRate = 12;
          }
        } else {
          // Ground: a planted paw stays put while the body moves over it, and a
          // swinging paw aims half a stride ahead of where the hip will be when
          // it lands, so paws neither slide nor trail behind.
          if (leg.mode === "air") {
            leg.pushing = false;
            const supportY = supportSurfaceYForFoot(leg.foot.x, hip.x, hip.y);
            if (leg.foot.y < supportY - 8) {
              // The forepaws touch down first; a paw still up (a hind one,
              // usually) steps down under the hip as the hindquarters drop.
              leg.mode = "swing";
              leg.landing = true;
              leg.swingT = 0;
              leg.swingStart.x = leg.foot.x;
              leg.swingStart.y = leg.foot.y;
              leg.liftOffAngle = leg.angle;
              leg.swingRate = 7;
            } else {
              leg.mode = "stance";
              leg.plant.x = leg.foot.x;
              leg.plant.y = supportY;
            }
          }
          const center = hip.x + lerp(leg.standX, leg.stanceX, speedRatio) * cat.facing;
          const legPhase = normalizedPhase(cat.gait + blendedPhaseOffset(leg.name, gait));
          const inSwingWindow = gait.cadenceHz > 0 && isSwingPhase(legPhase, gait.dutyFactor);

          if (leg.mode === "stance") {
            // After a stop, paws left spread out step back under the body one
            // at a time.
            const settling = gait.cadenceHz === 0 &&
              Math.abs(leg.plant.x - center) > 6 &&
              !cat.legs.some((other) => other.mode === "swing");
            const gaitStep = inSwingWindow && !leg.inSwingWindow;
            if (gaitStep || leg.strained || settling) {
              leg.mode = "swing";
              leg.swingT = 0;
              leg.swingStart.x = leg.foot.x;
              leg.swingStart.y = leg.foot.y;
              leg.liftOffAngle = leg.angle;
              // A gait step lasts exactly the swing part of the cycle.
              leg.swingRate = gaitStep ? gait.cadenceHz / (1 - gait.dutyFactor) : 6;
            }
          }
          leg.inSwingWindow = inSwingWindow;

          if (leg.mode === "swing") {
            leg.swingT = Math.min(1, leg.swingT + dt * leg.swingRate);
            const timeLeft = (1 - leg.swingT) / leg.swingRate;
            const moveDir = Math.abs(cat.vx) > 8 ? Math.sign(cat.vx) : cat.facing;
            const aimX = center + cat.vx * timeLeft + moveDir * gait.halfStride;
            const landY = supportSurfaceYForFoot(aimX, hip.x, hip.y);
            const reachX = legHorizontalReach(leg, hip, landY);
            const landX = clampFootX(clamp(aimX, hip.x - reachX, hip.x + reachX), hip.x, hip.y, landY);
            // Hind paws lift higher: the hock folds the foot up under the hip.
            // A paw coming down from a landing just reaches for the ground.
            const swing = swingFootPoint(
              leg.swingStart,
              { x: landX, y: landY },
              leg.swingT,
              leg.landing ? 1.5 : gait.stepLiftPx * (leg.near ? 1 : 0.9) * (isFront ? 1 : 1.2)
            );
            leg.target.x = swing.x;
            leg.target.y = swing.y;
            angleTarget = leg.landing
              ? distalAngle({ isFront, mode: "stance", crouch: cat.pose.sneak })
              : distalAngle({
                isFront,
                mode: "swing",
                swingT: leg.swingT,
                liftOff: leg.liftOffAngle,
                crouch: cat.pose.sneak
              });
            if (leg.swingT >= 1) {
              leg.landing = false;
              leg.mode = "stance";
              leg.plant.x = landX;
              leg.plant.y = landY;
            }
          } else {
            leg.plant.y = supportSurfaceYForFoot(leg.plant.x, hip.x, hip.y);
            leg.target.x = leg.plant.x;
            leg.target.y = leg.plant.y;
            angleTarget = distalAngle({
              isFront,
              mode: "stance",
              reach: (leg.plant.x - center) * cat.facing,
              crouch: cat.pose.sneak
            });
          }
        }

        // The boop itself: the near forepaw lifts and taps toward the mouse,
        // then returns to its step.
        if (cat.pawTap && leg.name === "front-near") {
          const u = clamp(cat.pawTap.t / PAW_TAP_TIME, 0, 1);
          const reachOut = Math.sin(Math.PI * u);
          leg.target.x = lerp(leg.target.x, cat.pawTap.x, reachOut * 0.8);
          leg.target.y = lerp(leg.target.y, cat.pawTap.y - Math.sin(Math.PI * Math.min(u * 1.4, 1)) * 18, reachOut);
          angleTarget = lerp(angleTarget, 0.6, reachOut);
        }

        leg.angle = lerp(leg.angle, angleTarget, 1 - Math.exp(-dt * angleRate));
        // The paw below the wrist or hock hangs at leg.angle from the toes.
        const distalX = Math.sin(leg.angle) * leg.distal * cat.facing;
        const distalY = Math.cos(leg.angle) * leg.distal;
        // The shoulder blade rocks forward as the forepaw reaches ahead and
        // back as it pushes off, moving the shoulder joint with it.
        let shoulder = hip;
        if (isFront) {
          const ahead = (leg.target.x - hip.x) * cat.facing - lerp(leg.standX, leg.stanceX, speedRatio);
          const rock = 0.35 + clamp(ahead / 40, -1, 1) * 0.5;
          const blade = bodyToWorldVector(Math.sin(rock) * leg.blade * cat.facing, Math.cos(rock) * leg.blade, leg.localX);
          shoulder = { x: hip.x + blade.x, y: hip.y + blade.y };
        }
        leg.shoulder.x = shoulder.x;
        leg.shoulder.y = shoulder.y;

        const ankleTarget = { x: leg.target.x - distalX, y: leg.target.y - distalY };
        const maxReach = leg.upper + leg.lower - 0.5;
        const toTargetX = ankleTarget.x - shoulder.x;
        const toTargetY = ankleTarget.y - shoulder.y;
        const toTargetMag = Math.hypot(toTargetX, toTargetY);
        if (toTargetMag > maxReach) {
          const s = maxReach / toTargetMag;
          ankleTarget.x = shoulder.x + toTargetX * s;
          ankleTarget.y = shoulder.y + toTargetY * s;
        }

        const minReachRatio = cat.onGround ? lerp(0.08, 0.16, speedRatio) : 0.14;
        const solved = solveTwoBone(shoulder, ankleTarget, leg.upper, leg.lower, bend, minReachRatio);
        leg.knee.x = solved.joint.x;
        leg.knee.y = solved.joint.y;
        leg.ankle.x = solved.end.x;
        leg.ankle.y = solved.end.y;
        leg.foot.x = solved.end.x + distalX;
        leg.foot.y = solved.end.y + distalY;
        // A planted paw the leg can no longer reach is picked up next frame
        // (or, pushing off, let go).
        leg.strained = (leg.mode === "stance" || leg.pushing) &&
          Math.hypot(leg.foot.x - leg.target.x, leg.foot.y - leg.target.y) > 4;
      }
    }

    function updateTail(dt) {
      // A chain of angular springs: the root follows the line of the rump and
      // each segment chases its parent's angle plus a gentle curl. Stiffness
      // falls toward the tip, so movement ripples down the tail and settles
      // smoothly, with a little overshoot.
      ensureDynamicPoseState();
      const base = bodyPoint(TAIL_BASE.x * cat.facing, TAIL_BASE.y);
      const speedRatio = clamp(Math.abs(cat.vx) / 320, 0, 1);
      const backAngle = cat.facing > 0 ? Math.PI : 0;
      // Lift is measured toward "up" for either facing: the root droops a little
      // and the segments curl upward into a relaxed J. Running flattens it,
      // falling raises it, landing throws it up for balance, and forward
      // acceleration makes it lag behind. Sneaking keeps it low and long.
      // Stuck in a curtain, the tail hangs down and lashes as the cat wriggles.
      const lash = cat.cling ? Math.sin(cat.cling.t * 7) * (0.15 + cat.cling.struggle * 0.35) - 0.12 : 0;
      const lift =
        -0.42 +
        lash +
        speedRatio * 0.2 +
        (cat.onGround || cat.cling ? 0 : 0.12) +
        clamp(cat.vy / 1500, -0.25, 0.3) +
        cat.pose.land * 0.45 -
        clamp((cat.ax * cat.facing) / 9000, -0.15, 0.15) -
        cat.pose.sneak * 0.12;
      // The root carries on from the rump: the torso's tilt, and part of the
      // spine's bend there.
      const rump = cat.pose.tilt + cat.facing * spinePoint(SPINE_REAR_X, 0).angle * 0.6;
      const rootTarget = backAngle + rump + cat.facing * lift;
      const curl = cat.facing * (0.2 - speedRatio * 0.1 - cat.pose.sneak * 0.12);

      const angles = cat.tail.angles;
      const velocities = cat.tail.velocities;
      const last = angles.length - 1;
      const steps = 3;
      const h = dt / steps;
      for (let step = 0; step < steps; step += 1) {
        for (let i = 0; i <= last; i += 1) {
          // A lazy swish travels down the tail; it quickens at a run.
          const wave = Math.sin(nowSeconds * (1.6 + speedRatio * 2.2) - i * 0.6) *
            (0.02 + speedRatio * 0.02) * (0.4 + i * 0.14);
          const parent = i === 0 ? rootTarget : angles[i - 1];
          let delta = normalizeAngle(parent + curl + wave - angles[i]);
          // On a turn-around, sweep over the back instead of under the belly.
          if (i === 0 && Math.abs(delta) > 1.5 && Math.sin(angles[0] + delta / 2) > 0.3) {
            delta -= Math.sign(delta) * TAU;
          }
          const stiffness = lerp(260, 70, i / last);
          const damping = 2 * Math.sqrt(stiffness) * 0.72;
          velocities[i] += (stiffness * delta - damping * velocities[i]) * h;
          angles[i] += velocities[i] * h;
        }
      }

      cat.tail.joints[0].x = base.x;
      cat.tail.joints[0].y = base.y;
      for (let i = 0; i <= last; i += 1) {
        cat.tail.joints[i + 1].x = cat.tail.joints[i].x + Math.cos(angles[i]) * cat.tail.lengths[i];
        cat.tail.joints[i + 1].y = cat.tail.joints[i].y + Math.sin(angles[i]) * cat.tail.lengths[i];
      }
    }

    function updateBlink(dt) {
      // Randomized blink interval keeps the face alive while idle.
      cat.head.blinkTimer -= dt;
      if (cat.head.blinkTimer <= 0) {
        cat.head.blinkT = 0;
        cat.head.blinkTimer = 2.4 + Math.random() * 3.6;
      }
      if (cat.head.blinkT < BLINK_DURATION) {
        cat.head.blinkT += dt;
        cat.head.blink = Math.sin(Math.PI * clamp(cat.head.blinkT / BLINK_DURATION, 0, 1));
      } else {
        cat.head.blink = 0;
      }
    }

    function updateHead(dt) {
      // Head tracks a forward-biased look target and remains upright via
      // facing-aware pitch clamping in drawHead().
      updateBlink(dt);
      const neckBase = bodyPoint(40 * cat.facing, -8);
      const speed = Math.abs(cat.vx);
      // Sneaking, the head drops to the line of the back and stretches forward.
      // In a leap it looks up where it's going, then down at the landing. The
      // gaze rises and dips with the shoulders as the body pitches (but not
      // with the gait's bob), so a nose-down descent doesn't tip the head up.
      const pitchLift = neckBase.y - (cat.y + cat.pose.bob - RIG_LIFT - 8);
      let lookX = cat.x + cat.facing * (58 + clamp(speed / 310, 0, 1) * 18 + cat.pose.sneak * 14);
      let lookY = cat.y - RIG_LIFT - 30 + pitchLift + Math.sin(nowSeconds * 4.5) * 2 * (1 - cat.pose.sneak) + cat.vy * 0.008 +
        Math.max(0, cat.vy) * 0.008 +
        cat.pose.land * 6 + (cat.onGround ? clamp(speed / 330, 0, 1.4) * 12 : 0) + cat.pose.sneak * 34;
      // Stalking: the head lowers as a visible mouse ahead gets closer.
      const prey = preyAhead();
      if (prey) lookY += clamp(1 - Math.abs(prey.x - cat.x) / 340, 0, 1) * 16;
      // Hanging in a curtain, the head turns out from the cloth, a little up.
      if (cat.cling) {
        lookX = neckBase.x + cat.facing * 32;
        lookY = neckBase.y + 4 + Math.sin(cat.cling.t * 3.1) * 3;
      }
      // The forward reach eases between poses. It is measured from the body
      // the way the cat faces, so it never lags a run or a turn.
      const reach = (lookX - cat.x) * cat.facing;
      cat.head.reach = cat.head.reach === undefined ? reach : lerp(cat.head.reach, reach, 1 - Math.exp(-dt * 14));
      lookX = cat.x + cat.facing * cat.head.reach;
      // The gaze's height above the body goes through a spring filter, as
      // real animals steady their heads: it settles calmly after a landing
      // or a change of pose. Only the height relative to the body is
      // filtered, so the head goes up and down with a leap rather than
      // trailing behind it.
      const bodyY = cat.y - RIG_LIFT;
      if (!cat.head.lookFilter) cat.head.lookFilter = createSecondOrder(4.5, 0.9, 0, lookY - bodyY);
      lookY = bodyY + stepSecondOrder(cat.head.lookFilter, lookY - bodyY, dt);

      const solved = solveTwoBone(
        neckBase,
        { x: lookX, y: lookY },
        cat.head.neckUpper,
        cat.head.neckLower,
        -cat.facing,
        0.1
      );

      cat.head.neckBase = neckBase;
      cat.head.neckJoint = solved.joint;
      cat.head.pos = solved.end;
    }

    function updateImpacts(wasOnGround, fallSpeed, takeoffY) {
      // Take-off kicks up a small puff; a hard landing adds squash and a
      // bigger burst scaled by impact speed.
      if (cat.justJumped) {
        cat.justJumped = false;
        spawnDust(cat.x, takeoffY, 10, 30, 120);
        sfx.jump();
      }
      if (!wasOnGround && cat.onGround) {
        game.landedAt = nowSeconds;
        game.justLanded = true;
      }
      if (!wasOnGround && cat.onGround && fallSpeed > 300) {
        const impact = clamp(fallSpeed / 1500, 0, 1);
        cat.pose.land = Math.max(cat.pose.land, 0.35 + impact * 0.65);
        spawnDust(cat.x, colliderRectAt().bottom, Math.round(6 + impact * 8), 34, 90 + impact * 110);
        sfx.land(impact);
        // A big drop (off the bookcase) shakes the room a little.
        if (fallSpeed > 1300) game.shake = Math.max(game.shake, 3);
      }
    }

    function saveBest() {
      try {
        localStorage.setItem(BEST_SCORE_KEY, String(game.best));
      } catch {
        // Best score stays for this session only.
      }
    }

    // Puts the score being named into the high scores and stores them.
    function saveHighScore() {
      const name = cleanName(game.entry.name);
      game.highScores = addHighScore(game.highScores, { name, score: game.score, wave: game.wave });
      game.savedRank = game.entry.rank;
      game.entry = null;
      game.playerName = name;
      sfx.waveClear();
      try {
        localStorage.setItem(HIGH_SCORES_KEY, JSON.stringify(game.highScores));
        localStorage.setItem(PLAYER_NAME_KEY, name);
      } catch {
        // The high scores last for this session only.
      }
    }

    // Typing a name for a high score: letters, digits, spaces and a few
    // marks, Backspace, Enter to save and Esc to skip. Keys only count once
    // the game-over card is up, so keys still held from the game don't type.
    // Returns whether the key was used (browser shortcuts are left alone).
    function typeName(e) {
      const entry = game.entry;
      const chars = Array.from(entry.name);
      const shortcut = e.metaKey || (e.ctrlKey && !e.altKey);
      if (shortcut) return false;
      if (nowSeconds - game.overAt < RESTART_DELAY) return true;
      if (e.key === "Enter") {
        if (!e.repeat) saveHighScore();
      } else if (e.key === "Escape") {
        game.entry = null;
      } else if (e.key === "Backspace") {
        entry.name = chars.slice(0, -1).join("");
      } else if (/^[\p{L}\p{N} '.-]$/u.test(e.key)) {
        const doubleSpace = e.key === " " && (!chars.length || chars[chars.length - 1] === " ");
        if (chars.length < NAME_MAX && !doubleSpace) entry.name += e.key;
      } else {
        return e.key.startsWith("Arrow");
      }
      return true;
    }

    function addScore(points) {
      game.score += points;
      if (game.score > game.best) {
        game.best = game.score;
        saveBest();
      }
    }

    function showBanner(title, text, duration = 2.2) {
      game.banner = { title, text, t: 0, duration };
    }

    function startGame() {
      Object.assign(game, {
        state: "playing",
        paused: false,
        score: 0,
        boops: 0,
        cheese: MAX_CHEESE,
        streak: 0,
        lastBoopAt: -10,
        catnip: null,
        zoomies: 0,
        cheeseFlash: 0,
        dog: null,
        dogWarn: null,
        dizzy: 0,
        entry: null,
        savedRank: -1
      });
      mice.length = 0;
      popups.length = 0;
      cheeseBits.length = 0;
      startWave(1);
    }

    function startWave(n) {
      game.wave = n;
      game.waveCfg = waveConfig(n);
      game.queue = game.waveCfg.count;
      game.cheeseLostThisWave = 0;
      game.goldPending = Math.random() < game.waveCfg.goldChance;
      game.spawnTimer = 1.6;
      game.catnipIn = 5 + Math.random() * 6;
      game.dogsLeft = game.waveCfg.dogs;
      game.dogIn = 5 + Math.random() * 4;
      showBanner(`Wave ${n}`, waveIntro(n));
      sfx.waveStart();
    }

    function endGame() {
      game.state = "over";
      game.overAt = nowSeconds;
      game.banner = null;
      game.catnip = null;
      game.zoomies = 0;
      game.shake = 8;
      sfx.gameOver();
      // A score that makes the high scores asks for a name, starting from
      // the last one typed.
      const rank = highScoreRank(game.highScores, game.score);
      game.entry = rank >= 0 ? { rank, name: game.playerName } : null;
      game.savedRank = -1;
      // The remaining mice scatter for the nearest hole.
      for (const m of mice) {
        if (m.state !== "booped") startFlee(m);
      }
    }

    // Mice of the current wave still to deal with: queued plus out in the room.
    function waveMiceRemaining() {
      return game.queue + mice.filter((m) => m.state !== "booped" && m.kind !== "gold").length;
    }

    function spawnMouse(kind) {
      // Mice come out of a free hole away from the cat and head for another
      // hole. Returns false when every hole already has a mouse at it.
      const holes = world.holes;
      if (holes.length < 2) return false;
      const free = holes.filter((h) => !mice.some((m) => Math.abs(m.x - h.x) < 40));
      if (!free.length) return false;
      const safe = free.filter((h) => Math.abs(h.x - cat.x) > 220);
      const pool = safe.length ? safe : free;
      const home = pool[Math.floor(Math.random() * pool.length)];
      // Mice cross to the farthest hole, so every run passes through the room.
      const target = holes.reduce((far, h) => (Math.abs(h.x - home.x) > Math.abs(far.x - home.x) ? h : far));
      const cfg = game.waveCfg;
      const traits = MOUSE_KINDS[kind];
      mice.push({
        kind,
        x: home.x,
        dir: Math.sign(target.x - home.x) || 1,
        home,
        target,
        state: "peek",
        // Every mouse sets off carrying cheese; the golden mouse's is golden.
        cheese: kind === "gold" ? "gold" : "cheese",
        t: cfg.peek * (0.8 + Math.random() * 0.5),
        speed: 0,
        runSpeed: cfg.runSpeed + traits.runBoost + Math.random() * 40,
        fleeSpeed: cfg.fleeSpeed + traits.fleeBoost,
        reaction: cfg.reaction * traits.reactionScale,
        pauseIn: 0.5 + Math.random() * 1.2,
        stride: 0
      });
      sfx.peep();
      return true;
    }

    function mouseShade(m) {
      // 1 while inside its home or target hole, 0 once clear of it.
      let shade = 0;
      for (const hole of [m.home, m.target]) {
        shade = Math.max(shade, 1 - Math.abs(m.x - hole.x) / (MOUSE_HOLE.w * 0.75));
      }
      return clamp(shade, 0, 1);
    }

    function catThreatRadius() {
      // A cat up on the furniture goes unnoticed; a running cat is spotted early.
      if (cat.onGround && cat.supportSurface !== "floor") return 0;
      // The base radius keeps a mouse from skidding into a standing cat's paws.
      // Sneaking lets the cat get closer, but still not right up to a mouse.
      if (cat.sneaking) return 70 + Math.abs(cat.vx) * 0.1;
      return 100 + Math.abs(cat.vx) * 0.2;
    }

    function holeAhead(x, dir) {
      // Closest hole at or ahead of x in direction dir.
      let best = null;
      for (const hole of world.holes) {
        const ahead = (hole.x - x) * dir;
        if (ahead > -2 && (!best || ahead < (best.x - x) * dir)) best = hole;
      }
      return best;
    }

    function startFlee(m) {
      const away = Math.sign(m.x - cat.x) || m.dir;
      const hole = holeAhead(m.x, away) ?? holeAhead(m.x, -away);
      m.target = hole;
      m.dir = Math.sign(hole.x - m.x) || away;
      m.state = "flee";
      // The first burst matches the cat's run; after it the mouse tires.
      m.t = 0.7;
    }

    function pawCanBoop(m) {
      // A front paw boops a mouse on the nose when the paws are near the floor
      // and the mouse is between the chest and just past the leading paw. A
      // mouse still inside a hole or behind the box is out of reach.
      if (mouseShade(m) > 0.5) return false;
      const box = boxRect();
      if (m.x > box.left && m.x < box.right) return false;
      let lead = -Infinity;
      let lowest = Infinity;
      for (const leg of cat.legs) {
        if (!leg.name.includes("front")) continue;
        lead = Math.max(lead, leg.foot.x * cat.facing);
        lowest = Math.min(lowest, floorY - leg.foot.y);
      }
      if (lowest > 24) return false;
      const along = m.x * cat.facing;
      // Zoomies make for a longer swipe.
      const reach = game.zoomies > 0 ? 30 : 16;
      return along > cat.x * cat.facing + 4 && along < lead + reach;
    }

    function spawnSparkles(x, y, count, rgb, power = 1) {
      for (let i = 0; i < count; i += 1) {
        const angle = -Math.PI * (0.08 + Math.random() * 0.84);
        const speed = (70 + Math.random() * 120) * power;
        sparkles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2.5 + Math.random() * 2.5,
          rgb,
          life: 0,
          maxLife: 0.45 + Math.random() * 0.3
        });
      }
    }

    function boopMouse(m) {
      // A boop from the air or right on landing is a flying boop. The mouse
      // drops its cheese, gets a heart, and trots home empty-pawed.
      const flying = !cat.onGround || nowSeconds - game.landedAt < 0.25;
      game.streak = nextCombo(game.streak, nowSeconds - game.lastBoopAt);
      game.lastBoopAt = nowSeconds;
      const points = scoreBoop({ kind: m.kind, flying, streak: game.streak });
      addScore(points);
      game.boops += 1;
      if (flying) game.shake = Math.max(game.shake, 3);
      sfx.boop(game.streak);
      cat.pawTap = { t: 0, x: m.x, y: floorY - 6 };
      cheeseBits.push({
        x: m.x + m.dir * 16,
        y: floorY - 10,
        vx: m.dir * 60,
        vy: -300,
        angle: 0,
        spin: m.dir * 7,
        gold: m.cheese === "gold",
        life: 0
      });
      m.state = "booped";
      m.cheese = null;
      m.t = 0;
      m.speed = 0;
      m.target = m.home;
      m.dir = Math.sign(m.home.x - m.x) || m.dir;
      const tags = [];
      if (flying) tags.push("Flying boop!");
      if (game.streak > 1) tags.push(`Streak ×${game.streak}`);
      popups.push({ x: m.x, y: floorY - 40, text: `Boop! +${points}`, sub: tags.join("  "), color: SCENE.popup, life: 0 });
      spawnSparkles(m.x, floorY - 10, m.kind === "gold" ? 24 : 12, SCENE.sparkle);
    }

    function mouseReachedHole(m) {
      // Only counts during play. A regular mouse that gets across steals a
      // piece of cheese; one that retreated home will come out again.
      if (game.state !== "playing") return;
      if (!MOUSE_KINDS[m.kind].stealsCheese) {
        popups.push({ x: m.target.x, y: floorY - 40, text: "Got away!", color: SCENE.hudMuted, life: 0 });
        return;
      }
      if (m.target === m.home) {
        game.queue += 1;
        return;
      }
      game.cheese -= 1;
      game.cheeseLostThisWave += 1;
      game.cheeseFlash = 1;
      game.streak = 0;
      popups.push({ x: m.target.x, y: floorY - 40, text: "Cheese stolen!", color: SCENE.danger, life: 0 });
      sfx.steal();
      if (game.cheese <= 0) endGame();
    }

    function updateMice(dt) {
      if (game.state === "playing" && game.nextWaveIn <= 0) {
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          const cfg = game.waveCfg;
          const out = mice.filter((m) => m.state !== "booped" && m.kind !== "gold").length;
          let spawned = false;
          // The golden mouse slips out once, from halfway through the wave,
          // and doesn't take one of the wave's slots.
          if (game.goldPending && game.queue <= cfg.count / 2) {
            spawned = spawnMouse("gold");
            if (spawned) game.goldPending = false;
          } else if (game.queue > 0 && out < cfg.maxOut) {
            spawned = spawnMouse(Math.random() < cfg.brownChance ? "brown" : "grey");
            if (spawned) game.queue -= 1;
          }
          game.spawnTimer = spawned ? cfg.spawnGap * (0.7 + Math.random() * 0.6) : 0.5;
        }
      }
      const threat = catThreatRadius();

      for (let i = mice.length - 1; i >= 0; i -= 1) {
        const m = mice[i];
        m.t -= dt;
        if (m.state === "booped") {
          // A short happy pause (with a heart), then home it goes.
          m.speed = approach(m.speed, m.t > -0.5 ? 0 : m.runSpeed, 1100 * dt);
          m.x += m.dir * m.speed * dt;
          m.stride += m.speed * dt * 0.12;
          if ((m.target.x - m.x) * m.dir <= 0) mice.splice(i, 1);
          continue;
        }
        const catNear = Math.abs(m.x - cat.x) < threat;

        if (m.state === "peek") {
          // A mouse that spots the cat while peeking ducks back in and tries
          // again later.
          if (catNear) {
            mice.splice(i, 1);
            if (game.state === "playing") {
              if (m.kind === "gold") game.goldPending = true;
              else game.queue += 1;
            }
            continue;
          }
          if (m.t <= 0) m.state = "run";
        } else if (m.state === "run" || m.state === "pause") {
          if (catNear) {
            // Real mice freeze for a moment before they bolt.
            m.state = "startle";
            m.t = m.reaction * (0.6 + Math.random() * 0.8);
            if (nowSeconds - game.squeakAt > 0.3) {
              sfx.squeak();
              game.squeakAt = nowSeconds;
            }
          } else if (m.state === "run") {
            m.pauseIn -= dt;
            if (m.pauseIn <= 0) {
              m.state = "pause";
              m.t = 0.25 + Math.random() * 0.45;
              m.pauseIn = 0.7 + Math.random() * 1.4;
            }
          } else if (m.t <= 0) {
            m.state = "run";
          }
        } else if (m.state === "startle") {
          if (m.t <= 0) startFlee(m);
        } else if (m.state === "flee" && catNear && Math.sign(m.x - cat.x) !== m.dir && m.t < 0.45) {
          // The cat got past (a leap over it): turn for the nearest hole behind.
          startFlee(m);
        }

        // A landing close by startles any mouse that is out in the open.
        if (game.justLanded && m.state !== "peek" && Math.abs(m.x - cat.x) < 130 && cat.supportSurface === "floor") {
          m.state = "startle";
          m.t = 0.22;
        }

        const targetSpeed = m.state === "run"
          ? m.runSpeed
          : m.state === "flee"
            ? (m.t > 0 ? m.fleeSpeed : m.runSpeed * 1.1)
            : 0;
        // Mice stop and bolt almost instantly; easing is only for strolling.
        const snappy = m.state === "flee" || m.state === "startle";
        m.speed = approach(m.speed, targetSpeed, (snappy ? 2600 : 1100) * dt);
        m.x += m.dir * m.speed * dt;
        m.stride += m.speed * dt * 0.12;
        // The golden mouse leaves a little glitter.
        if (m.kind === "gold" && m.speed > 20 && Math.random() < dt * 12) {
          spawnSparkles(m.x - m.dir * 8, floorY - 8, 1, SCENE.sparkle, 0.3);
        }

        if ((m.target.x - m.x) * m.dir <= 0 && m.state !== "peek") {
          mice.splice(i, 1);
          mouseReachedHole(m);
          continue;
        }
        if (game.state === "playing" && pawCanBoop(m)) boopMouse(m);
      }
      game.justLanded = false;
    }

    function preyAhead() {
      // Nearest mouse out in the open in front of the cat, if any.
      let best = null;
      for (const m of mice) {
        if (m.state === "booped" || mouseShade(m) > 0.6) continue;
        const ahead = (m.x - cat.x) * cat.facing;
        if (ahead > 0 && ahead < 340 && (!best || ahead < (best.x - cat.x) * cat.facing)) best = m;
      }
      return best;
    }

    function updateCatnip(dt) {
      // From wave 3 a sprig of catnip appears on the box now and then; touching
      // it gives a few seconds of zoomies. It wilts if left too long.
      game.zoomies = Math.max(0, game.zoomies - dt);
      if (game.state !== "playing" || !game.waveCfg.catnip) return;
      const nip = game.catnip;
      if (!nip) {
        if (game.zoomies > 0) return;
        game.catnipIn -= dt;
        if (game.catnipIn <= 0) {
          const spots = walkableSurfaces().filter((surface) => surface.kind !== "floor");
          const spot = spots[Math.floor(Math.random() * spots.length)];
          const left = Math.max(spot.left, cat.collider.w / 2 + 84);
          const right = Math.min(spot.right, ROOM_W - cat.collider.w / 2 - 84);
          game.catnip = { x: lerp(left, right, 0.25 + Math.random() * 0.5), y: spot.top, t: 0 };
        }
        return;
      }
      nip.t += dt;
      const rect = colliderRectAt();
      if (rect.right > nip.x - 8 && rect.left < nip.x + 8 && rect.bottom > nip.y - 24 && rect.top < nip.y) {
        game.catnip = null;
        game.zoomies = ZOOMIES_DURATION;
        game.catnipIn = 14 + Math.random() * 10;
        sfx.powerUp();
        popups.push({ x: nip.x, y: nip.y - 34, text: "Zoomies!", color: SCENE.catnip, life: 0 });
        spawnSparkles(nip.x, nip.y - 10, 14, SCENE.zoomies);
      } else if (nip.t > CATNIP_LIFETIME) {
        game.catnip = null;
        game.catnipIn = 8 + Math.random() * 8;
      }
    }

    // Whether the dog is running close by (x, y) on the floor.
    function dogNear(x, y, radius) {
      return !!game.dog && Math.abs(game.dog.x - x) < radius && y > floorY - 140;
    }

    function updateDogRun(dt) {
      // From wave 6: a warning bark at the edge it will come from, then the
      // dog gallops across. Jumping clean over it scores; getting bumped
      // leaves the cat dizzy and the dog runs off with a piece of cheese.
      game.dizzy = Math.max(0, game.dizzy - dt);
      const dog = game.dog;
      if (dog) {
        const sideBefore = Math.sign(dog.x - cat.x);
        updateDog(dog, dt);
        for (const leg of dog.legs) {
          if (leg.justPlanted) spawnDust(leg.foot.x, floorY, 2, 5, 55);
        }
        const box = dogHitBox(dog);
        const rect = colliderRectAt();
        const overlapsDog = rect.right > box.left && rect.left < box.right;
        // A jump that already cleared the dog's middle doesn't count as a bump
        // if the cat comes down on its rump.
        if (game.state === "playing" && overlapsDog && rect.bottom > box.top && !dog.bumped && !dog.cleared && game.dizzy <= 0) {
          bumpCat(dog);
        }
        if (game.state === "playing" && !dog.bumped && !dog.cleared && !cat.onGround &&
          Math.sign(dog.x - cat.x) !== sideBefore && rect.bottom <= box.top) {
          dog.cleared = true;
          const points = DOG_HOP_POINTS;
          addScore(points);
          popups.push({ x: cat.x, y: rect.top - 20, text: `Over the dog! +${points}`, color: SCENE.popup, life: 0 });
          spawnSparkles(cat.x, rect.bottom, 10, SCENE.sparkle, 1);
          sfx.hopOver();
        }
        if (dog.x < -220 || dog.x > ROOM_W + 220) {
          game.dog = null;
          game.dogIn = 6 + Math.random() * 5;
        }
        return;
      }
      if (game.state !== "playing" || game.nextWaveIn > 0) {
        game.dogWarn = null;
        return;
      }
      if (game.dogWarn) {
        game.dogWarn.t += dt;
        if (game.dogWarn.t >= DOG_WARNING) {
          const dir = game.dogWarn.dir;
          game.dog = createDog({ x: dir > 0 ? -150 : ROOM_W + 150, dir, speed: DOG_SPEED, floorY });
          game.dogWarn = null;
          game.dogsLeft -= 1;
        }
      } else if (game.dogsLeft > 0) {
        game.dogIn -= dt;
        if (game.dogIn <= 0) {
          game.dogWarn = { t: 0, dir: Math.random() < 0.5 ? 1 : -1 };
          sfx.bark();
        }
      }
    }

    function bumpCat(dog) {
      // Bowled over: knocked back and dizzy, one cheese lost (the dog
      // trots off with it in its mouth). Nobody gets hurt.
      dog.bumped = true;
      dog.cheese = true;
      game.dizzy = DIZZY_TIME;
      Body.setVelocity(physics.catBody, { x: (dog.dir * 300) / MATTER_FPS, y: -820 / MATTER_FPS });
      game.cheese -= 1;
      game.cheeseLostThisWave += 1;
      game.cheeseFlash = 1;
      game.streak = 0;
      game.shake = Math.max(game.shake, 6);
      popups.push({ x: cat.x, y: colliderRectAt().top - 60, text: "Oof! The dog took a cheese", color: SCENE.danger, life: 0 });
      sfx.bump();
      if (game.cheese <= 0) endGame();
    }

    function updateGame(dt) {
      game.shake = game.shake > 0.1 ? game.shake * Math.exp(-dt * 8) : 0;
      game.cheeseFlash = Math.max(0, game.cheeseFlash - dt * 1.5);
      if (game.banner) {
        game.banner.t += dt;
        if (game.banner.t > game.banner.duration) game.banner = null;
      }
      if (game.toast) {
        game.toast.t += dt;
        if (game.toast.t > 1.4) game.toast = null;
      }
      updateCatnip(dt);
      updateDogRun(dt);
      // Zoomies leave a trail of green sparkles behind a running cat.
      if (game.zoomies > 0 && Math.abs(cat.vx) > 60 && Math.random() < dt * 40) {
        const rump = bodyPoint(-40 * cat.facing, -6);
        spawnSparkles(rump.x, rump.y, 1, SCENE.zoomies, 0.4);
      }
      if (game.state !== "playing") return;

      if (game.nextWaveIn > 0) {
        game.nextWaveIn -= dt;
        if (game.nextWaveIn <= 0) startWave(game.wave + 1);
        return;
      }
      const miceOut = mice.some((m) => m.state !== "booped" && m.kind !== "gold");
      if (game.queue === 0 && !game.goldPending && !miceOut) {
        // Wave cleared. Losing no cheese earns a piece back.
        const perfect = game.cheeseLostThisWave === 0;
        const bonus = waveClearBonus(game.wave, perfect);
        addScore(bonus);
        let text = `+${bonus} bonus`;
        if (perfect && game.cheese < MAX_CHEESE) {
          game.cheese += 1;
          text += " · no cheese lost: +1 cheese";
        } else if (perfect) {
          text += " · no cheese lost!";
        }
        showBanner(`Wave ${game.wave} cleared!`, text, 2.4);
        sfx.waveClear();
        game.nextWaveIn = 2.8;
      }
    }

    function updateEffects(dt) {
      for (let i = cheeseBits.length - 1; i >= 0; i -= 1) {
        const bit = cheeseBits[i];
        bit.life += dt;
        if (bit.life > 0.9) {
          cheeseBits.splice(i, 1);
          continue;
        }
        bit.x += bit.vx * dt;
        bit.y += bit.vy * dt;
        bit.vy += 900 * dt;
        bit.angle += bit.spin * dt;
      }
      for (let i = popups.length - 1; i >= 0; i -= 1) {
        popups[i].life += dt;
        if (popups[i].life > 1.1) popups.splice(i, 1);
      }
      for (let i = sparkles.length - 1; i >= 0; i -= 1) {
        const p = sparkles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          sparkles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 320 * dt;
        p.vx *= Math.exp(-dt * 3);
      }
    }

    // Bonus animals: grasshoppers, flies and a little bird. Booping them
    // scores (they never take cheese), and each one dodges the cat its own
    // way. They roam on every screen; points only count during a game.
    function sneakFactor() {
      return cat.sneaking ? 0.45 : 1;
    }

    function catDistanceTo(x, y) {
      return Math.hypot(cat.x - x, cat.y - RIG_LIFT - y);
    }

    function catTouches(x, y, radius) {
      // The cat's head or a front paw within reach of a point.
      if (Math.hypot(cat.head.pos.x - x, cat.head.pos.y - y) < radius + 14) return true;
      return cat.legs.some((leg) => leg.name.includes("front") && Math.hypot(leg.foot.x - x, leg.foot.y - y) < radius);
    }

    function boopCritter(c, sound) {
      if (game.state === "playing") {
        const flying = !cat.onGround || nowSeconds - game.landedAt < 0.25;
        game.streak = nextCombo(game.streak, nowSeconds - game.lastBoopAt);
        game.lastBoopAt = nowSeconds;
        const points = scoreBoop({ kind: c.kind, flying, streak: game.streak });
        addScore(points);
        game.boops += 1;
        const tags = [];
        if (flying) tags.push("Flying boop!");
        if (game.streak > 1) tags.push(`Streak ×${game.streak}`);
        popups.push({ x: c.x, y: c.y - 30, text: `Boop! +${points}`, sub: tags.join("  "), color: SCENE.popup, life: 0 });
      }
      sound();
      cat.pawTap = { t: 0, x: c.x, y: c.y - 4 };
      spawnSparkles(c.x, c.y - 6, 10, SCENE.sparkle);
      c.state = "booped";
      c.t = 0;
    }

    function landingSurfaceTop(x, prevY, y) {
      // The highest surface a falling point crossed this frame at x, if any.
      for (const surface of walkableSurfaces()) {
        if (x < surface.left || x > surface.right) continue;
        if (prevY <= surface.top && y >= surface.top) return surface.top;
      }
      return null;
    }

    function spawnGrasshopper() {
      const fromLeft = Math.random() < 0.5;
      critters.push({
        kind: "grasshopper",
        x: fromLeft ? -12 : ROOM_W + 12,
        y: floorY - 70,
        vx: (fromLeft ? 1 : -1) * (190 + Math.random() * 90),
        vy: -360,
        dir: fromLeft ? 1 : -1,
        state: "hop",
        t: 0,
        spin: 0,
        life: 25 + Math.random() * 10,
        leaving: false
      });
    }

    function hop(g, vx, vy) {
      g.state = "hop";
      g.vx = vx;
      g.vy = vy;
      g.dir = Math.sign(vx) || g.dir;
    }

    // Each update returns true when the animal has left and can be removed.
    function updateGrasshopper(g, dt) {
      g.life -= dt;
      if (g.state === "booped") {
        // Boing! Up and away, tumbling.
        g.vy += 1400 * dt;
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        g.spin += dt * 14;
        return g.y > ROOM_H + 60 || g.x < -60 || g.x > ROOM_W + 60;
      }
      if (g.state === "hop") {
        const prevY = g.y;
        g.vy += 1800 * dt;
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        if (g.leaving) {
          if (g.x < -30 || g.x > ROOM_W + 30) return true;
        } else if ((g.x < 14 && g.vx < 0 && g.vy > -300) || (g.x > ROOM_W - 14 && g.vx > 0 && g.vy > -300)) {
          g.vx = -g.vx;
          g.dir = -g.dir;
        }
        const top = g.vy > 0 ? landingSurfaceTop(g.x, prevY, g.y) : null;
        if (top !== null) {
          g.y = top;
          g.state = "sit";
          g.vx = 0;
          g.vy = 0;
          g.t = 1.2 + Math.random() * 2.6;
        }
      } else {
        // Sitting: a big escape hop when the cat comes close, small hops
        // otherwise, and out of the room when it's had enough.
        g.t -= dt;
        if (catDistanceTo(g.x, g.y) < 140 * sneakFactor() || dogNear(g.x, g.y, 170)) {
          const away = Math.sign(g.x - (dogNear(g.x, g.y, 170) ? game.dog.x : cat.x)) || 1;
          hop(g, away * (240 + Math.random() * 90), -(580 + Math.random() * 140));
        } else if (g.life <= 0) {
          g.leaving = true;
          hop(g, (g.x < ROOM_W / 2 ? -1 : 1) * 260, -480);
        } else if (g.t <= 0) {
          hop(g, (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 90), -(380 + Math.random() * 160));
        }
      }
      if (catTouches(g.x, g.y - 5, 16)) {
        boopCritter(g, sfx.boing);
        g.vx = (Math.sign(g.x - cat.x) || 1) * 180;
        g.vy = -1000;
      }
      return false;
    }

    function flyRestSpots() {
      // Tops of the furniture and the floor lamp's shade.
      const spots = walkableSurfaces()
        .filter((surface) => surface.kind !== "floor")
        .map((surface) => ({ x: lerp(surface.left + 10, surface.right - 10, Math.random()), y: surface.top - 3 }));
      spots.push({ x: world.floorLamp.x + (Math.random() - 0.5) * 30, y: world.floorLamp.top - 3 });
      return spots;
    }

    function pickFlyTarget(f) {
      // Wander the air above the floor; now and then settle somewhere.
      if (Math.random() < 0.25) {
        const spots = flyRestSpots();
        const spot = spots[Math.floor(Math.random() * spots.length)];
        f.tx = spot.x;
        f.ty = spot.y;
        f.restAfter = true;
      } else {
        const top = Math.max(90, floorY - 330);
        f.tx = 40 + Math.random() * (ROOM_W - 80);
        f.ty = lerp(top, floorY - 40, Math.random());
        f.restAfter = false;
      }
      f.retarget = 1 + Math.random() * 1.4;
    }

    function spawnFly() {
      const fromLeft = Math.random() < 0.5;
      const fly = {
        kind: "fly",
        x: fromLeft ? -10 : ROOM_W + 10,
        y: floorY - 120 - Math.random() * 160,
        vx: 0,
        vy: 0,
        dir: fromLeft ? 1 : -1,
        state: "buzz",
        t: 0,
        phase: Math.random() * 10,
        life: 22 + Math.random() * 10,
        leaving: false
      };
      pickFlyTarget(fly);
      critters.push(fly);
    }

    function updateFly(f, dt) {
      f.life -= dt;
      f.phase += dt;
      if (f.state === "booped") {
        // Dizzy loops, then off it zips.
        f.t += dt;
        f.x += f.vx * dt + Math.cos(f.t * 12) * 90 * dt;
        f.y += f.vy * dt + Math.sin(f.t * 12) * 90 * dt;
        return f.x < -40 || f.x > ROOM_W + 40 || f.y < -40;
      }
      // Flies dart away when the cat's head comes near; a resting fly lets
      // it come a little closer.
      const headDist = Math.hypot(cat.head.pos.x - f.x, cat.head.pos.y - f.y);
      if (f.state !== "dart" && headDist < (f.state === "rest" ? 55 : 80) * sneakFactor()) {
        const ax = f.x - cat.head.pos.x;
        const ay = f.y - cat.head.pos.y;
        const len = Math.hypot(ax, ay) || 1;
        f.vx = (ax / len) * 330;
        f.vy = (ay / len) * 330 - 60;
        f.state = "dart";
        f.t = 0.35;
      }
      if (f.state === "dart") {
        f.t -= dt;
        if (f.t <= 0) {
          f.state = "buzz";
          pickFlyTarget(f);
        }
      } else if (f.state === "rest") {
        f.t -= dt;
        if (f.t <= 0) {
          f.state = "buzz";
          pickFlyTarget(f);
        }
      } else {
        if (f.life <= 0 && !f.leaving) {
          f.leaving = true;
          f.restAfter = false;
          f.tx = f.x < ROOM_W / 2 ? -60 : ROOM_W + 60;
          f.ty = f.y - 60;
        }
        f.retarget -= dt;
        if (f.retarget <= 0 && !f.leaving && !f.restAfter) pickFlyTarget(f);
        const dx = f.tx - f.x;
        const dy = f.ty - f.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (f.restAfter && dist < 6) {
          f.state = "rest";
          f.t = 1.5 + Math.random() * 2;
          f.vx = 0;
          f.vy = 0;
        } else {
          f.vx += ((dx / dist) * 150 - f.vx) * Math.min(1, dt * 3);
          f.vy += ((dy / dist) * 150 - f.vy) * Math.min(1, dt * 3);
        }
      }
      if (f.state !== "rest") {
        // A buzzy wobble on top of the steering.
        f.x += (f.vx + Math.sin(f.phase * 23) * 40) * dt;
        f.y += (f.vy + Math.cos(f.phase * 19) * 40) * dt;
        if (Math.abs(f.vx) > 10) f.dir = Math.sign(f.vx);
      }
      f.y = Math.min(f.y, floorY - 4);
      if (f.leaving && (f.x < -30 || f.x > ROOM_W + 30)) return true;
      if (catTouches(f.x, f.y, 14)) {
        boopCritter(f, sfx.buzz);
        f.vx = (Math.sign(f.x - cat.x) || 1) * 240;
        f.vy = -110;
      }
      return false;
    }

    function birdPerches() {
      const lamp = lampAttach();
      const bookcase = world.bookcase;
      return [
        // On the dome just beside the cord.
        { name: "lamp", x: lamp.x + Math.cos(world.hangingLamp.angle) * 10, y: lamp.y + 3 - Math.sin(world.hangingLamp.angle) * 10 },
        { name: "bookcase", x: bookcase.x + bookcase.w * 0.72, y: bookcase.levels[2] - 8 },
        { name: "floorLamp", x: world.floorLamp.x, y: world.floorLamp.top },
        { name: "box", x: world.box.x + world.box.w * 0.7, y: world.box.y },
        { name: "sill", x: world.window.x + world.window.w * 0.25, y: world.window.sill },
        { name: "post", x: world.post.x - 12, y: world.post.top }
      ];
    }

    function birdTarget(bird) {
      // A perch name follows its perch (the lamp swings); a floor spot is a point.
      return typeof bird.to === "string" ? birdPerches().find((p) => p.name === bird.to) : bird.to;
    }

    function birdFlyTo(bird, to) {
      bird.state = "fly";
      bird.from = { x: bird.x, y: bird.y };
      bird.to = to;
      bird.flightT = 0;
      const end = birdTarget(bird);
      bird.flightDur = 0.35 + Math.hypot(end.x - bird.x, end.y - bird.y) / 300;
      bird.fleeing = false;
      bird.dir = Math.sign(end.x - bird.x) || bird.dir;
      bird.alert = 0;
      sfx.flap();
    }

    function spawnBird(perched) {
      const bird = { kind: "bird", x: 0, y: 0, dir: -1, state: "perch", perch: "lamp", t: 4 + Math.random() * 4, alert: 0, look: 1, phase: 0 };
      if (perched) {
        const lamp = birdPerches()[0];
        bird.x = lamp.x;
        bird.y = lamp.y;
      } else {
        // Flies in from a top corner to a perch.
        bird.x = Math.random() < 0.5 ? -20 : ROOM_W + 20;
        bird.y = 70 + Math.random() * 60;
        const perches = birdPerches();
        birdFlyTo(bird, perches[Math.floor(Math.random() * perches.length)].name);
      }
      critters.push(bird);
    }

    function updateBird(b, dt) {
      b.phase += dt;
      if (b.state === "booped") {
        // Flutters up and away, happy, and comes back later.
        b.t += dt;
        b.x += b.dir * 230 * dt;
        b.y -= (110 + b.t * 170) * dt;
        if (b.y < -40 || b.x < -40 || b.x > ROOM_W + 40) {
          critterTimers.bird = 15 + Math.random() * 10;
          return true;
        }
        return false;
      }
      // Checked first: a quick enough jump boops the bird before it reacts.
      if (catTouches(b.x, b.y - 8, 24)) {
        boopCritter(b, sfx.tweet);
        b.dir = Math.sign(b.x - cat.x) || 1;
        return false;
      }
      if (b.state === "fly") {
        b.flightT = Math.min(1, b.flightT + dt / b.flightDur);
        const end = birdTarget(b);
        // A startled bird bursts away; otherwise it eases into the flight.
        const u = b.fleeing ? 1 - (1 - b.flightT) ** 2 : smoothstep(b.flightT);
        const q = 1 - u;
        const midX = (b.from.x + end.x) / 2;
        const midY = Math.min(b.from.y, end.y) - (50 + Math.abs(end.x - b.from.x) * 0.15);
        b.x = q * q * b.from.x + 2 * q * u * midX + u * u * end.x;
        b.y = q * q * b.from.y + 2 * q * u * midY + u * u * end.y;
        if (b.flightT >= 1) {
          if (typeof b.to === "string") {
            b.state = "perch";
            b.perch = b.to;
            b.t = 5 + Math.random() * 7;
          } else {
            b.state = "peck";
            b.t = 3 + Math.random() * 3;
          }
        }
        return false;
      }
      if (b.state === "perch") {
        const perch = birdPerches().find((p) => p.name === b.perch);
        b.x = perch.x;
        b.y = perch.y;
      } else if (Math.random() < dt * 0.8) {
        // Pecking along the floor in little hops.
        b.x = clamp(b.x + b.dir * 10, 40, ROOM_W - 40);
      }
      b.t -= dt;
      b.look -= dt;
      if (b.look <= 0) {
        b.look = 0.8 + Math.random() * 1.8;
        if (Math.random() < 0.5) b.dir = -b.dir;
      }
      // The bird is the most alert animal: it spots a running cat from far
      // off and reacts fast, so sneak up (down key) and hop the last bit. A
      // bump of its lamp startles it a little too.
      const radius = ((b.state === "peck" ? 200 : 150) + Math.abs(cat.vx) * 0.25) * sneakFactor();
      const lampBumped = b.perch === "lamp" && b.state === "perch" && nowSeconds - world.hangingLamp.bumpedAt < 0.05;
      if (catDistanceTo(b.x, b.y) < radius) b.alert += dt;
      else b.alert = Math.max(0, b.alert - dt);
      if (lampBumped) b.alert = Math.max(b.alert, 0.08);
      // A galloping dog sends it off at once.
      if (dogNear(b.x, b.y, 260)) b.alert = 1;
      const others = birdPerches().filter((p) => b.state === "peck" || p.name !== b.perch);
      if (b.alert > 0.15) {
        const far = others.reduce((best, p) => (catDistanceTo(p.x, p.y) > catDistanceTo(best.x, best.y) ? p : best));
        birdFlyTo(b, far.name);
        b.fleeing = true;
      } else if (b.t <= 0) {
        if (b.state === "perch" && Math.random() < 0.35) {
          // Down to the floor to peck, somewhere away from the cat.
          let x = 80 + Math.random() * (ROOM_W - 160);
          for (let i = 0; i < 6 && Math.abs(x - cat.x) < 260; i += 1) x = 80 + Math.random() * (ROOM_W - 160);
          birdFlyTo(b, { x, y: floorY });
        } else {
          birdFlyTo(b, others[Math.floor(Math.random() * others.length)].name);
        }
      }
      return false;
    }

    function updateCritters(dt) {
      critterTimers.grasshopper -= dt;
      critterTimers.fly -= dt;
      const count = (kind) => critters.filter((c) => c.kind === kind).length;
      if (critterTimers.grasshopper <= 0) {
        critterTimers.grasshopper = 10 + Math.random() * 10;
        if (count("grasshopper") < 2) spawnGrasshopper();
      }
      if (critterTimers.fly <= 0) {
        critterTimers.fly = 12 + Math.random() * 10;
        if (count("fly") < 2) spawnFly();
      }
      if (count("bird") === 0) {
        critterTimers.bird -= dt;
        if (critterTimers.bird <= 0) spawnBird(false);
      }
      for (let i = critters.length - 1; i >= 0; i -= 1) {
        const c = critters[i];
        const gone = c.kind === "grasshopper" ? updateGrasshopper(c, dt) : c.kind === "fly" ? updateFly(c, dt) : updateBird(c, dt);
        if (gone) critters.splice(i, 1);
      }
    }

    function update(dt) {
      // Update order: physics -> impacts -> pose -> appendages -> head aim.
      const wasOnGround = cat.onGround;
      const fallSpeed = cat.vy;
      const takeoffY = colliderRectAt().bottom;
      updatePhysics(dt);
      updateImpacts(wasOnGround, fallSpeed, takeoffY);
      updateDust(dt);
      updatePose(dt);
      ensureDynamicPoseState();
      updateLegs(dt);
      updateTail(dt);
      updateHead(dt);
      // Mice run after the legs so boops use this frame's paw positions.
      updateHangingLamp(dt);
      updatePostToy(dt);
      updateCurtains(dt);
      updateMice(dt);
      updateCritters(dt);
      updateGame(dt);
      updateEffects(dt);
      updateCamera(dt);
    }

    // Where the view's left edge wants to be: the cat a little behind the
    // middle, so there's more to see the way it's facing, but never past the
    // ends of the room.
    function cameraTarget() {
      return clamp(cat.x + camera.lead - hud.w / 2, 0, ROOM_W - hud.w);
    }

    // The view follows the cat with a short lag; turning round slowly swings
    // the look-ahead to the other side.
    function updateCamera(dt) {
      camera.lead = lerp(camera.lead, cat.facing * CAMERA_LEAD, 1 - Math.exp(-dt * CAMERA_TURN));
      camera.x = lerp(camera.x, cameraTarget(), 1 - Math.exp(-dt * CAMERA_FOLLOW));
    }

    function fillEllipse(x, y, rx, ry, rotation = 0) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, rotation, 0, TAU);
      ctx.fill();
    }

    // Fills the union of two circles and their outer tangents: a capsule that
    // tapers from radius `ra` at `a` to `rb` at `b`.
    function fillTaperedSegment(a, b, ra, rb) {
      ctx.beginPath();
      ctx.arc(a.x, a.y, ra, 0, TAU);
      ctx.moveTo(b.x + rb, b.y);
      ctx.arc(b.x, b.y, rb, 0, TAU);
      ctx.fill();

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d <= Math.abs(ra - rb)) return;
      const ux = dx / d;
      const uy = dy / d;
      const s = (ra - rb) / d;
      const c = Math.sqrt(1 - s * s);
      const m1x = s * ux - c * uy;
      const m1y = s * uy + c * ux;
      const m2x = s * ux + c * uy;
      const m2y = s * uy - c * ux;
      ctx.beginPath();
      ctx.moveTo(a.x + ra * m1x, a.y + ra * m1y);
      ctx.lineTo(b.x + rb * m1x, b.y + rb * m1y);
      ctx.lineTo(b.x + rb * m2x, b.y + rb * m2y);
      ctx.lineTo(a.x + ra * m2x, a.y + ra * m2y);
      ctx.closePath();
      ctx.fill();
    }

    function fillTaperedChain(points, startRadius, endRadius) {
      const last = points.length - 1;
      for (let i = 0; i < last; i += 1) {
        fillTaperedSegment(
          points[i],
          points[i + 1],
          lerp(startRadius, endRadius, i / last),
          lerp(startRadius, endRadius, (i + 1) / last)
        );
      }
    }

    function drawLeg(leg, color) {
      // Limbs are tapered capsules from joint to joint: a heavy haunch or
      // shoulder narrowing to slim lower legs that end in small round paws.
      // A soft fringe of fur goes round the whole leg first: overlapping
      // circles along it, blurred.
      const chain = leg.name.startsWith("rear")
        ? [[leg.hip, 15], [leg.knee, 8.5], [leg.ankle, 5.4], [leg.foot, 4.6]]
        : [[leg.shoulder, 10.5], [leg.knee, 7.5], [leg.ankle, 5.4], [leg.foot, 4.6]];
      fillSoft(() => {
        for (let i = 0; i < chain.length - 1; i += 1) {
          const [a, ra] = chain[i];
          const [b, rb] = chain[i + 1];
          const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 3));
          for (let k = 0; k <= steps; k += 1) {
            const t = k / steps;
            const x = lerp(a.x, b.x, t);
            const y = lerp(a.y, b.y, t);
            const r = lerp(ra, rb, t);
            ctx.moveTo(x + r, y);
            ctx.arc(x, y, r, 0, TAU);
          }
        }
      }, color, 2);
      ctx.fillStyle = color;
      if (leg.name.startsWith("rear")) {
        fillTaperedSegment(leg.hip, leg.knee, 14, 7);
        fillTaperedSegment(leg.knee, leg.ankle, 5.4, 4);
        fillTaperedSegment(leg.ankle, leg.foot, 3.8, 3.4);
        // Britches: fluffy fur down the back of the thigh.
        const dx = leg.knee.x - leg.hip.x;
        const dy = leg.knee.y - leg.hip.y;
        const len = Math.hypot(dx, dy) || 1;
        let backX = -dy / len;
        let backY = dx / len;
        if (backX * cat.facing > 0) {
          backX = -backX;
          backY = -backY;
        }
        const back = Math.atan2(backY, backX);
        fillFur((scale) => {
          for (const t of [0.35, 0.55, 0.75, 0.92]) {
            const r = lerp(13, 6, t);
            addFurLock(
              leg.hip.x + dx * t + backX * r * 0.85,
              leg.hip.y + dy * t + backY * r * 0.85,
              back + cat.facing * 0.7,
              lerp(9, 5, t) * scale,
              lerp(4.5, 3, t)
            );
          }
        }, color);
      } else {
        fillTaperedSegment(leg.hip, leg.shoulder, 3.5, 8);
        fillTaperedSegment(leg.shoulder, leg.knee, 8.4, 5.8);
        fillTaperedSegment(leg.knee, leg.ankle, 5.6, 4.2);
        fillTaperedSegment(leg.ankle, leg.foot, 4, 3.6);
      }
      // The paw sits on the toes, its sole square to the last segment: flat
      // when planted, toes up as it reaches, pads to the back when folded.
      const a = leg.angle - 0.15;
      const downX = Math.sin(a) * cat.facing;
      const downY = Math.cos(a);
      const soleX = Math.cos(a) * cat.facing;
      const soleY = -Math.sin(a);
      fillEllipse(leg.foot.x - downX * 2.8 + soleX * 1.8, leg.foot.y - downY * 2.8 + soleY * 1.8, 5.6, 3.6, Math.atan2(soleY, soleX));
    }

    // Adds a lock of fur to the current path: a leaf shape rooted just inside
    // an outline at (x, y), pointing along angle, its tip curling by bend.
    function addFurLock(x, y, angle, len, wid, bend = 0) {
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const rootX = x - dx * wid * 0.6;
      const rootY = y - dy * wid * 0.6;
      const midX = x + dx * len * 0.35;
      const midY = y + dy * len * 0.35;
      const tipX = midX + Math.cos(angle + bend) * len * 0.65;
      const tipY = midY + Math.sin(angle + bend) * len * 0.65;
      ctx.moveTo(rootX, rootY);
      ctx.quadraticCurveTo(midX - dy * wid, midY + dx * wid, tipX, tipY);
      ctx.quadraticCurveTo(midX + dy * wid, midY - dx * wid, rootX, rootY);
      ctx.closePath();
    }

    // Fills a path as a soft blur with no crisp edge: the path (built by
    // buildPath) is drawn far off to the side and only its blurred shadow
    // lands in place. Shadow offsets ignore the transform, so the shift is
    // made in device pixels.
    const SOFT_SHIFT = 20000;
    function fillSoft(buildPath, color, blur) {
      ctx.save();
      const m = ctx.getTransform();
      ctx.setTransform(m.a, m.b, m.c, m.d, m.e - SOFT_SHIFT, m.f);
      ctx.beginPath();
      buildPath();
      ctx.shadowColor = color;
      ctx.shadowBlur = blur * Math.hypot(m.a, m.b);
      ctx.shadowOffsetX = SOFT_SHIFT;
      ctx.fillStyle = "#000";
      ctx.fill();
      ctx.restore();
    }

    // Fluffy fur from locks added by addLocks(scale): a soft blurred fringe at
    // full length, and short crisp locks that keep the outline a little bumpy.
    function fillFur(addLocks, color = PALETTE.coat) {
      fillSoft(() => addLocks(1.1), color, 1.8);
      ctx.fillStyle = color;
      ctx.beginPath();
      addLocks(0.75);
      ctx.fill();
    }

    // Thickness of the bushy tail at t (0 root .. 1 tip).
    function tailRadius(t) {
      return lerp(4.5, 8, smoothstep(t / 0.35)) - 1.5 * smoothstep((t - 0.82) / 0.18);
    }

    function drawTail() {
      // A bushy tail: a soft core thin at the root, full along its length and
      // rounded at the tip, with locks of fur lying back along both sides and
      // a tuft at the end.
      if (cat.tail.joints.length < 2) return;
      const points = smoothChain(cat.tail.joints, 4);
      const last = points.length - 1;
      ctx.fillStyle = PALETTE.coat;
      ctx.beginPath();
      for (let i = 0; i <= last; i += 1) {
        const p = points[i];
        const r = tailRadius(i / last);
        ctx.moveTo(p.x + r, p.y);
        ctx.arc(p.x, p.y, r, 0, TAU);
      }
      ctx.fill();
      const flutter = Math.sin(nowSeconds * 5) * (cat.onGround ? 0.03 : 0.08);
      const tip = points[last];
      const toward = Math.atan2(tip.y - points[last - 1].y, tip.x - points[last - 1].x);
      fillFur((scale) => {
        for (let i = 2; i <= last; i += 1) {
          const p = points[i];
          const q = points[i - 1];
          const along = Math.atan2(p.y - q.y, p.x - q.x);
          const t = i / last;
          const r = tailRadius(t);
          for (const side of [-1, 1]) {
            const jitter = FUR_JITTER[(i * 2 + (side > 0 ? 1 : 0)) % FUR_JITTER.length];
            const out = along + side * Math.PI / 2;
            addFurLock(
              p.x + Math.cos(out) * r * 0.7,
              p.y + Math.sin(out) * r * 0.7,
              along + side * (0.85 - t * 0.3 + jitter * 0.3) + flutter,
              (r * (0.8 + jitter * 0.4) + 2) * scale,
              r * 0.6
            );
          }
        }
        for (const fan of [-0.45, 0, 0.45]) {
          addFurLock(tip.x, tip.y, toward + fan + flutter, 8 * scale, 4.5);
        }
      });
    }

    function drawBody() {
      // The torso outline is carried along the spine, so it bends and
      // stretches with the cat, with a lock of fluffy fur on each sample.
      // The belly and the low coat hang loose: they swing with the springs in
      // pose.loose and swell a little with each breath.
      const { sag, swing } = cat.pose.loose;
      const points = BODY_SAMPLES.map((sample) => {
        const hang = smoothstep(sample.y / 28);
        return spinePoint(
          sample.x + swing * cat.facing * hang,
          sample.y * (1 + cat.pose.breath * 0.035 * hang) + sag * hang
        );
      });
      const n = points.length;
      ctx.save();
      const center = bodyCenter();
      ctx.translate(center.x, center.y);
      ctx.rotate(cat.pose.tilt);
      ctx.scale(cat.facing, 1);
      ctx.fillStyle = PALETTE.coat;
      ctx.beginPath();
      ctx.moveTo((points[n - 1].x + points[0].x) / 2, (points[n - 1].y + points[0].y) / 2);
      for (let i = 0; i < n; i += 1) {
        const p = points[i];
        const q = points[(i + 1) % n];
        ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
      }
      ctx.fill();
      // Locks lie back along the coat (down and back below the spine), and
      // stream back further at a run.
      const wind = clamp(Math.abs(cat.vx) / RUN_SPEED, 0, 1.4) * 0.3;
      const angles = points.map((p, i) => {
        const sample = BODY_SAMPLES[i];
        const prev = points[(i + n - 1) % n];
        const next = points[(i + 1) % n];
        // The outline runs clockwise, so (dy, -dx) points outward.
        const outward = Math.atan2(-(next.x - prev.x), next.y - prev.y);
        const toward = sample.down ? Math.PI * 0.8 : Math.PI;
        const sweep = sample.sweep + wind;
        return outward + clamp(normalizeAngle(toward - outward), -sweep, sweep) +
          Math.sin(nowSeconds * 2.7 + i * 1.9) * 0.04;
      });
      // Each lock's tip curls on toward the way the coat lies.
      const curls = points.map((p, i) => {
        const toward = BODY_SAMPLES[i].down ? Math.PI * 0.8 : Math.PI;
        return Math.sign(normalizeAngle(toward - angles[i])) * 0.35;
      });
      fillFur((scale) => {
        for (let i = 0; i < n; i += 1) {
          addFurLock(points[i].x, points[i].y, angles[i], BODY_SAMPLES[i].len * scale, BODY_SAMPLES[i].wid, curls[i]);
        }
      });
      ctx.restore();
    }

    function drawNeck() {
      // A thick tapered neck blends the head into the chest. It skips the IK
      // joint (which arcs upward) so the nape doesn't form a hump; the joint
      // still drives head pitch. A fluffy ruff hangs down the throat.
      const base = cat.head.neckBase;
      const head = cat.head.pos;
      ctx.fillStyle = PALETTE.coat;
      fillTaperedSegment(base, head, 13, 11);
      const dx = head.x - base.x;
      const dy = head.y - base.y;
      const len = Math.hypot(dx, dy) || 1;
      // The throat side, square to the neck: forward and down.
      const throatX = (-dy / len) * cat.facing;
      const throatY = (dx / len) * cat.facing;
      const throat = Math.atan2(throatY, throatX);
      fillFur((scale) => {
        for (let i = 0; i < 7; i += 1) {
          const t = 0.1 + i * 0.13;
          const jitter = FUR_JITTER[(40 + i) % FUR_JITTER.length];
          const r = lerp(13, 11, t) - 1;
          addFurLock(
            base.x + dx * t + throatX * r,
            base.y + dy * t + throatY * r,
            throat + cat.facing * (0.75 + jitter * 0.3),
            (9 + jitter * 4) * scale,
            5
          );
        }
      });
    }

    function drawEye(open) {
      const ex = 10.5;
      const ey = -3;
      if (open < 0.15) {
        // Closed lid: a faint crease so the blink still reads on black fur.
        ctx.strokeStyle = PALETTE.lid;
        ctx.lineWidth = 1.1;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(ex - 5, ey + 0.4);
        ctx.quadraticCurveTo(ex, ey + 2.2, ex + 5.2, ey - 0.8);
        ctx.stroke();
        return;
      }

      ctx.save();
      // Almond eye; the lids squeeze toward the midline as `open` drops.
      ctx.beginPath();
      ctx.moveTo(ex - 5.2, ey + 0.6);
