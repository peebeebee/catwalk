      ctx.quadraticCurveTo(ex - 0.5, ey - 6.4 * open, ex + 5.4, ey - 1);
      ctx.quadraticCurveTo(ex + 0.5, ey + 4.6 * open, ex - 5.2, ey + 0.6);
      ctx.closePath();
      const iris = ctx.createRadialGradient(ex + 0.6, ey - 1, 0.5, ex + 0.6, ey - 1, 5.6);
      iris.addColorStop(0, PALETTE.irisCore);
      iris.addColorStop(1, PALETTE.irisEdge);
      ctx.fillStyle = iris;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = PALETTE.pupil;
      fillEllipse(ex + 1, ey - 1, 1.5, 3.9);
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.beginPath();
      ctx.arc(ex + 2.6, ey - 2.6, 1.05, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // Moves ctx into head space: origin at the head, facing right.
    function enterHeadSpace() {
      const rawHeadAngle = Math.atan2(cat.head.pos.y - cat.head.neckJoint.y, cat.head.pos.x - cat.head.neckJoint.x);
      const baseFacingAngle = cat.facing > 0 ? 0 : Math.PI;
      // Head pitch is relative to facing direction; this prevents upside-down
      // flips when turning left.
      // A running cat holds its head level rather than looking up.
      const levelling = cat.onGround ? clamp(Math.abs(cat.vx) / RUN_SPEED, 0, 1) * 0.75 : 0;
      const headPitch = clamp(normalizeAngle(rawHeadAngle - baseFacingAngle), -0.8, 0.8) * (1 - levelling);
      ctx.translate(cat.head.pos.x, cat.head.pos.y);
      ctx.scale(cat.facing, 1);
      ctx.rotate(headPitch);
    }

    // Adds head-space fur locks rooted on the skull's outline, their length
    // scaled by scale.
    function addHeadLocks(locks, sweep, scale) {
      for (let i = 0; i < locks.length; i += 1) {
        const [around, rawLen, wid] = locks[i];
        const len = rawLen * scale;
        const x = Math.cos(around) * 18.5;
        const y = Math.sin(around) * 15 - 1;
        // Lie back toward the nape, stirring a little.
        const angle = around + sweep * Math.sign(Math.sin(around) || 1) + Math.sin(nowSeconds * 2.3 + i * 1.7) * 0.05;
        addFurLock(x, y, angle, len, wid);
      }
    }

    function drawHead() {
      ctx.save();
      enterHeadSpace();
      ctx.fillStyle = PALETTE.coat;

      // The ears turn back at a run, flatten while sneaking, and flick now
      // and then (a quick twitch every few seconds).
      const flick = Math.max(0, Math.sin(nowSeconds * 0.9) * Math.sin(nowSeconds * 2.3) - 0.85) * 4;
      const earsBack = clamp(Math.abs(cat.vx) / RUN_SPEED, 0, 1.4) * 0.22 + cat.pose.sneak * 0.35;
      const turnEar = (baseX, baseY, angle) => {
        ctx.translate(baseX, baseY);
        ctx.rotate(-angle);
        ctx.translate(-baseX, -baseY);
      };

      // Far ear peeks out behind the skull.
      ctx.save();
      turnEar(-8, -9, earsBack);
      ctx.beginPath();
      ctx.moveTo(-15, -6);
      ctx.quadraticCurveTo(-17, -22, -11, -31);
      ctx.quadraticCurveTo(-4, -22, -1, -13);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Skull, cheek and muzzle overlap into one rounded profile.
      fillEllipse(0, -1, 19.5, 16);
      fillEllipse(3, 6, 17, 11);
      fillEllipse(15, 4, 10.5, 7.5, -0.1);

      // Fluffy cheeks and the back of the head.
      fillFur((scale) => addHeadLocks(CHEEK_FUR, 0.6, scale));

      // Grey fur behind the ears: a soft grey glow over the back of the head
      // and a soft grey fringe past its outline, with no crisp edges.
      for (const [x, y, radius] of [[-13, -4, 15], [-7, -13, 11]]) {
        const glow = ctx.createRadialGradient(x, y, 1, x, y, radius);
        glow.addColorStop(0, `rgba(${PALETTE.earFur}, 0.5)`);
        glow.addColorStop(0.55, `rgba(${PALETTE.earFur}, 0.22)`);
        glow.addColorStop(1, `rgba(${PALETTE.earFur}, 0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }
      fillFur((scale) => addHeadLocks(EAR_FUR, 0.7, scale), `rgba(${PALETTE.earFur}, 0.75)`);
      ctx.fillStyle = PALETTE.coat;

      // Near ear with a muted inner ear.
      ctx.save();
      turnEar(5, -11, earsBack + flick * 0.25);
      ctx.beginPath();
      ctx.moveTo(-3, -14);
      ctx.quadraticCurveTo(-1, -28, 6, -33);
      ctx.quadraticCurveTo(12, -22, 13, -9);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = PALETTE.innerEar;
      ctx.beginPath();
      ctx.moveTo(1, -15);
      ctx.quadraticCurveTo(2, -25, 6, -29);
      ctx.quadraticCurveTo(9, -21, 10, -12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      drawEye(1 - cat.head.blink);
      ctx.restore();
    }

    // Whiskers go on after the cat's soft-edged layer, so they stay crisp.
    function drawWhiskers() {
      ctx.save();
      enterHeadSpace();
      // Whiskers are mid-grey so they read over both black fur and white page.
      ctx.strokeStyle = PALETTE.whisker;
      ctx.lineWidth = 0.8;
      ctx.lineCap = "round";
      const whiskers = [[3, 37, -2], [5, 38, 4.5], [7, 35, 11]];
      for (let i = 0; i < whiskers.length; i += 1) {
        const [y0, x1, y1] = whiskers[i];
        const sway = Math.sin(nowSeconds * 2.6 + i * 1.3) * 0.6;
        ctx.beginPath();
        ctx.moveTo(19, y0);
        ctx.quadraticCurveTo(28, lerp(y0, y1, 0.25) - 1, x1, y1 + sway);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDog(dog) {
      // Far legs in a darker brown behind the body, the body with a short
      // coat shaded darker along the back, near legs, then neck and head.
      const lift = floorY - (dog.pose.centerY + 30);
      ctx.fillStyle = `rgba(${SCENE.shadow}, ${0.22 - clamp(lift / 400, 0, 0.1)})`;
      fillEllipse(dog.x, floorY + 2, 70, 6);
      for (const leg of dog.legs) if (!leg.near) drawDogLeg(dog, leg, SCENE.dogDark);
      drawDogTail(dog);
      drawDogBody(dog);
      // Near legs share the body's shading where they overlap it (darker on
      // the back, light on the belly), so thighs and shoulders blend in.
      const y = dog.pose.centerY;
      const shade = ctx.createLinearGradient(0, y - 30, 0, y + 62);
      shade.addColorStop(0, SCENE.dogDark);
      shade.addColorStop(0.28, SCENE.dog);
      shade.addColorStop(0.62, SCENE.dogLight);
      shade.addColorStop(0.78, SCENE.dog);
      for (const leg of dog.legs) if (leg.near) drawDogLeg(dog, leg, shade);
      drawDogHead(dog);
    }

    function drawDogBody(dog) {
      const spine = { ...DOG_SPINE, arch: dog.pose.arch, length: dog.pose.length };
      const points = DOG_SAMPLES.map((sample) => spineMap(sample.x, sample.y, spine));
      const n = points.length;
      const outline = () => {
        ctx.moveTo((points[n - 1].x + points[0].x) / 2, (points[n - 1].y + points[0].y) / 2);
        for (let i = 0; i < n; i += 1) {
          const p = points[i];
          const q = points[(i + 1) % n];
          ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
        }
      };
      ctx.save();
      ctx.translate(dog.x, dog.pose.centerY);
      ctx.rotate(dog.pose.tilt);
      ctx.scale(dog.dir, 1);
      // A short coat: just a soft edge, no long fur.
      fillSoft(outline, SCENE.dog, 1.2);
      const coat = ctx.createLinearGradient(0, -30, 0, 32);
      coat.addColorStop(0, SCENE.dogDark);
      coat.addColorStop(0.42, SCENE.dog);
      coat.addColorStop(1, SCENE.dogLight);
      ctx.fillStyle = coat;
      ctx.beginPath();
      outline();
      ctx.fill();
      ctx.restore();
    }

    function drawDogLeg(dog, leg, color) {
      ctx.fillStyle = color;
      if (leg.name.startsWith("rear")) {
        fillTaperedSegment(leg.hip, leg.knee, 16, 8);
        fillTaperedSegment(leg.knee, leg.ankle, 6.5, 4.6);
        fillTaperedSegment(leg.ankle, leg.foot, 4.6, 4.2);
      } else {
        fillTaperedSegment(leg.hip, leg.shoulder, 8, 10);
        fillTaperedSegment(leg.shoulder, leg.knee, 10, 7);
        fillTaperedSegment(leg.knee, leg.ankle, 6.2, 4.6);
        fillTaperedSegment(leg.ankle, leg.foot, 4.6, 4.2);
      }
      // The paw, its sole square to the last segment as for the cat.
      const a = leg.angle - 0.15;
      const downX = Math.sin(a) * dog.dir;
      const downY = Math.cos(a);
      const soleX = Math.cos(a) * dog.dir;
      const soleY = -Math.sin(a);
      fillEllipse(leg.foot.x - downX * 3 + soleX * 2, leg.foot.y - downY * 3 + soleY * 2, 6.8, 4.2, Math.atan2(soleY, soleX));
    }

    function drawDogTail(dog) {
      ctx.fillStyle = SCENE.dog;
      fillTaperedChain(smoothChain(dog.tail.joints, 4), 6.5, 2.4);
    }

    function drawDogHead(dog) {
      const base = dog.head.neckBase;
      const hx = dog.head.x;
      const hy = dog.head.y;
      const neckEnd = { x: hx - dog.dir * 6, y: hy + 5 };
      ctx.fillStyle = SCENE.dog;
      fillTaperedSegment(base, neckEnd, 16, 12);
      // Collar with a swinging tag.
      const cx = lerp(base.x, neckEnd.x, 0.45);
      const cy = lerp(base.y, neckEnd.y, 0.45);
      const along = Math.atan2(neckEnd.y - base.y, neckEnd.x - base.x);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(along);
      ctx.fillStyle = SCENE.collar;
      ctx.beginPath();
      ctx.roundRect(-3.5, -15, 7, 30, 3);
      ctx.fill();
      ctx.restore();
      // The tag hangs on the throat side, square to the neck.
      const throat = { x: cx - Math.sin(along) * 14 * dog.dir, y: cy + Math.cos(along) * 14 * dog.dir };
      ctx.fillStyle = SCENE.collarTag;
      fillEllipse(throat.x + Math.sin(dog.t * 9) * 2, throat.y + 4, 3.2, 3.6);

      ctx.save();
      ctx.translate(hx, hy);
      ctx.scale(dog.dir, 1);
      ctx.rotate(-0.04 * Math.sin(TAU * dog.phase));
      const ear = (angle, color) => {
        ctx.save();
        ctx.translate(-5, -9);
        ctx.rotate(angle);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -5.5);
        ctx.quadraticCurveTo(14, -8, 23, -1);
        ctx.quadraticCurveTo(17, 8, 0, 5.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      };
      // Floppy ears hang down and back, flapping up as the body drops.
      ear(2.05 + dog.ear.angle * 0.75, SCENE.dogEar);
      ctx.fillStyle = SCENE.dog;
      fillEllipse(0, 0, 16, 13.5);
      fillEllipse(6, 5, 12, 9);
      fillEllipse(20, 5, 15, 8.5, 0.05);
      ctx.fillStyle = SCENE.dogLight;
      fillEllipse(19, 9.5, 13, 4.6, 0.05);
      // Open, panting mouth with the tongue flopping out.
      ctx.fillStyle = "#5a2a22";
      fillEllipse(23, 9.5, 10, 2.4, 0.05);
      ctx.save();
      ctx.translate(16, 11);
      ctx.rotate(0.35 + Math.sin(dog.t * 16) * 0.18);
      ctx.fillStyle = SCENE.tongue;
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.quadraticCurveTo(-4, 9, 1, 11);
      ctx.quadraticCurveTo(6, 9, 4, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (dog.cheese) drawCheese(22, 10, 13, true);
      ctx.fillStyle = SCENE.dogNose;
      fillEllipse(34.5, 2.5, 4.6, 3.8);
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      fillEllipse(35, 1, 1.6, 1);
      ctx.fillStyle = SCENE.dogEye;
      fillEllipse(8, -3, 2.9, 3.3);
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      fillEllipse(9, -4.2, 1, 1);
      ctx.strokeStyle = SCENE.dogDark;
      ctx.lineWidth = 1.4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(8, -3, 5.5, -2.6, -1.2);
      ctx.stroke();
      ear(1.85 + dog.ear.angle, SCENE.dogEar);
      ctx.restore();
    }

    // The way the dog will run into view (1 or -1) while it's on its way:
    // during the warning, then until it comes in sight; otherwise 0.
    function dogComing() {
      if (game.dogWarn) return game.dogWarn.dir;
      const dog = game.dog;
      if (!dog) return 0;
      const viewX = dog.x - camera.x;
      if (dog.dir > 0 && viewX < -60) return 1;
      if (dog.dir < 0 && viewX > hud.w + 60) return -1;
      return 0;
    }

    function drawDogWarning(mouseBadges) {
      // A bouncing "Woof!" badge at the edge of the view the dog will come
      // from, with an arrow the way it will run, above any mouse badges on
      // that side. Drawn in view space.
      const dir = dogComing();
      if (!dir) return;
      const t = nowSeconds;
      const x = dir > 0 ? hud.safe.left + 54 : hud.w - hud.safe.right - 54;
      const stacked = Math.max(0, mouseBadges[dir > 0 ? -1 : 1] - 1) * MOUSE_BADGE.step;
      const y = badgeFloor() - 66 - stacked - Math.abs(Math.sin(t * 9)) * 8;
      const pulse = 1 + Math.sin(t * 12) * 0.06;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = SCENE.card;
      ctx.strokeStyle = SCENE.danger;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-40, -20, 80, 40, 14);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = SCENE.danger;
      ctx.font = font(800, 18);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Woof!", 0, 1);
      ctx.beginPath();
      const ax = dir * 50;
      ctx.moveTo(ax, -9);
      ctx.lineTo(ax + dir * 14, 0);
      ctx.lineTo(ax, 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Badges at the edges of the view for mice out of sight, so none slips
    // across unseen: the mouse with its cheese, facing the way it runs, and
    // an arrow pointing to it; nearest at the bottom. A peeking mouse's badge
    // blinks. Drawn in view space; returns the number of badges by side.
    const MOUSE_BADGE = { w: 88, h: 38, step: 46, max: 4 };
    // Where the edge badges stand, in HUD units: on the floor, or above the
    // touch buttons where those cover the bottom corners.
    function badgeFloor() {
      return Math.min(floorY - view.top, touchButtonsTop() - 8) / hud.scale;
    }
    function drawOffscreenMice() {
      const badges = { [-1]: 0, [1]: 0 };
      const outside = (m) => Math.max(camera.x - m.x, m.x - camera.x - hud.w);
      const out = mice
        .filter((m) => m.state !== "booped" && outside(m) > 12)
        .sort((a, b) => outside(a) - outside(b));
      const { w, h } = MOUSE_BADGE;
      for (const m of out) {
        const side = m.x < camera.x ? -1 : 1;
        if (badges[side] >= MOUSE_BADGE.max) continue;
        const left = side < 0 ? hud.safe.left + 12 : hud.w - hud.safe.right - 12 - w;
        const top = badgeFloor() - h - 4 - badges[side] * MOUSE_BADGE.step;
        badges[side] += 1;
        ctx.save();
        if (m.state === "peek") ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(nowSeconds * 5));
        drawPanel(left, top, w, h);
        const arrowX = side < 0 ? left + 10 : left + w - 10;
        const midY = top + h / 2;
        ctx.fillStyle = m.kind === "gold" ? SCENE.goldCheese : SCENE.hudText;
        ctx.beginPath();
        ctx.moveTo(arrowX + side * 5, midY);
        ctx.lineTo(arrowX - side * 4, midY - 7);
        ctx.lineTo(arrowX - side * 4, midY + 7);
        ctx.closePath();
        ctx.fill();
        drawMouseFigure({ x: left + w / 2 - side * 9, y: midY + 7, dir: m.dir, scale: 0.8, kind: m.kind, carrying: m.cheese });
        ctx.restore();
      }
      return badges;
    }

    function drawDizzyStars() {
      // Little stars circling the head of a cat bowled over by the dog.
      if (game.dizzy <= 0) return;
      const head = cat.head.pos;
      const fade = clamp(game.dizzy / 0.3, 0, 1);
      ctx.fillStyle = `rgba(${SCENE.sparkle}, ${fade})`;
      for (let i = 0; i < 3; i += 1) {
        const a = nowSeconds * 6 + (i * TAU) / 3;
        const x = head.x + Math.cos(a) * 18;
        const y = head.y - 26 + Math.sin(a) * 6;
        ctx.beginPath();
        for (let k = 0; k < 10; k += 1) {
          const r = k % 2 ? 2 : 5;
          const t = (k / 10) * TAU - Math.PI / 2;
          ctx.lineTo(x + Math.cos(t) * r, y + Math.sin(t) * r);
        }
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPawStamp(cx, cy, size) {
      ctx.fillStyle = SCENE.stamp;
      fillEllipse(cx, cy + size * 0.25, size * 0.55, size * 0.45);
      const toes = [[-0.62, -0.2], [-0.22, -0.55], [0.22, -0.55], [0.62, -0.2]];
      for (const [tx, ty] of toes) {
        fillEllipse(cx + tx * size, cy + ty * size, size * 0.21, size * 0.25);
      }
    }

    function drawBox() {
      // Kraft cardboard box: shaded front, lid seam, tape strip and a paw stamp.
      const { x, y, w, h } = world.box;
      const face = ctx.createLinearGradient(0, y, 0, y + h);
      face.addColorStop(0, SCENE.boxTop);
      face.addColorStop(1, SCENE.boxBottom);
      ctx.fillStyle = face;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 3);
      ctx.fill();

      ctx.fillStyle = SCENE.boxHighlight;
      ctx.fillRect(x + 3, y + 1.5, w - 6, 1.5);
      ctx.fillStyle = SCENE.boxCrease;
      ctx.fillRect(x + 2, y + 10, w - 4, 1.5);

      // Tape runs over the lid and down the middle of the front.
      const tapeW = Math.max(14, w * 0.16);
      const tapeH = h * 0.42;
      ctx.fillStyle = SCENE.tape;
      ctx.fillRect(x + w / 2 - tapeW / 2, y, tapeW, tapeH);
      ctx.fillStyle = SCENE.tapeEdge;
      ctx.fillRect(x + w / 2 - tapeW / 2, y + tapeH - 1, tapeW, 1.5);

      drawPawStamp(x + w * 0.24, y + h * 0.64, Math.min(w, h) * 0.12);

      ctx.strokeStyle = SCENE.boxEdge;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 3);
      ctx.stroke();
    }

    function shadowSurface() {
      // Highest surface under the cat's centre that is at or below its feet.
      const bottom = colliderRectAt().bottom;
      return walkableSurfaces().find((surface) => surface.top >= bottom - 4 && cat.x > surface.left && cat.x < surface.right);
    }

    function drawContactShadow(surfaceY, clipLeft = -Infinity, clipRight = Infinity) {
      // Soft ellipse on the surface under the cat; it shrinks and fades as the
      // cat rises. Clipping keeps the box-top shadow from spilling past its edges.
      const lift = surfaceY - colliderRectAt().bottom;
      if (lift < -4) return;
      const s = clamp(1 - lift / 280, 0.3, 1);
      // Opacity fades slower than size so the shadow still anchors high jumps.
      const alpha = 0.38 * (0.35 + 0.65 * s);
      const left = Math.max(clipLeft, 0);
      const right = Math.min(clipRight, ROOM_W);
      if (right <= left) return;

      ctx.save();
      ctx.beginPath();
      ctx.rect(left, surfaceY - 12, right - left, 24);
      ctx.clip();
      ctx.translate(cat.x, surfaceY + 1);
      ctx.scale(62 * s, 7 * s);
      const shade = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      shade.addColorStop(0, `rgba(${SCENE.shadow}, ${alpha})`);
      shade.addColorStop(0.55, `rgba(${SCENE.shadow}, ${alpha * 0.6})`);
      shade.addColorStop(1, `rgba(${SCENE.shadow}, 0)`);
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    function drawJumpStreaks() {
      // Speed lines under a fast take-off sell the power of the jump.
      const rise = -cat.vy;
      if (cat.onGround || rise < 500) return;
      const strength = clamp((rise - 500) / (cat.jumpSpeed - 500), 0, 1);
      const bottom = colliderRectAt().bottom;
      ctx.save();
      ctx.strokeStyle = `rgba(${SCENE.dust}, ${0.5 * strength})`;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (const offset of [-28, -2, 24]) {
        const x = cat.x + offset * cat.facing;
        const top = bottom + 8 + Math.abs(offset) * 0.25;
        ctx.moveTo(x, top);
        ctx.lineTo(x - cat.vx * 0.05, top + 16 + 34 * strength);
      }
      ctx.stroke();
      ctx.restore();
    }

    function spawnDust(x, y, count, spread, power) {
      for (let i = 0; i < count; i += 1) {
        // Alternate sides so every burst fans out both ways.
        const dir = i % 2 === 0 ? 1 : -1;
        const speed = power * (0.5 + Math.random() * 0.7);
        dust.push({
          x: x + dir * Math.random() * spread,
          y: y - Math.random() * 3,
          vx: dir * speed,
          vy: -speed * (0.15 + Math.random() * 0.35),
          r: 2.5 + Math.random() * 2.5,
          life: 0,
          maxLife: 0.35 + Math.random() * 0.3
        });
      }
    }

    function updateDust(dt) {
      for (let i = dust.length - 1; i >= 0; i -= 1) {
        const p = dust[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          dust.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.exp(-dt * 6);
        p.vy *= Math.exp(-dt * 4);
      }
    }

    function drawDust() {
      for (const p of dust) {
        const t = p.life / p.maxLife;
        ctx.fillStyle = `rgba(${SCENE.dust}, ${0.45 * (1 - t)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (1 + t * 1.6), 0, TAU);
        ctx.fill();
      }
    }

    function shadeColor(hex, t) {
      // Blends a #rrggbb colour toward the darkness inside a hole.
      if (t <= 0) return hex;
      const a = parseInt(hex.slice(1), 16);
      const b = parseInt(MOUSE_COLORS.dark.slice(1), 16);
      const mix = (shift) => Math.round(lerp((a >> shift) & 255, (b >> shift) & 255, t));
      return `rgb(${mix(16)}, ${mix(8)}, ${mix(0)})`;
    }

    // Side-view mouse facing +x with its feet at the origin, about 24px long.
    function drawMouseFigure({ x, y, dir, scale, kind = "grey", carrying = null, shade = 0, stride = 0, running = false, twitch = 0 }) {
      const coat = MOUSE_COATS[kind];
      // Capped so a faint silhouette still shows inside a hole.
      const c = (key) => shadeColor(coat[key] ?? MOUSE_COLORS[key], shade * 0.82);
      const bob = running ? -Math.abs(Math.sin(stride)) * 1.6 : 0;
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.scale(dir * scale, scale);
      ctx.translate(twitch, 0);

      const wave = Math.sin(nowSeconds * (running ? 14 : 5) + x * 0.05);
      ctx.strokeStyle = c("tail");
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-10, -5);
      ctx.quadraticCurveTo(-20, -2 + wave * 3, -31, -6 - wave * 2.5);
      ctx.stroke();

      const step = running ? Math.sin(stride) * 3 : 0;
      ctx.fillStyle = c("foot");
      fillEllipse(-5 + step, -1.2, 2.6, 1.3);
      fillEllipse(6 - step, -1.2, 2.4, 1.3);

      ctx.fillStyle = c("fur");
      fillEllipse(-1, -7, 11.5, 6.5);
      fillEllipse(9, -8, 6.5, 5, 0.25);
      fillEllipse(13.5, -6.6, 4, 2.6, 0.2);
      ctx.fillStyle = c("belly");
      fillEllipse(0, -3.4, 8, 2.6);
      ctx.fillStyle = c("ear");
      fillEllipse(6.2, -13.6, 3.7, 3.9);
      ctx.fillStyle = c("innerEar");
      fillEllipse(6.5, -13.3, 2.2, 2.5);
      ctx.fillStyle = c("nose");
      fillEllipse(17.2, -6.7, 1.4, 1.3);

      // In the dark only the eye shows, as a glint.
      if (shade > 0.45) {
        ctx.fillStyle = `rgba(255, 244, 200, ${0.5 + shade * 0.45})`;
        fillEllipse(11.4, -9.4, 1.4, 1.5);
      } else {
        ctx.fillStyle = MOUSE_COLORS.eye;
        fillEllipse(11.4, -9.4, 1.3, 1.4);
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        fillEllipse(11.8, -9.9, 0.5, 0.5);
      }

      ctx.strokeStyle = `rgba(80, 70, 65, ${0.55 * (1 - shade)})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(15.5, -7.2);
      ctx.lineTo(22, -9.2);
      ctx.moveTo(15.5, -6.6);
      ctx.lineTo(22, -5.4);
      ctx.stroke();

      if (carrying) {
        // A wedge held by its tip in the mouth, bobbing with the run. It is
        // shaded less than the mouse, so a cheese tip glows in a hole when a
        // mouse is about to come out.
        const cheeseShade = shade * 0.35;
        const bounce = running ? Math.sin(stride * 2) * 0.8 : 0;
        ctx.translate(0, bounce);
        ctx.beginPath();
        ctx.moveTo(15.5, -5.5);
        ctx.lineTo(28, -0.5);
        ctx.lineTo(28, -13);
        ctx.closePath();
        ctx.fillStyle = shadeColor(carrying === "gold" ? SCENE.goldCheese : SCENE.cheese, cheeseShade);
        ctx.fill();
        ctx.strokeStyle = shadeColor(SCENE.cheeseEdge, cheeseShade);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = shadeColor(SCENE.cheeseHole, cheeseShade);
        fillEllipse(24.5, -5, 1.4, 1.4);
        fillEllipse(26, -9.5, 1, 1);
      }
      ctx.restore();
    }

    function drawHeart(x, y, size, alpha) {
      ctx.fillStyle = `rgba(${SCENE.heart}, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.35);
      ctx.bezierCurveTo(x - size * 1.1, y - size * 0.4, x - size * 0.45, y - size * 1.1, x, y - size * 0.45);
      ctx.bezierCurveTo(x + size * 0.45, y - size * 1.1, x + size * 1.1, y - size * 0.4, x, y + size * 0.35);
      ctx.fill();
    }

    function drawMouse(m) {
      const shade = mouseShade(m);
      // A booped mouse does a happy little hop.
      const boopT = m.state === "booped" ? clamp(-m.t / 0.4, 0, 1) : 1;
      const hop = Math.sin(boopT * Math.PI) * 9;

      ctx.save();
      if (shade < 0.9) {
        ctx.fillStyle = `rgba(${SCENE.shadow}, ${0.22 * (1 - shade)})`;
        fillEllipse(m.x, floorY + 0.5, 12, 2.2);
      }
      // Near its hole, the part of the mouse past the hole's far edge is
      // still inside the wall, so clip it away.
      if (shade > 0) {
        const hole = Math.abs(m.x - m.home.x) < Math.abs(m.x - m.target.x) ? m.home : m.target;
        const leaving = hole === m.home && hole !== m.target;
        const side = leaving || m.state === "peek" ? m.dir : -m.dir;
        const edge = hole.x - side * MOUSE_HOLE.w / 2;
        ctx.beginPath();
        if (side > 0) ctx.rect(edge, 0, ROOM_W - edge, ROOM_H);
        else ctx.rect(0, 0, edge, ROOM_H);
        ctx.clip();
      }
      drawMouseFigure({
        x: m.x,
        y: floorY - hop,
        dir: m.dir,
        kind: m.kind,
        carrying: m.cheese,
        scale: 1 - shade * 0.18,
        shade,
        stride: m.stride,
        running: m.speed > 20,
        twitch: m.state === "peek" || m.state === "startle" ? Math.sin(nowSeconds * 22) * 0.7 : 0
      });
      ctx.restore();
    }

    // Side views facing +x with the feet at the origin.
    function drawGrasshopper(g) {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.scale(g.dir * 1.25, 1.25);
      if (g.state === "booped") {
        ctx.translate(0, -6);
        ctx.rotate(g.spin);
        ctx.translate(0, 6);
      }
      const leaping = g.state !== "sit";
      ctx.lineCap = "round";
      // Big hind leg: folded with the knee up when sitting, kicked back when hopping.
      ctx.strokeStyle = SCENE.grasshopperDark;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-2, -6);
      if (leaping) {
        ctx.lineTo(-10, -9);
        ctx.lineTo(-19, -3);
      } else {
        ctx.lineTo(-8, -13);
        ctx.lineTo(-11, 0);
      }
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(4, -4);
      ctx.lineTo(leaping ? 8 : 5, leaping ? -1 : 0);
      ctx.moveTo(7, -4);
      ctx.lineTo(leaping ? 11 : 9, leaping ? -2 : 0);
      ctx.stroke();
      ctx.fillStyle = SCENE.grasshopper;
      fillEllipse(0, -5.5, 9, 3.6);
      fillEllipse(8.6, -6.8, 3.6, 3.1, -0.2);
      ctx.fillStyle = SCENE.grasshopperDark;
      fillEllipse(-1, -7.4, 7, 1.8);
      ctx.fillStyle = "#1d2a12";
      fillEllipse(9.6, -7.6, 1.1, 1.1);
      // Antennae twitch.
      const twitch = Math.sin(nowSeconds * 9 + g.x) * 1.5;
      ctx.strokeStyle = SCENE.grasshopperDark;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(10, -9);
      ctx.quadraticCurveTo(13, -15, 17, -16 + twitch);
      ctx.moveTo(9.5, -9.2);
      ctx.quadraticCurveTo(11, -16, 14, -18 - twitch);
      ctx.stroke();
      ctx.restore();
    }

    function drawFly(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.dir * 1.8, 1.8);
      // Wings blur while flying, fold flat at rest.
      const beat = f.state === "rest" ? 0.3 : 0.35 + 0.65 * Math.abs(Math.sin(f.phase * 70));
      ctx.fillStyle = "rgba(225, 238, 255, 0.75)";
      ctx.strokeStyle = "rgba(90, 100, 120, 0.45)";
      ctx.lineWidth = 0.4;
      for (const [wx, wy, rot] of [[-1.8, -3.8, -0.4], [0.6, -4.2, -0.9]]) {
        ctx.beginPath();
        ctx.ellipse(wx, wy, 4.8, 2.4 * beat + 0.5, rot, 0, TAU);
        ctx.fill();
        ctx.stroke();
      }
      ctx.strokeStyle = SCENE.fly;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      for (const lx of [-2.5, -0.5, 1.5]) {
        ctx.moveTo(lx, 1.5);
        ctx.lineTo(lx - 0.8, 3.6);
      }
      ctx.stroke();
      ctx.fillStyle = SCENE.fly;
      fillEllipse(-1, 0, 4, 2.8);
      fillEllipse(3.2, -0.3, 2.4, 2.4);
      ctx.fillStyle = SCENE.flyEye;
      fillEllipse(3.9, -1, 1.3, 1.4);
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      fillEllipse(4.2, -1.5, 0.4, 0.4);
      ctx.restore();
      if (f.state === "booped" && f.t < 1) {
        // Dizzy stars.
        for (let i = 0; i < 3; i += 1) {
          const a = f.t * 9 + (i * TAU) / 3;
          ctx.fillStyle = `rgba(${SCENE.sparkle}, ${1 - f.t})`;
          fillEllipse(f.x + Math.cos(a) * 9, f.y - 8 + Math.sin(a) * 3, 1.8, 1.8);
        }
      }
    }

    function drawBird(b) {
      const flying = b.state === "fly" || b.state === "booped";
      // Pecking tips the whole bird forward in quick dabs.
      const peck = b.state === "peck" ? Math.max(0, Math.sin(b.phase * 9)) ** 3 * 0.55 : 0;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(b.dir * 1.1, 1.1);
      ctx.rotate(peck);
      if (!flying) {
        ctx.strokeStyle = SCENE.birdLeg;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-1, -2.5);
        ctx.lineTo(-2, 0);
        ctx.moveTo(2, -2.5);
        ctx.lineTo(2.5, 0);
        ctx.stroke();
      }
      ctx.fillStyle = SCENE.birdDark;
      ctx.beginPath();
      ctx.moveTo(-6, -9);
      ctx.lineTo(-16, -13);
      ctx.lineTo(-15, -6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = SCENE.bird;
      fillEllipse(0, -8, 9, 6.8);
      ctx.fillStyle = SCENE.birdBreast;
      fillEllipse(3.5, -6, 5.8, 4.6);
      ctx.fillStyle = SCENE.bird;
      fillEllipse(6.5, -14, 5.3, 5.1);
      ctx.fillStyle = SCENE.birdBeak;
      ctx.beginPath();
      ctx.moveTo(11.2, -15);
      ctx.lineTo(15, -13.8);
      ctx.lineTo(11.2, -12.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#151515";
      fillEllipse(8.4, -15.2, 1.2, 1.25);
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      fillEllipse(8.8, -15.7, 0.45, 0.45);
      // Wing: folded at rest, flapping in flight.
      ctx.fillStyle = SCENE.birdDark;
      if (flying) {
        const flap = Math.sin(b.phase * 28);
        fillEllipse(-2, -11 - flap * 5, 7, 2.6 + Math.abs(flap) * 2.2, -0.3 - flap * 0.5);
      } else {
        fillEllipse(-2, -9, 6.5, 3.6, -0.2);
      }
      ctx.restore();
    }

    function drawCritters(kinds) {
      for (const c of critters) {
        if (!kinds.includes(c.kind)) continue;
        if (c.kind === "grasshopper") drawGrasshopper(c);
        else if (c.kind === "fly") drawFly(c);
        else drawBird(c);
      }
    }

    function drawEffects() {
      for (const c of critters) {
        if (c.kind !== "bird" || c.state !== "booped" || c.t > 1.2) continue;
        const t = c.t / 1.2;
        drawHeart(c.x - c.dir * 10, c.y - 26 - t * 20, 8, 1 - t * t);
      }
      // Hearts over booped mice float up in front of everything.
      for (const m of mice) {
        if (m.state !== "booped" || m.t < -1.2) continue;
        const t = -m.t / 1.2;
        drawHeart(m.x + Math.sin(t * 9) * 3, floorY - 32 - t * 30, 9, 1 - t * t);
      }
      for (const bit of cheeseBits) {
        ctx.save();
        ctx.globalAlpha = clamp((0.9 - bit.life) / 0.3, 0, 1);
        ctx.translate(bit.x, bit.y);
        ctx.rotate(bit.angle);
        ctx.scale(0.6, 0.6);
        drawCheese(-11, 6, 22, true, bit.gold);
        ctx.restore();
      }

      for (const p of sparkles) {
        const t = p.life / p.maxLife;
        const r = p.size * (1 - t * 0.5);
        ctx.fillStyle = `rgba(${p.rgb}, ${1 - t})`;
        ctx.beginPath();
        // Four-point star.
        for (let k = 0; k < 8; k += 1) {
          const a = (k / 8) * TAU;
          const len = k % 2 === 0 ? r : r * 0.35;
          ctx.lineTo(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len);
        }
        ctx.fill();
      }

      ctx.save();
      ctx.textAlign = "center";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255, 252, 245, 0.95)";
      for (const p of popups) {
        // Kept in view, so a cheese stolen out of sight still says so.
        const x = clamp(p.x, camera.x + 120, camera.x + hud.w - 120);
        const y = p.y - p.life * 42;
        ctx.globalAlpha = clamp((1.1 - p.life) * 2.5, 0, 1);
        ctx.font = font(700, 17);
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, x, y);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, x, y);
        if (p.sub) {
          ctx.font = font(700, 13);
          ctx.lineWidth = 3.5;
          ctx.strokeText(p.sub, x, y + 17);
          ctx.fillText(p.sub, x, y + 17);
        }
      }
      ctx.restore();
    }

    function drawCatnip() {
      const nip = game.catnip;
      if (!nip) return;
      // Blinks during its last two seconds before it wilts.
      if (CATNIP_LIFETIME - nip.t < 2 && Math.sin(nowSeconds * 18) < 0) return;
      const x = nip.x;
      const y = nip.y - 1 + Math.sin(nowSeconds * 3) * 1.2;
      const glow = ctx.createRadialGradient(x, y - 10, 0, x, y - 10, 26);
      glow.addColorStop(0, `rgba(${SCENE.zoomies}, ${0.32 + 0.12 * Math.sin(nowSeconds * 5)})`);
      glow.addColorStop(1, `rgba(${SCENE.zoomies}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y - 10, 26, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = SCENE.catnipDark;
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 1, y - 9, x - 1, y - 18);
      ctx.stroke();
      ctx.fillStyle = SCENE.catnip;
      fillEllipse(x - 5, y - 6, 5.5, 2.6, -0.5);
      fillEllipse(x + 5, y - 9, 5.5, 2.6, 0.5);
      fillEllipse(x - 4.5, y - 13, 4.6, 2.3, -0.6);
      fillEllipse(x + 4, y - 16, 4.4, 2.2, 0.6);
      fillEllipse(x - 1, y - 20, 2.4, 3.4);
    }

    function drawPanel(x, y, w, h, radius = 12) {
      ctx.fillStyle = SCENE.hudPanel;
      ctx.strokeStyle = SCENE.hudEdge;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x + 0.5, y + 0.5, w, h, radius);
      ctx.fill();
      ctx.stroke();
    }

    function drawCheese(x, y, size, whole, gold = false) {
      // Side view of a wedge standing on (x, y): flat base, tall back edge.
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x + size, y - size * 0.68);
      ctx.closePath();
      ctx.lineWidth = 1.2;
      if (!whole) {
        ctx.strokeStyle = SCENE.cheeseLost;
        ctx.setLineDash([2.5, 2.5]);
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }
      ctx.fillStyle = gold ? SCENE.goldCheese : SCENE.cheese;
      ctx.fill();
      ctx.strokeStyle = SCENE.cheeseEdge;
      ctx.stroke();
      ctx.fillStyle = SCENE.cheeseHole;
      fillEllipse(x + size * 0.68, y - size * 0.2, size * 0.09, size * 0.09);
      fillEllipse(x + size * 0.86, y - size * 0.44, size * 0.07, size * 0.07);
    }

    function drawMeter(x, y, label, fraction, color) {
      // Small labelled bar, used for the streak window and zoomies time.
      const w = 156;
      const h = 26;
      drawPanel(x, y, w, h, 9);
      ctx.font = font(700, 13);
      ctx.fillStyle = color;
      ctx.fillText(label, x + 10, y + h / 2 + 1);
      const barX = x + 92;
      const barW = w - 102;
      const barY = y + h / 2 - 3;
      ctx.fillStyle = SCENE.hudEdge;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 6, 3);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(barX, barY, Math.max(barW * clamp(fraction, 0, 1), 0.1), 6, 3);
      ctx.fill();
    }

    function drawHud() {
      // Score and best on the left, the wave in the middle, cheese on the right.
      if (game.state === "title") return;
      ctx.save();
      ctx.textBaseline = "middle";
      const { safe } = hud;
      const top = safe.top + 16;
      const h = 40;
      const midY = top + h / 2 + 1;

      const score = `Score ${game.score}`;
      // A narrow view (a phone held upright) leaves out the best score.
      const best = hud.w >= 760 ? `Best ${game.best}` : "";
      ctx.font = font(700, 17);
      const scoreW = ctx.measureText(score).width;
      ctx.font = font(500, 14);
      const bestW = ctx.measureText(best).width;
      const leftW = 16 + scoreW + (best ? 16 + bestW : 0) + 16;
      const leftX = safe.left + 16;
      drawPanel(leftX, top, leftW, h);
      ctx.font = font(700, 17);
      ctx.fillStyle = SCENE.hudText;
      ctx.fillText(score, leftX + 16, midY);
      ctx.font = font(500, 14);
      ctx.fillStyle = SCENE.hudMuted;
      ctx.fillText(best, leftX + 16 + scoreW + 16, midY);

      // Losing a piece shakes the cheese panel and flushes it red.
      const wedge = 22;
      const wedgeGap = 6;
      const rightW = 32 + MAX_CHEESE * wedge + (MAX_CHEESE - 1) * wedgeGap;
      const rightX = hud.w - safe.right - 16 - rightW + Math.sin(nowSeconds * 60) * 3 * game.cheeseFlash;
      drawPanel(rightX, top, rightW, h);
      if (game.cheeseFlash > 0) {
        ctx.fillStyle = `rgba(180, 71, 44, ${0.2 * game.cheeseFlash})`;
        ctx.beginPath();
        ctx.roundRect(rightX + 0.5, top + 0.5, rightW, h, 12);
        ctx.fill();
      }
      for (let i = 0; i < MAX_CHEESE; i += 1) {
        drawCheese(rightX + 16 + i * (wedge + wedgeGap), top + h / 2 + 8, wedge, i < game.cheese);
      }

      const waveText = `Wave ${game.wave}`;
      const leftText = `× ${waveMiceRemaining()}`;
      ctx.font = font(700, 16);
      const waveW = ctx.measureText(waveText).width;
      ctx.font = font(600, 15);
      const countW = ctx.measureText(leftText).width;
      // Room for the mouse icon and the cheese in its mouth.
      const iconW = 44;
      const midW = 16 + waveW + 18 + iconW + countW + 16;
      const midX = (hud.w - midW) / 2;
      drawPanel(midX, top, midW, h);
      ctx.font = font(700, 16);
      ctx.fillStyle = SCENE.hudText;
      ctx.fillText(waveText, midX + 16, top + h / 2 + 1);
      drawMouseFigure({ x: midX + 16 + waveW + 32, y: top + h / 2 + 7, dir: 1, scale: 0.7, carrying: "cheese" });
      ctx.font = font(600, 15);
      ctx.fillStyle = SCENE.hudText;
      ctx.fillText(leftText, midX + 16 + waveW + 18 + iconW, top + h / 2 + 1);

      let rowY = top + h + 10;
      const sinceBoop = nowSeconds - game.lastBoopAt;
      if (game.streak > 1 && sinceBoop <= COMBO_WINDOW) {
        drawMeter(leftX, rowY, `Streak ×${game.streak}`, 1 - sinceBoop / COMBO_WINDOW, SCENE.popup);
        rowY += 34;
      }
      if (game.zoomies > 0) {
        drawMeter(leftX, rowY, "Zoomies!", game.zoomies / ZOOMIES_DURATION, SCENE.catnip);
      }
      ctx.restore();
    }

    function drawBanner() {
      const b = game.banner;
      if (!b) return;
      const fadeIn = clamp(b.t / 0.25, 0, 1);
      const alpha = Math.min(fadeIn, clamp((b.duration - b.t) / 0.4, 0, 1));
      const y = hud.h * 0.3 - (1 - fadeIn) * 12;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255, 252, 245, 0.95)";
      ctx.font = font(800, 44);
      ctx.lineWidth = 7;
      ctx.strokeText(b.title, hud.w / 2, y);
      ctx.fillStyle = SCENE.hudText;
      ctx.fillText(b.title, hud.w / 2, y);
      if (b.text) {
        ctx.font = font(600, 18);
        ctx.lineWidth = 5;
        ctx.strokeText(b.text, hud.w / 2, y + 40);
        ctx.fillStyle = SCENE.popup;
        ctx.fillText(b.text, hud.w / 2, y + 40);
      }
      ctx.restore();
    }

    // Centred card of text lines: { text, size, weight, color, space }. A
    // line can instead be a table row, { row: [rank, name, score],
    // highlight }, or a text box being typed in, { text, box: true, caret }.
    const CARD_ROW_W = 300;
    const CARD_BOX_W = 220;
    function drawCard(lines, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let contentW = 0;
      let contentH = 0;
      for (const line of lines) {
        ctx.font = font(line.weight ?? 500, line.size);
        const textW = line.row ? CARD_ROW_W : ctx.measureText(line.text).width;
        contentW = Math.max(contentW, line.box ? Math.max(CARD_BOX_W, textW + 40) : textW);
        contentH += (line.space ?? 0) + line.size * 1.45;
      }
      const w = contentW + 72;
      const h = contentH + 52;
      // Centred a little above the middle, inside the safe area; a card too
      // big for a small view is shrunk to fit. It is drawn around (0, 0).
      const { safe } = hud;
      const top = safe.top + 12;
      const bottom = hud.h - safe.bottom - 12;
      const fit = Math.min(1, (bottom - top) / h, (hud.w - safe.left - safe.right - 24) / w);
      const cx = (safe.left + hud.w - safe.right) / 2;
      const cy = clamp(hud.h * 0.42, top + (h * fit) / 2, bottom - (h * fit) / 2);
      ctx.translate(cx, cy);
      ctx.scale(fit, fit);
      const x = -w / 2;
      const y = -h / 2;
      ctx.shadowColor = "rgba(90, 60, 30, 0.18)";
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = SCENE.card;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 18);
      ctx.fill();
      ctx.shadowColor = "transparent";
      ctx.strokeStyle = SCENE.hudEdge;
      ctx.lineWidth = 1;
      ctx.stroke();
      let lineY = y + 26;
      for (const line of lines) {
        lineY += line.space ?? 0;
        const lineH = line.size * 1.45;
        const midY = lineY + lineH / 2;
        ctx.font = font(line.weight ?? 500, line.size);
        if (line.row) {
          const [rank, name, score] = line.row;
          const left = -CARD_ROW_W / 2;
          if (line.highlight) {
            ctx.fillStyle = SCENE.rowHighlight;
            ctx.beginPath();
            ctx.roundRect(left - 8, lineY, CARD_ROW_W + 16, lineH, 8);
            ctx.fill();
          }
          ctx.fillStyle = line.color ?? SCENE.hudText;
          ctx.textAlign = "right";
          ctx.fillText(rank, left + 26, midY);
          ctx.textAlign = "left";
          ctx.fillText(name, left + 36, midY);
          ctx.textAlign = "right";
          ctx.fillText(score, left + CARD_ROW_W, midY);
          ctx.textAlign = "center";
        } else if (line.box) {
          const textW = ctx.measureText(line.text).width;
          const boxW = Math.max(CARD_BOX_W, textW + 40);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = SCENE.popup;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(-boxW / 2, lineY - 3, boxW, lineH + 6, 10);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = line.color ?? SCENE.hudText;
          ctx.fillText(line.text, 0, midY);
          if (line.caret && Math.floor(nowSeconds * 2.5) % 2 === 0) {
            ctx.fillRect(textW / 2 + 2, midY - line.size * 0.6, 2, line.size * 1.2);
          }
        } else {
          ctx.fillStyle = line.color ?? SCENE.hudText;
          ctx.fillText(line.text, 0, midY);
        }
        lineY += lineH;
      }
      ctx.restore();
    }

    // The high scores as card lines: a heading and a row per score, best
    // first. `pending` ({ rank, name }) is the score being named, shown in
    // its place as typed so far; the row at `highlight` is marked.
    function highScoreLines(pending = null, highlight = -1) {
      const list = pending
        ? addHighScore(game.highScores, { name: pending.name, score: game.score })
        : game.highScores;
      if (!list.length) return [];
      return [
        { text: "High scores", size: 15, weight: 700, space: 14 },
        ...list.map((e, i) => ({
          row: [`${i + 1}.`, cleanName(e.name) || NO_NAME, String(e.score)],
          size: 15,
          weight: i === highlight ? 700 : 500,
          highlight: i === highlight
        }))
      ];
    }

    function drawOverlay() {
      if (game.state === "title") {
        const pulse = 0.55 + 0.45 * Math.sin(nowSeconds * 4);
        drawCard([
          { text: "Catwalk", size: 44, weight: 800 },
          { text: "The mice are carrying your cheese across the room!", size: 16, color: SCENE.hudMuted },
          { text: "Boop them on the nose and they'll drop it.", size: 16, color: SCENE.hudMuted },
          ...(touchUI
            ? [
              { text: "Buttons: left and right run, up jumps, down sneaks", size: 16, weight: 700, space: 14 },
              { text: "Tap up for a little hop, hold it to jump high", size: 14, color: SCENE.hudMuted }
            ]
            : [
              { text: "← →  run        Space  jump        ↓  sneak / hop down", size: 16, weight: 700, space: 14 },
              { text: "Tap Space for a little hop, hold it to jump high", size: 14, color: SCENE.hudMuted }
            ]),
          // The tips only where there's room for them (not on a phone).
          ...(hud.w < 760 || hud.h < 600 ? [] : [
            { text: "Boops from the air score double, quick boops build a streak", size: 14, color: SCENE.hudMuted },
            { text: "Startled mice run for the nearest hole: head them off!", size: 14, color: SCENE.hudMuted },
            { text: "Mice can't see you up on the furniture", size: 14, color: SCENE.hudMuted },
            { text: "Bonus boops: grasshopper 15 · fly 25 · bird 40 (sneak up on it!)", size: 14, color: SCENE.hudMuted }
          ]),
          ...(touchUI ? [] : [{
            text: fullscreenSupported ? "P  pause          M  sound          F  full screen" : "P  pause          M  sound",
            size: 14,
            color: SCENE.hudMuted
          }]),
          { text: touchUI ? "Tap to start" : "Press Space to start", size: 19, weight: 700, color: `rgba(192, 102, 42, ${pulse})`, space: 16 },
          ...highScoreLines()
        ]);
      } else if (game.state === "over") {
        const t = nowSeconds - game.overAt;
        // The prompts wait a moment so a key held from the game can't skip
        // this card or type into the name.
        const ready = t > RESTART_DELAY;
        const entry = game.entry;
        const lines = [
          { text: "Out of cheese!", size: 38, weight: 800 },
          { text: "The mice are having a cheese party.", size: 15, color: SCENE.hudMuted },
          { text: `Score ${game.score}`, size: 26, weight: 700, color: SCENE.popup, space: 6 },
          {
            text: `Reached wave ${game.wave} · ${game.boops} ${game.boops === 1 ? "boop" : "boops"}`,
            size: 15,
            color: SCENE.hudMuted
          }
        ];
        if (entry) {
          const prompt = {
            text: entry.rank === 0 ? "A new high score! Type your name:" : "You made the high scores! Type your name:",
            size: 16,
            weight: 700,
            color: SCENE.catnip,
            space: 14
          };
          // On a touch screen the name is typed in a field at the top of the
          // screen (see syncNameForm), where the phone's keyboard leaves it in sight.
          if (touchUI) {
            lines.push({ ...prompt, text: entry.rank === 0 ? "A new high score!" : "You made the high scores!" });
          } else {
            lines.push(
              prompt,
              { text: entry.name, box: true, caret: ready, size: 20, weight: 700, space: 8 },
              { text: ready ? "Enter  save          Esc  skip" : " ", size: 13, color: SCENE.hudMuted, space: 6 }
            );
          }
        }
        lines.push(...highScoreLines(entry, entry ? entry.rank : game.savedRank));
        if (!entry) {
          const again = touchUI ? "Tap to play again" : "Press Space to play again";
          lines.push({ text: ready ? again : " ", size: 19, weight: 700, color: SCENE.popup, space: 14 });
        }
        drawCard(lines, clamp(t / 0.4, 0, 1));
      } else if (game.paused) {
        drawCard([
          { text: "Paused", size: 34, weight: 800 },
          { text: touchUI ? "Tap to continue" : "Press P to continue", size: 15, color: SCENE.hudMuted, space: 4 }
        ]);
      }

      if (game.toast) {
        ctx.save();
        ctx.globalAlpha = clamp((1.4 - game.toast.t) / 0.3, 0, 1);
        ctx.font = font(600, 14);
        const w = ctx.measureText(game.toast.text).width + 32;
        drawPanel((hud.w - w) / 2, hud.h - hud.safe.bottom - 56, w, 32, 16);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = SCENE.hudText;
        ctx.fillText(game.toast.text, hud.w / 2, hud.h - hud.safe.bottom - 39);
        ctx.restore();
      }
    }

    function drawDebug() {
      if (!debug.showHitboxes) return;
      const collider = colliderRectAt();
      const box = boxRect();

      ctx.save();
      ctx.strokeStyle = "rgba(220, 40, 40, 0.75)";
      ctx.lineWidth = 2;
      ctx.strokeRect(collider.left, collider.top, cat.collider.w, cat.collider.h);

      ctx.strokeStyle = "rgba(40, 90, 220, 0.75)";
      ctx.lineWidth = 2;
      ctx.strokeRect(box.left, box.top, world.box.w, world.box.h);

      ctx.fillStyle = "rgba(220, 40, 40, 0.65)";
      for (const leg of cat.legs) {
        ctx.beginPath();
        ctx.arc(leg.target.x, leg.target.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Points ctx at the cat's layer, cleared and lined up with the scene
    // around the cat. Returns the layer's scene position.
    function beginCatLayer() {
      // On whole device pixels, so the layer lands on the scene unresampled.
      const x = Math.floor((cat.x - CAT_LAYER.left) * pixelScale) / pixelScale;
      const y = Math.floor((cat.y - RIG_LIFT - CAT_LAYER.up) * pixelScale) / pixelScale;
      catCtx.setTransform(1, 0, 0, 1, 0, 0);
      catCtx.clearRect(0, 0, catLayer.width, catLayer.height);
      catCtx.setTransform(pixelScale, 0, 0, pixelScale, -x * pixelScale, -y * pixelScale);
      ctx = catCtx;
      return { x, y };
    }

    // A faint dark-grey sheen over the shoulders, haunches and crown gives
    // the black coat some volume. It only lands where the cat already is.
    function drawSheen() {
      ctx.save();
      ctx.globalCompositeOperation = "source-atop";
      for (const [x, y, r] of [[24, -16, 26], [-36, -12, 24], [-12, -20, 22]]) {
        const at = bodyPoint(x * cat.facing, y);
        const sheen = ctx.createRadialGradient(at.x, at.y, 1, at.x, at.y, r);
        sheen.addColorStop(0, `rgba(${PALETTE.sheen}, 0.3)`);
        sheen.addColorStop(1, `rgba(${PALETTE.sheen}, 0)`);
        ctx.fillStyle = sheen;
        ctx.fillRect(at.x - r, at.y - r, r * 2, r * 2);
      }
      ctx.restore();
    }

    // Lays the cat's layer onto the scene.
    function endCatLayer(layer) {
      ctx = sceneCtx;
      ctx.drawImage(catLayer, layer.x, layer.y, catLayer.width / pixelScale, catLayer.height / pixelScale);
    }


    function draw() {
      // The room is drawn in room units, shifted by the view's top left
      // corner (snapped to whole device pixels so the room doesn't shimmer as
      // it scrolls); the HUD and the badges at the view's edges go on after.
      // Draw order controls depth: far legs behind body, near legs in front.
      // A floor shadow goes under the box so the box occludes it; a shadow on
      // raised furniture is drawn on top of it.
      ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
      const viewX = Math.round(camera.x * pixelScale) / pixelScale;
      const viewY = Math.round(view.top * pixelScale) / pixelScale;
      ctx.save();
      ctx.translate(-viewX, -viewY);
      if (game.shake > 0 && !game.paused) {
        ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
      }
      // Just the part of the room in view, with a little spare for a shake.
      const left = Math.max(0, viewX - 16);
      const right = Math.min(ROOM_W, viewX + view.w + 16);
      const top = Math.max(0, viewY - 16);
      const b = backdropScale;
      ctx.drawImage(backdrop, left * b, top * b, (right - left) * b, (ROOM_H - top) * b, left, top, right - left, ROOM_H - top);
      drawWindow();
      drawPostToy();
      drawHangingLamp();
      const shadowOn = shadowSurface();
      if (shadowOn.kind === "floor") drawContactShadow(floorY);
      // Mice run along the wall, so they pass behind the box and the cat.
      for (const m of mice) drawMouse(m);
      drawBox();
      if (shadowOn.kind !== "floor") drawContactShadow(shadowOn.top, shadowOn.left, shadowOn.right);
      drawCatnip();
      drawCritters(["grasshopper"]);
      if (game.dog) drawDog(game.dog);

      const layer = beginCatLayer();
      for (const leg of cat.legs) {
        if (!leg.near) drawLeg(leg, PALETTE.farLimb);
      }

      drawTail();
      drawBody();

      for (const leg of cat.legs) {
        if (leg.near) drawLeg(leg, PALETTE.coat);
      }

      drawNeck();
      drawHead();
      drawSheen();
      endCatLayer(layer);
      drawWhiskers();
      drawDizzyStars();
      drawJumpStreaks();
      drawCritters(["fly", "bird"]);
      drawDust();
      drawEffects();
      drawDebug();
      ctx.restore();
      ctx.drawImage(vignette, 0, 0, view.w, view.h);
      ctx.save();
      ctx.scale(hud.scale, hud.scale);
      drawDogWarning(drawOffscreenMice());
      drawHud();
      drawBanner();
      drawOverlay();
      ctx.restore();
    }

    let lastTime = performance.now();
    function frame(timeMs) {
      // Scheduled first, so one failing frame can't stop the game for good.
      requestAnimationFrame(frame);
      const dt = Math.min((timeMs - lastTime) / 1000, 1 / 30);
      lastTime = timeMs;
      if (!laidOut) return;
      if (!game.paused) {
        nowSeconds += dt;
        update(dt);
      }
      draw();
      syncNameForm();
    }

    function placeInitialFeet() {
      for (const leg of cat.legs) {
        const hip = legAnchor(leg);
        const nominalX = hip.x + leg.standX * cat.facing;
        const desiredY = supportSurfaceYForFoot(nominalX, hip.x, hip.y);
        const desiredX = clampFootX(nominalX, hip.x, hip.y, desiredY);
        leg.target.x = desiredX;
        leg.target.y = desiredY;
        leg.foot.x = leg.target.x;
        leg.foot.y = leg.target.y;
        leg.mode = "stance";
        leg.plant.x = desiredX;
        leg.plant.y = desiredY;
        leg.swingT = 1;
        leg.angle = distalAngle({ isFront: leg.name.startsWith("front"), mode: "stance" });
      }
    }

    // A control going down, from a key or a touch button (named like
    // KeyboardEvent.code): run, jump, sneak, start, pause and sound.
    function pressControl(code, repeat = false) {
      // Browsers only start audio after a user gesture.
      sfx.unlock();
      if (code === "KeyP" || code === "Escape") {
        if (game.state === "playing") game.paused = !game.paused;
        return;
      }
      if (code === "KeyM") {
        game.toast = { text: sfx.toggleMute() ? "Sound off" : "Sound on", t: 0 };
        touchPanel.classList.toggle("muted", sfx.muted);
        return;
      }
      if (game.paused) return;
      // Stuck in a curtain, every press wriggles the cat free sooner.
      if (cat.cling && !repeat && (code === "Space" || code.startsWith("Arrow"))) {
        cat.cling.struggle = 1;
        cat.cling.dur = Math.max(CLING_MIN, cat.cling.dur - 0.2);
      }
      if ((code === "Space" || code === "Enter") && !repeat) {
        if (game.state === "title") {
          startGame();
          // The first game on a touch screen goes full screen where it can.
          if (touchUI) fullscreenOnTapEnd = enterFullscreen;
        } else if (game.state === "over" && !game.entry && nowSeconds - game.overAt > RESTART_DELAY) {
          startGame();
        }
      }

      if (code === "ArrowLeft") input.ArrowLeft = true;
      if (code === "ArrowRight") input.ArrowRight = true;
      if (code === "ArrowDown") {
        input.ArrowDown = true;
        if (cat.support?.oneWay) cat.dropTimer = 0.25;
      }
      if (code === "Space") {
        cat.jumpQueued = true;
        input.Space = true;
      }
    }

    function releaseControl(code) {
      if (code in input) input[code] = false;
    }

    // Lets go of everything held, by keys or fingers.
    function releaseAll() {
      for (const code of Object.keys(input)) input[code] = false;
      for (const button of fingers.values()) button.classList.remove("held");
      fingers.clear();
    }

    window.addEventListener("keydown", (e) => {
      // Typing a name on a touch screen goes to its own field.
      if (e.target === nameInput) return;
      const gameKey = e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "ArrowDown" || e.code === "Space";
      if (gameKey) {
        e.preventDefault();
        setTouchUI(false);
      }
      // Naming a high score takes the keys.
      if (game.entry) {
        sfx.unlock();
        if (typeName(e)) e.preventDefault();
        return;
      }
      pressControl(e.code, e.repeat);
      if (e.code === "KeyF" && fullscreenSupported && !e.repeat) toggleFullscreen();
      if (e.code === "KeyH") debug.showHitboxes = !debug.showHitboxes;
    });

    window.addEventListener("keyup", (e) => releaseControl(e.code));

    window.addEventListener("blur", () => {
      // Keys released while the window is unfocused never send keyup.
      releaseAll();
      if (game.state === "playing") game.paused = true;
    });

    // Touch buttons. Each finger holds one control; sliding onto another
    // button switches to it, so a thumb can rock between left and right.
    const touchPanel = document.getElementById("touch");
    const fingers = new Map();
    function holdButton(pointerId, button) {
      if (fingers.get(pointerId) === button) return;
      letGo(pointerId);
      fingers.set(pointerId, button);
      button.classList.add("held");
      pressControl(button.dataset.control);
    }
    function letGo(pointerId) {
      const button = fingers.get(pointerId);
      if (!button) return;
      fingers.delete(pointerId);
      // Another finger may still be on the same button.
      if ([...fingers.values()].includes(button)) return;
      button.classList.remove("held");
      releaseControl(button.dataset.control);
    }
    touchPanel.addEventListener("pointerdown", (e) => {
      const button = e.target.closest("button");
      if (!button) return;
      e.preventDefault();
      if (button.dataset.tap === "fullscreen") fullscreenOnTapEnd = toggleFullscreen;
      else if (button.dataset.tap) pressControl(button.dataset.tap);
      else holdButton(e.pointerId, button);
    });
    window.addEventListener("pointermove", (e) => {
      if (!fingers.has(e.pointerId)) return;
      const over = document.elementFromPoint(e.clientX, e.clientY)?.closest("#touch button[data-control]");
      if (over) holdButton(e.pointerId, over);
    });
    window.addEventListener("pointerup", (e) => {
      letGo(e.pointerId);
      // Browsers only go full screen from a finished tap (or a key press).
      const request = fullscreenOnTapEnd;
      fullscreenOnTapEnd = null;
      request?.();
    });
    window.addEventListener("pointercancel", (e) => letGo(e.pointerId));
    window.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        releaseAll();
        if (game.state === "playing") game.paused = true;
      }
    });

    // A tap or click on the view starts a game, plays again or carries on.
    canvas.addEventListener("pointerdown", () => {
      sfx.unlock();
      if (game.paused) game.paused = false;
      else if (game.state !== "playing") pressControl("Enter");
    });

    // The buttons show once the screen is touched, and go when a key is used.
    function setTouchUI(on) {
      if (touchUI === on) return;
      touchUI = on;
      releaseAll();
      fitCanvas();
    }
    window.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch") setTouchUI(true);
    }, true);

    // Lays out the touch buttons over the bottom corners of the view, inside
    // the safe area, with the pause, sound and full-screen buttons under the
    // cheese. Also notes where the buttons start, so the edge badges stay
    // above them.
    const padMove = document.getElementById("pad-move");
    const padAct = document.getElementById("pad-act");
    const padMenu = document.getElementById("pad-menu");
    function place(el, { left = "", right = "", top = "", bottom = "" }) {
      const px = (v) => (typeof v === "number" ? `${Math.round(v)}px` : v);
      Object.assign(el.style, { left: px(left), right: px(right), top: px(top), bottom: px(bottom) });
    }
    const TOUCH_BUTTON = 60;
    function layoutTouch() {
      touchPanel.hidden = !touchUI;
      screenLayout.buttonsTop = Infinity;
      if (!touchUI) return;
      const { insets, scale } = screenLayout;
      const W = window.innerWidth;
      const H = window.innerHeight;
      touchPanel.style.setProperty("--button", `${TOUCH_BUTTON}px`);
      const bottom = insets.bottom + 14;
      place(padMove, { left: insets.left + 16, bottom });
      place(padAct, { right: insets.right + 16, bottom });
      const hudBottom = screenLayout.top + (view.safe.top + 66 * hud.scale) * scale;
      const viewRight = W - screenLayout.left - screenLayout.width;
      place(padMenu, { right: viewRight + (view.safe.right + 16 * hud.scale) * scale, top: hudBottom });
      screenLayout.buttonsTop = H - bottom - TOUCH_BUTTON * 1.22;
    }

    // How far down the view the touch buttons start, in view units.
    function touchButtonsTop() {
      return (screenLayout.buttonsTop - screenLayout.top) / screenLayout.scale;
    }

    // Full screen, where the browser allows it (Android, iPad and computers;
    // Safari on iPhone has so far only allowed it for videos): a toggle among
    // the touch buttons, the F key, and the first game started from a touch
    // screen. Full screen also locks the screen sideways where it can
    // (Android). An installed app is full screen already.
    const fullscreenSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const installed = window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches;
    // Set by a tap that should go full screen once it ends (see pointerup).
    let fullscreenOnTapEnd = null;
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function enterFullscreen() {
      if (!fullscreenSupported || isFullscreen()) return;
      const root = document.documentElement;
      const request = root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen();
      Promise.resolve(request)
        .then(() => screen.orientation?.lock?.("landscape"))
        .catch(() => {
          // Refused, or the screen can't be locked: the game carries on as it is.
        });
    }
    function toggleFullscreen() {
      if (!isFullscreen()) {
        enterFullscreen();
        return;
      }
      const exit = document.exitFullscreen ?? document.webkitExitFullscreen;
      Promise.resolve(exit?.call(document)).catch(() => {});
    }
    document.getElementById("fullscreen-button").hidden = !fullscreenSupported || installed;
    for (const type of ["fullscreenchange", "webkitfullscreenchange"]) {
      document.addEventListener(type, () => touchPanel.classList.toggle("full", isFullscreen()));
    }

    // A touch screen held upright: the game pauses behind a notice to turn
    // it sideways, which offers full screen where the browser allows it (on
    // Android that also turns the game sideways at once).
    const rotateNotice = document.getElementById("rotate");
    const rotateFullscreen = document.getElementById("rotate-fullscreen");
    rotateFullscreen.hidden = !fullscreenSupported || installed;
    rotateFullscreen.addEventListener("click", () => enterFullscreen());
    function showRotateNotice(show) {
      if (show === !rotateNotice.hidden) return;
      rotateNotice.hidden = !show;
      if (!show) return;
      releaseAll();
      if (game.state === "playing") game.paused = true;
    }

    // The name field for a high score on a touch screen: shown once the
    // game-over card's prompts are up, starting from the last name used.
    const nameForm = document.getElementById("name-form");
    const nameInput = document.getElementById("name-input");
    function syncNameForm() {
      const show = touchUI && !!game.entry && nowSeconds - game.overAt > RESTART_DELAY;
      if (show === !nameForm.hidden) return;
      nameForm.hidden = !show;
      if (show) nameInput.value = game.entry.name;
      else nameInput.blur();
    }
    nameInput.addEventListener("input", () => {
      if (!game.entry) return;
      const chars = Array.from(nameInput.value).filter((c) => /^[\p{L}\p{N} '.-]$/u.test(c));
      const typed = chars.slice(0, NAME_MAX).join("");
      if (typed !== nameInput.value) nameInput.value = typed;
      game.entry.name = typed;
    });
    nameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (game.entry) saveHighScore();
      syncNameForm();
    });
    document.getElementById("name-skip").addEventListener("click", () => {
      game.entry = null;
      syncNameForm();
    });

    layoutRoom();
    cat.y = centerYForSurface(floorY);
    placeInitialFeet();
    ensureDynamicPoseState();
    camera.lead = cat.facing * CAMERA_LEAD;
    camera.x = cameraTarget();
    // A hidden pane or background tab can load with no size: the game
    // starts with the first resize that gives the window one.
    let laidOut = fitCanvas();
    window.addEventListener("resize", () => {
      if (fitCanvas()) laidOut = true;
    });
    // After a rotation a phone can report its new safe-area insets a moment
    // after the resize.
    window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 300));
    // Runtime probe hook used by Playwright diagnostics.
    window.__catDebug = {
      cat, world, physics, debug, mice, game, critters, critterTimers, draw, startWave, endGame,
      camera, room: { w: ROOM_W, h: ROOM_H }, view, screenLayout
    };
    requestAnimationFrame(frame);

    // The service worker lets the installed game start offline. It stays off
    // on the local dev server, where it would serve stale files.
    if ("serviceWorker" in navigator && !["localhost", "127.0.0.1"].includes(location.hostname)) {
      navigator.serviceWorker.register("./sw.js").catch(() => {
        // Without it the game still runs; it just needs the network.
      });
    }
  </script>
</body>
</html>
