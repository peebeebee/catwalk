<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Catwalk</title>
  <meta name="description" content="A fluffy black cat boops mice on the nose to save the cheese." />
  <!-- Installable as an app (see manifest.webmanifest and sw.js). -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#3a2e26" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Catwalk" />
  <style>
    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #3a2e26;
    }

    /* No scrolling, zooming, text selection or long-press menus: on a phone
       every touch is for the game. */
    body {
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Placed and sized by fitCanvas; whatever it leaves frames the view. */
    canvas {
      position: absolute;
      display: block;
      background: #faf6ef;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
    }

    /* Touch buttons, placed by layoutTouch: see-through, over the bottom
       corners of the room. */
    #touch .pad {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #touch button {
      width: var(--button);
      height: var(--button);
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(91, 70, 54, 0.3);
      background: rgba(255, 251, 244, 0.55);
      touch-action: none;
    }

    #touch button.jump {
      width: calc(var(--button) * 1.22);
      height: calc(var(--button) * 1.22);
    }

    #touch button.small {
      width: 42px;
      height: 42px;
    }

    #touch button.held {
      background: rgba(242, 201, 76, 0.85);
    }

    #touch svg {
      width: 50%;
      height: 50%;
      fill: #5b4636;
      stroke: #5b4636;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #touch .sound-off,
    #touch.muted .sound-on {
      display: none;
    }

    #touch.muted .sound-off {
      display: inline;
    }

    #touch .full-off,
    #touch.full .full-on {
      display: none;
    }

    #touch.full .full-off {
      display: inline;
    }

    /* On a touch screen held upright: turn it sideways to play. */
    #rotate {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: #3a2e26;
      color: #faf6ef;
      font: 600 19px system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #rotate img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #rotate h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
    }

    #rotate svg {
      width: 64px;
      height: 64px;
      fill: none;
      stroke: #f2c94c;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: turn 2.4s ease-in-out infinite;
    }

    @keyframes turn {
      0%, 25% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }

    #rotate button {
      padding: 12px 22px;
      font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: #c0662a;
      border: none;
      border-radius: 14px;
    }

    /* The name for a high score on a touch screen, at the top where the
       phone's keyboard leaves it in sight. */
    #name-form {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255, 251, 244, 0.97);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #name-input {
      width: 9em;
      padding: 8px 12px;
      font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #5b4636;
      text-align: center;
      border: 2px solid #c0662a;
      border-radius: 10px;
      -webkit-user-select: text;
      user-select: text;
    }

    #name-form button {
      padding: 8px 14px;
      font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: #c0662a;
      border: none;
      border-radius: 10px;
    }

    #name-form #name-skip {
      color: #5b4636;
      background: transparent;
    }
  </style>
</head>

      <button data-tap="fullscreen" class="small" id="fullscreen-button" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" fill="none"><path class="full-on" d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15" /><path class="full-off" d="M9 4 V9 H4 M20 9 H15 V4 M15 20 V15 H20 M4 15 H9 V20" /></svg></button>
      <button data-tap="KeyM" class="small" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M3.5 9 H7.5 L12.5 5 V19 L7.5 15 H3.5 Z" stroke="none" /><path class="sound-on" d="M15.5 9 Q18 12 15.5 15 M18 6.5 Q22.5 12 18 17.5" fill="none" /><path class="sound-off" d="M15.5 9.5 L20.5 14.5 M20.5 9.5 L15.5 14.5" fill="none" /></svg></button>

  <div id="rotate" hidden>
    <img src="./icons/icon-192.png" alt="" />
    <h1>Catwalk</h1>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M11 18.5 H13" /></svg>
    <p>Turn your phone sideways to play</p>

  <form id="name-form" hidden>
    <input id="name-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Your name" aria-label="Your name" />
    <button type="submit">Save</button>
    <button type="button" id="name-skip">Skip</button>
  </form>
  <!-- matter-js 0.20.0 (MIT), copied from node_modules so the site needs no build. -->
  <script src="./vendor/matter.min.js"></script>

  <script type="module">
    import {
      clamp,
      normalizeAngle,
      solveTwoBone,
      updateJumpWindow,
      colliderRectAt as sharedColliderRectAt,
      centerYForSurface as sharedCenterYForSurface,
      isOnBoxTop as sharedIsOnBoxTop,
      resolveHorizontal as sharedResolveHorizontal,
      overlapsX as sharedOverlapsX,
      overlapsY as sharedOverlapsY
    } from "./src/cat-physics.js";
    import {
      TAU,
      blendedPhaseOffset,
      computeAirLegTarget,
      distalAngle,
      gaitParams,
      isSwingPhase,
      lerp,
      normalizedPhase,
      createSecondOrder,
      spineMap,
      stepSecondOrder,
      swingFootPoint
    } from "./src/cat-motion.js";
    import {
      COMBO_WINDOW,
      DOG_HOP_POINTS,
      MAX_CHEESE,
      MOUSE_KINDS,
      nextCombo,
      scoreBoop,
      waveClearBonus,
      waveConfig,
      waveIntro
    } from "./src/game-rules.js";
    import { createSfx } from "./src/sfx.js";
    import { NAME_MAX, addHighScore, cleanName, highScoreRank, parseHighScores } from "./src/high-scores.js";
    import { DOG_SPINE, createDog, dogHitBox, updateDog } from "./src/dog.js";

    // Canvas bootstrap: one view of the room, scaled to fit the window (see fitCanvas).
    const canvas = document.getElementById("scene");
    const sceneCtx = canvas.getContext("2d");
    // Drawing goes through ctx; while the cat is drawn it points at the cat's
    // own layer (see beginCatLayer).
    let ctx = sceneCtx;
    const {
      Engine,
      Bodies,
      Body,
      Composite
    } = Matter;
    const MATTER_FPS = 60;
    // Keeps the face and neck from visually clipping into the obstacle.
    const HEAD_BUMPER = 8;
    const BLINK_DURATION = 0.18;
    const TAIL_BASE = { x: -52, y: -10 };
    // Deterministic pseudo-random numbers, so procedural fur comes out the
    // same on every load.
    function seededRandom(seed) {
      let state = seed;
      return () => {
        state = (state * 16807) % 2147483647;
        return (state - 1) / 2147483646;
      };
    }

    // Fluffy fur on the head, in head space (facing right; the skull is an
    // ellipse at (0, -1) with radii 19.5 x 16). Each lock is [angle round
    // the skull (rad), length, width]. CHEEK_FUR fluffs the jaw line and the
    // back of the head; EAR_FUR is the grey fur behind the ears, from the
    // ear bases round to the nape.
    const CHEEK_FUR = (() => {
      const rand = seededRandom(733);
      return Array.from({ length: 16 }, (_, i) => [
        (60 + i * 11 + (rand() - 0.5) * 6) * (Math.PI / 180),
        6 + rand() * 4,
        3.5 + rand() * 1.5
      ]);
    })();
    const EAR_FUR = (() => {
      const rand = seededRandom(20231);
      return Array.from({ length: 22 }, (_, i) => [
        (-100 - i * 6.5 + (rand() - 0.5) * 8) * (Math.PI / 180),
        6 + rand() * 6,
        3.5 + rand() * 2
      ]);
    })();
    // The drawn torso rides above the physics center; collision still uses
    // the unchanged torso collider. A fluffy cat's deep body hangs low: the
    // legs show for only about a third of its height.
    const RIG_LIFT = 19;
    // Movement tuning in px, px/s and px/s². A full jump rises ~300px (the
    // bookcase climbs a level per jump) and is ~0.8s in the air; the cat falls
    // faster than it rises, like a real cat.
    const RUN_SPEED = 330;
    // Holding down on the floor (or the box) creeps low and slow; animals
    // notice a sneaking cat much later.
    const SNEAK_SPEED = 120;
    // Air speed with a direction held, so a running leap carries forward.
    const LEAP_SPEED = 480;
    const GRAVITY = 3400;
    // Extra gravity while descending, as a fraction of GRAVITY.
    const FALL_BOOST = 0.4;
    // Releasing Space while still rising scales the upward speed by this,
    // so a tap is a quick low hop and holding gives the full jump.
    const JUMP_CUT = 0.55;
    // A jump from the ground starts with a crouch onto the hind legs this
    // long (s), shorter from a run, so the take-off reads as a push from the
    // hind legs. Pitch (rad) the body rears up by as they push off.
    const JUMP_CROUCH = 0.075;
    const JUMP_CROUCH_RUN = 0.045;
    const LAUNCH_PITCH = 0.62;
    const LAUNCH_PITCH_RUN = 0.42;
    // The dog (wave 6 on): its gallop speed (px/s), the seconds of warning
    // before it runs in, and how long a bumped cat stays dizzy.
    const DOG_SPEED = 540;
    const DOG_WARNING = 1.3;
    const DIZZY_TIME = 1.1;
    // A leap into the curtains gets the cat's claws stuck for this long (s);
    // each key pressed while stuck wriggles it free sooner, down to
    // CLING_MIN. It hangs nose-up by CLING_TILT (rad).
    const CLING_TIME = 1.4;
    const CLING_MIN = 0.55;
    const CLING_TILT = 1.2;
    // Seconds after coming free before a curtain can catch the cat again.
    const CLING_REST = 10;
    // Seconds the forepaw takes to tap a booped mouse.
    const PAW_TAP_TIME = 0.24;
    // How far the cat's collider must overlap a platform to stand on it.
    const PLATFORM_EDGE_INSET = 10;
    // Catnip "zoomies": a speed boost for a few seconds.
    const ZOOMIES_DURATION = 7;
    const ZOOMIES_BOOST = 1.4;
    const CATNIP_LIFETIME = 10;
    // Seconds before the game-over card accepts a restart.
    const RESTART_DELAY = 1.2;

    const PALETTE = {
      coat: "#0b0b0d",
      // Far-side limbs are lifted toward grey so they read as further away.
      farLimb: "#2a2a2f",
      innerEar: "#4b2f37",
      // A dark grey sheen on the coat, and the grey fur behind the ears
      // ("r, g, b"; alpha is added when drawn).
      sheen: "70, 70, 82",
      earFur: "150, 150, 160",
      irisCore: "#f6f28c",
      irisEdge: "#9cc43a",
      pupil: "#060606",
      lid: "#3d3d45",
      whisker: "rgba(150, 150, 158, 0.9)"
    };

    // Warm room palette. Entries without "#" are "r, g, b" triplets that get an
    // alpha at draw time.
    const SCENE = {
      wallTop: "#faf6ef",
      wallBottom: "#efe6d8",
      skirting: "#f4ece0",
      skirtingEdge: "rgba(140, 110, 70, 0.22)",
      floorEdge: "#c2aa86",
      floorTop: "#e2d1b4",
      floorBottom: "#d2bd9a",
      floorSeam: "rgba(120, 90, 50, 0.13)",
      vignette: "70, 45, 20",
      shadow: "60, 40, 20",
      dust: "176, 150, 112",

      boxBottom: "#c48d50",

      boxHighlight: "rgba(255, 245, 225, 0.35)",
      tape: "#ead5aa",
      tapeEdge: "rgba(150, 110, 60, 0.35)",
      stamp: "rgba(110, 70, 35, 0.4)",
      woodLight: "#c4956a",
      wood: "#a97a50",
      woodDark: "#7d5434",
      woodShadow: "rgba(60, 35, 15, 0.22)",
      knob: "#e6c890",
      books: ["#c96f4a", "#5f8fa8", "#d8b25a", "#7e9f6a", "#a46a8c", "#e3d5ba", "#567a5c"],
      cord: "#4a3f37",
      lampShade: "#6f9a7e",
      lampShadeDark: "#557c63",
      floorLampShade: "#f3e6cb",
      floorLampEdge: "#cbb48b",
      lampPole: "#5c4a3b",
      lampLight: "255, 214, 140",
      holeTop: "#120b06",
      holeBottom: "#2a1c11",
      holeRim: "rgba(110, 75, 40, 0.3)",
      hudPanel: "rgba(255, 251, 244, 0.82)",
      hudEdge: "rgba(140, 110, 70, 0.25)",
      hudText: "#5b4636",
      hudMuted: "rgba(91, 70, 54, 0.6)",
      popup: "#c0662a",
      danger: "#b4472c",
      card: "rgba(255, 251, 244, 0.95)",
      rowHighlight: "rgba(242, 201, 76, 0.3)",
      sparkle: "245, 205, 79",
      cheese: "#f2c94c",
      cheeseEdge: "#c99a2e",
      cheeseHole: "#d9a93a",
      goldCheese: "#ffb72e",
      heart: "232, 96, 128",
      grasshopper: "#86b84a",
      grasshopperDark: "#5a8a2c",
      fly: "#34303a",
      flyEye: "#9c3b3b",
      bird: "#8a6a4a",
      birdDark: "#634a33",
      birdBreast: "#e07a4f",
      birdBeak: "#f2b33d",
      birdLeg: "#c0844a",
      cheeseLost: "rgba(140, 110, 70, 0.4)",
      sky: "#bfe1f5",
      skyLow: "#eaf6f2",
      cloud: "255, 255, 255",
      hillFar: "#bcd8ae",
      hillNear: "#a2c78f",
      tree: "#7ead69",
      treeDark: "#679a56",
      trunk: "#8a6a4a",
      frame: "#fbf8f2",
      frameEdge: "#d8ccb6",
      curtain: "#d38d6a",
      curtainDark: "#b8714f",
      curtainRod: "#7d5434",
      sunlight: "255, 240, 205",
      carpet: "#8ea3ba",
      carpetDark: "#71879f",
      sisal: "#cfae7f",
      sisalDark: "#a98656",
      toy: "#e66a86",
      toyString: "rgba(90, 70, 55, 0.7)",
      dog: "#9a6236",
      dogDark: "#744624",
      dogLight: "#d6a46e",
      dogEar: "#5f3b1f",
      dogNose: "#2a1b14",
      dogEye: "#2b1a10",
      tongue: "#e8707e",
      collar: "#3d7bd1",
      collarTag: "#f2c94c",
      catnip: "#4f9a3a",
      catnipDark: "#3b7429",
      zoomies: "120, 200, 90"
    };
    const FONT_FAMILY = "system-ui, -apple-system, 'Segoe UI', sans-serif";
    const font = (weight, size) => `${weight} ${size}px ${FONT_FAMILY}`;
    // Mice run along the floor line between arched holes in the skirting.
    const MOUSE_HOLE = { w: 30, h: 27 };
    // Scratching post sizes (px): carpeted base and top widths, the sisal
    // post's width, and the toy's string length and pompom radius.
    const POST = { base: 62, top: 66, pole: 22, string: 34, toy: 6 };
    // Coat colours per mouse kind (see MOUSE_KINDS); the rest is shared.
    const MOUSE_COATS = {
      grey: { fur: "#8f8780", belly: "#bdb3aa", ear: "#a69c94" },
      brown: { fur: "#8a6446", belly: "#caa98a", ear: "#9b7556" },
      gold: { fur: "#dcae3c", belly: "#f3dc8e", ear: "#e6c15e" }
    };
    const MOUSE_COLORS = {
      innerEar: "#e8a3a6",
      nose: "#e2848d",
      foot: "#c98b8f",
      tail: "#c29591",
      eye: "#161616",
      // Colour a mouse fades toward while it is inside a hole.
      dark: "#1c130c"
    };
    const BEST_SCORE_KEY = "cheese-chase-best-score";
    // The high-score list (see src/high-scores.js) and the last name typed
    // for it, which the next name entry starts from.
    const HIGH_SCORES_KEY = "cheese-chase-high-scores";
    const PLAYER_NAME_KEY = "cheese-chase-player-name";
    // Shown for a high score saved without a name.
    const NO_NAME = "Mystery cat";

    // Torso silhouette in local space (facing right, y down): rump -> back ->
    // withers -> deep chest -> full belly -> flank -> back of thigh. A
    // long-haired cat's belly hangs low rather than tucking up. Each curve is
    // [c1x, c1y, c2x, c2y, x, y] continuing from the previous end point.
    const BODY_OUTLINE = {
      start: [-44, -19],
      curves: [
        [-30, -25, -14, -19, 4, -19],
        [18, -19, 30, -24, 40, -20],
        [50, -16, 59, -5, 58, 8],
        [57, 21, 50, 30, 36, 31],
        [22, 32, 10, 27, -6, 27],
        [-20, 27, -32, 29, -44, 25],
        [-56, 21, -63, 7, -59, -6],
        [-56, -13, -52, -17, -44, -19]
      ]
    };

    // Local helpers that are app-specific; shared motion/physics helpers are imported.
    const approach = (value, target, step) => {
      if (value < target) return Math.min(value + step, target);
      if (value > target) return Math.max(value - step, target);
      return value;
    };
    const rotateVector = (x, y, angle) => ({
      x: x * Math.cos(angle) - y * Math.sin(angle),
      y: x * Math.sin(angle) + y * Math.cos(angle)
    });
    const smoothstep = (t) => {
      const u = clamp(t, 0, 1);
      return u * u * (3 - 2 * u);
    };

    // Samples the torso outline and returns the point plus its outward normal,
    // used to seat fur tufts exactly on the silhouette edge.
    function outlinePoint(curveIndex, t, outline = BODY_OUTLINE) {
      const curves = outline.curves;
      const [x0, y0] = curveIndex === 0 ? outline.start : curves[curveIndex - 1].slice(4);
      const [c1x, c1y, c2x, c2y, x3, y3] = curves[curveIndex];
      const u = 1 - t;
      const x = u * u * u * x0 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x3;
      const y = u * u * u * y0 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y3;
      const dx = 3 * u * u * (c1x - x0) + 6 * u * t * (c2x - c1x) + 3 * t * t * (x3 - c2x);
      const dy = 3 * u * u * (c1y - y0) + 6 * u * t * (c2y - c1y) + 3 * t * t * (y3 - c2y);
      const len = Math.hypot(dx, dy) || 1;
      // The outline runs clockwise on screen, so (dy, -dx) points outward.
      return { x, y, nx: dy / len, ny: -dx / len };
    }

    // Catmull-Rom resample so chains of rig joints (tail, neck) render as
    // smooth curves instead of visible straight segments.
    function smoothChain(points, samplesPerSegment = 4) {
      const out = [];
      const last = points.length - 1;
      for (let i = 0; i < last; i += 1) {
        const p0 = points[Math.max(i - 1, 0)];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[Math.min(i + 2, last)];
        for (let s = 0; s < samplesPerSegment; s += 1) {
          const t = s / samplesPerSegment;
          const t2 = t * t;
          const t3 = t2 * t;
          out.push({
            x: 0.5 * (2 * p1.x + (p2.x - p0.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (3 * p1.x - p0.x - 3 * p2.x + p3.x) * t3),
            y: 0.5 * (2 * p1.y + (p2.y - p0.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (3 * p1.y - p0.y - 3 * p2.y + p3.y) * t3)
          });
        }
      }
      out.push({ x: points[last].x, y: points[last].y });
      return out;
    }

    // The spine runs between these x positions of the resting torso. Rig
    // points are carried along it (see spinePoint), so arching or stretching
    // the spine moves the legs, neck and tail with it.
    const SPINE_REAR_X = -48;
    const SPINE_FRONT_X = 44;

    // The torso outline sampled for drawing. Each sample carries a lock of
    // fluffy fur: longest on the chest ruff, the belly and the britches behind
    // the thighs, short along the back. `sweep` is how far a lock turns from
    // pointing straight out toward lying back along the coat.
    const BODY_SAMPLES = (() => {
      const rand = seededRandom(9157);
      const samples = [];
      for (let c = 0; c < BODY_OUTLINE.curves.length; c += 1) {
        for (let i = 0; i < 8; i += 1) {
          const point = outlinePoint(c, i / 8);
          const back = point.ny < -0.55;
          const chest = !back && point.x > 36;
          const britches = !back && point.x < -36;
          const belly = !back && !chest && !britches && point.ny > 0.4;
          const size = chest ? 10 : belly ? 9 : britches ? 8.5 : 4.5;
          samples.push({
            ...point,
            len: size * (0.7 + rand() * 0.6),
            wid: size * (0.5 + rand() * 0.25),
            sweep: (back ? 1.1 : 0.45) + (rand() - 0.5) * 0.5,
            down: !back
          });
        }
      }
      return samples;
    })();

    // The dog's resting body (facing right, y down from its spine; see
    // src/dog.js): a deep chest, a tucked-up belly and a rounded rump, traced
    // clockwise like the cat's, and sampled for drawing along its spine.
    const DOG_OUTLINE = {
      start: [-52, -22],
      curves: [
        [-30, -27, 10, -23, 34, -27],
        [46, -29, 62, -16, 63, 2],
        [64, 20, 52, 31, 36, 31],
        [22, 31, 8, 19, -10, 16],
        [-24, 14, -36, 22, -48, 27],
        [-60, 31, -71, 14, -67, -5],
        [-65, -15, -60, -21, -52, -22]
      ]
    };
    const DOG_SAMPLES = DOG_OUTLINE.curves.flatMap((_, c) =>
      Array.from({ length: 6 }, (_, i) => outlinePoint(c, i / 6, DOG_OUTLINE)));

    // Small fixed scatter for the tail's and ruff's fur locks.
    const FUR_JITTER = (() => {
      const rand = seededRandom(4421);

    })();

    // The room is one fixed size in every window, so the game plays the same
    // however big or oddly shaped the window is. All positions are in room
    // units. The view shows part of the room, scaled to fit the screen (see
    // fitCanvas), and scrolls sideways to follow the cat (see updateCamera).
    // It is VIEW_W wide, so as much of the room is in sight everywhere: a
    // screen wider than 16:9 shows less of the plain wall at the top rather
    // than bars at the sides (down to MIN_VIEW_H), and one narrower than 16:9
    // gets bars above and below. A touch screen held upright asks to be

    const ROOM_W = 1920;
    const ROOM_H = 720;

    const floorY = 604;

    // phone's notch, rounded corners and home bar.
    const view = { w: VIEW_W, h: ROOM_H, top: 0, safe: { left: 0, right: 0, top: 0, bottom: 0 } };
    // The HUD, cards and badges over the view are drawn `hud.scale` times
    // larger, so text stays readable on a small screen; `w`, `h` and `safe`
    // are the view's in those larger units.
    const hud = { scale: 1, w: VIEW_W, h: ROOM_H, safe: { left: 0, right: 0, top: 0, bottom: 0 } };
    // On-screen buttons, for touch screens (see layoutTouch). On while the
    // last input was a touch; a key press turns them off again.
    let touchUI = window.matchMedia("(pointer: coarse)").matches;
    // Where fitCanvas put things, in CSS px: the canvas, the screen's safe

    const screenLayout = { left: 0, top: 0, width: 0, height: 0, scale: 1, insets: null, buttonsTop: Infinity };
    // Device pixels per room unit (the screen fit times devicePixelRatio).
    let pixelScale = 1;
    let nowSeconds = 0;
    // The view's left edge in the room. `lead` is how far ahead of the cat
    // it looks (px), eased so a turn pans the view smoothly; the rates are
    // per second.
    const camera = { x: 0, lead: 0 };
    const CAMERA_LEAD = 150;
    const CAMERA_TURN = 1.4;
    const CAMERA_FOLLOW = 6;

    // Static room layers are rendered into this buffer, the whole room wide.
    // The cat is drawn onto its own layer, so the coat's sheen can be laid
    // over all of it (and only it) before it goes onto the scene. The layer
    // covers CAT_LAYER (room units) around the cat.
    const CAT_LAYER = { w: 560, h: 460, left: 280, up: 260 };
    const catLayer = document.createElement("canvas");
    const catCtx = catLayer.getContext("2d");
    const backdrop = document.createElement("canvas");
    const backdropCtx = backdrop.getContext("2d");
    // A soft vignette over the view, painted once per window size at full
    // resolution: filling the gradient, or stretching a small image of it,
    // over the whole view every frame is slow.
    const vignette = document.createElement("canvas");
    // Device pixels per room unit in the backdrop; capped, as the backdrop
    // holds the whole room and would otherwise get very large.
    let backdropScale = 1;
    const BACKDROP_MAX_SCALE = 2.5;
    // Short-lived dust puffs from take-offs and landings.
    const dust = [];
    const mice = [];
    // Floating "+10" texts, sparkle bursts, and cheese dropped by booped mice.
    const popups = [];
    const sparkles = [];
    const cheeseBits = [];
    // Grasshoppers, flies and the bird (see updateCritters), with the
    // countdowns to the next of each.
    const critters = [];
    const critterTimers = { grasshopper: 4, fly: 8, bird: 0 };
    const sfx = createSfx();
    const game = {
      // "title" -> "playing" -> "over". The cat can roam on every screen.
      state: "title",
      paused: false,
      score: 0,
      best: 0,
      boops: 0,
      cheese: MAX_CHEESE,
      wave: 0,
      waveCfg: waveConfig(1),
      // Mice still to come out this wave; one that retreats home rejoins it.
      queue: 0,
      cheeseLostThisWave: 0,
      goldPending: false,
      spawnTimer: 0,
      // Countdown to the next wave once one is cleared.
      nextWaveIn: 0,
      banner: null,
      toast: null,
      streak: 0,
      lastBoopAt: -10,
      landedAt: -10,
      justLanded: false,
      squeakAt: -10,
      shake: 0,
      cheeseFlash: 0,
      overAt: 0,
      catnip: null,
      catnipIn: 0,
      zoomies: 0,
      // The dog: the one running across now (see src/dog.js), the warning
      // before it comes ({ t, dir }), how many more this wave and when the
      // next is due; and how long the cat is still dizzy from a bump.
      dog: null,
      dogWarn: null,
      dogsLeft: 0,
      dogIn: 0,
      dizzy: 0,
      // High scores, best first, and the last name typed for one. While a
      // new high score is being named, `entry` is { rank, name } (rank 0 is
      // the top); `savedRank` marks the row just saved on the game-over card.
      highScores: [],
      playerName: "",
      entry: null,

    };
    try {

      // A best score from before there was a list starts the list off.
      if (!game.highScores.length && game.best > 0) game.highScores = [{ name: "", score: game.best, wave: null }];
      game.playerName = cleanName(localStorage.getItem(PLAYER_NAME_KEY));
    } catch {
      // Storage can be unavailable (private mode); the scores just reset.
    }

    const world = {
      // Single obstacle for the jump test.
      box: {
        x: 0,
        y: 0,
        w: 140,
        h: 110
      },
      // Mouse holes along the skirting, rebuilt in resize().
      holes: [],
      // Furniture, laid out in resize(). The table top and the bookcase's
      // cupboard top, middle shelf and top are one-way platforms: the cat jumps
      // up through them, stands on them, and drops through with the down key.
      table: { x: 0, w: 0, top: 0 },
      bookcase: { x: 0, w: 0, levels: [] },
      // Pendulum lamp over the table, hung from the ceiling. The
      // cat can bump it into a swing; the bird likes to sit on it.
      hangingLamp: { x: 0, length: 0, angle: 0, omega: 0, bumpCooldown: 0, bumpedAt: -10 },
      // Floor lamp on the open floor; its shade top is another bird perch.
      floorLamp: { x: 0, top: 0 },
      // A window high on the wall (glass rect; its sill is a perch), and a
      // sisal scratching post with a carpeted top and a pompom toy hanging
      // from it on a string (a pendulum the cat can bat).
      window: { x: 0, w: 0, top: 0, h: 0, sill: 0 },
      // The two curtains either side of the window, hung from a rod: their
      // extent, inner (window side) and outer edges, and a sway spring (px)
      // the cat sets going when it catches one.
      curtains: [],
      post: { x: 0, top: 0, toyAngle: 0, toyOmega: 0, toyCooldown: 0 },
      platforms: []
    };
    const physics = {
      // Matter.js world: this handles rigid body collision fidelity.
      engine: null,
      catBody: null,
      floorBody: null,
      leftWallBody: null,
      rightWallBody: null,
      boxBody: null,
      platformBodies: []
    };

    const legLayout = [
      // Built like a cat's legs. A hind leg is thigh, shin and a long foot
      // that stands up on its toes: the knee points forward and the hock
      // back. A foreleg hangs from a shoulder blade that rocks with the stride
      // (lengthening the reach), has a backward elbow, and ends in a short
      // paw that folds back at the wrist as it lifts. (localX, localY) is the
      // hip or the top of the shoulder blade; stanceX is where the paw rests
      // relative to it; distal is the foot or paw below the hock or wrist.
      // Standing (standX), a foreleg is straight with the paw under the
      // elbow, and the long hind foot stands nearly upright with the hock a
      // third of the way up; moving, the stride centres on stanceX.
      { name: "rear-far", localX: -36, localY: -2, standX: -2, stanceX: -2, near: false, upper: 23.5, lower: 22.5, distal: 21 },
      { name: "front-far", localX: 30, localY: -12, standX: -6, stanceX: 4, near: false, blade: 15, upper: 20, lower: 28, distal: 10.5 },
      { name: "rear-near", localX: -32, localY: -1, standX: -2, stanceX: -2, near: true, upper: 23.5, lower: 22.5, distal: 21 },
      { name: "front-near", localX: 34, localY: -11, standX: -6, stanceX: 4, near: true, blade: 15, upper: 20, lower: 28, distal: 10.5 }
    ];

    const cat = {
      x: 220,
      y: 0,
      w: 104,
      h: 98,
      // Physics uses a dedicated torso collider so visual legs/tail/head do not
      // produce unfair collisions with the obstacle.
      collider: {
        w: 94,
        h: 60,
        offsetY: 8
      },
      vx: 0,
      vy: 0,
      ax: 0,
      ay: 0,
      onGround: false,
      supportSurface: "floor",
      // The surface object under the cat (see walkableSurfaces), or null.
      support: null,
      // Seconds left of falling through one-way platforms after pressing down.
      dropTimer: 0,
      // A quick forepaw tap toward a booped animal: { t, x, y } while it plays.
      pawTap: null,
      sneaking: false,
      coyoteTime: 0,
      jumpBuffer: 0,
      facing: 1,
      previousFacing: 1,
      gait: 0,
      gaitParams: gaitParams(0),
      jumpQueued: false,
      // sqrt(2 * GRAVITY * 300): rises ~300px when Space is held.
      jumpSpeed: 1430,
      jumpCut: false,
      legs: legLayout.map((cfg) => ({
        ...cfg,
        mode: "stance",
        plant: { x: 0, y: 0 },
        swingStart: { x: 0, y: 0 },
        swingT: 1,
        swingRate: 6,
        inSwingWindow: false,
        // Set when the leg can't reach its planted paw, so it steps.
        strained: false,
        // A hind paw still pushing off the ground just after take-off.
        pushing: false,
        // A paw coming down after a landing (the hind paws, which touch down
        // after the forepaws).
        landing: false,
        // The paw's angle below the wrist or hock (see distalAngle), and the
        // angle it had when it last lifted.
        angle: 0,
        liftOffAngle: 0,
        // target and foot are the toes; the rest are joints from the top down.
        target: { x: 0, y: 0 },
        foot: { x: 0, y: 0 },
        hip: { x: 0, y: 0 },
        shoulder: { x: 0, y: 0 },
        knee: { x: 0, y: 0 },
        ankle: { x: 0, y: 0 }
      })),
      pose: {
        // Bob/tilt are procedural and respond to gait and momentum.
        bob: 0,
        tilt: 0,
        // Landing squash, decaying from ~1 to 0.
        land: 0,
        // The spine (see spinePoint): arch in px (+ rounds the back up, -
        // hollows it) and length as a factor of resting, each a spring.
        arch: 0,
        archVel: 0,
        length: 1,
        lengthVel: 0,
        // 0..1 blend into the low sneaking crouch.
        sneak: 0,
        // Smoothed lean of the back, and the extra nose-up pitch about the
        // shoulders as the hind legs push off; tilt is the two together.
        lean: 0,
        launch: 0,
        // -1..1 breathing while standing still.
        breath: 0,
        // The belly and loose coat lagging the body (see updatePose): sag
        // down and swing back in px, the last visual position and speed.
        loose: { sag: 0, sagVel: 0, swing: 0, swingVel: 0, x: null, y: null, vx: null, vy: null }
      },
      // Set while the cat's claws are stuck in a curtain (see updateCling):
      // { curtain, t, dur, x, y, maxY, struggle, slipIn }. The cooldown
      // gives the cat a rest from the curtains once it comes free.
      cling: null,
      clingCooldown: 0,
      // True from a jump's take-off until the cat lands again.
      leapt: false,
      // The quick crouch onto the hind legs before a jump: { t, dur }.
      crouch: null,
      justJumped: false,
      tail: {
        lengths: [11, 11, 11, 10.5, 10.5, 10, 10, 9.5, 9.5],
        angles: [],
        velocities: [],
        joints: []
      },
      head: {
        neckUpper: 22,
        neckLower: 19,
        neckBase: { x: 0, y: 0 },
        neckJoint: { x: 0, y: 0 },
        pos: { x: 0, y: 0 },
        // 0 = eyes open, 1 = fully closed.
        blink: 0,
        blinkT: BLINK_DURATION,
        blinkTimer: 1.8
      }
    };

    const debug = {
      showHitboxes: false
    };

    const input = {
      // We only use horizontal arrows. Jump is handled as a queued action.
      ArrowLeft: false,
      ArrowRight: false,
      ArrowDown: false,
      Space: false
    };

    function buildPhysicsWorld() {
      // Rebuild the full rigid-body world whenever geometry changes.
      const prevX = cat.x;
      const prevY = cat.y || centerYForSurface(floorY);
      const wallThickness = 260;
      const floorThickness = 260;

      physics.engine = Engine.create({
        // Matter's gravity scale is in px/ms².
        gravity: { x: 0, y: 1, scale: GRAVITY / 1e6 },
        positionIterations: 10,
        velocityIterations: 8
      });

      physics.floorBody = Bodies.rectangle(
        ROOM_W / 2,
        floorY + floorThickness / 2,
        ROOM_W + wallThickness * 2,
        floorThickness,
        { isStatic: true, friction: 0.9, frictionStatic: 1.1 }
      );
      physics.leftWallBody = Bodies.rectangle(
        -wallThickness / 2,
        ROOM_H / 2,
        wallThickness,
        ROOM_H * 2,
        { isStatic: true }
      );
      physics.rightWallBody = Bodies.rectangle(
        ROOM_W + wallThickness / 2,
        ROOM_H / 2,
        wallThickness,
        ROOM_H * 2,
        { isStatic: true }
      );
      physics.boxBody = Bodies.rectangle(
        world.box.x + world.box.w / 2,
        world.box.y + world.box.h / 2,
        world.box.w,
        world.box.h,
        { isStatic: true, friction: 0.88, frictionStatic: 1.08 }
      );

      const startX = clamp(prevX, 120, ROOM_W - 120);
      const startY = Math.min(prevY, centerYForSurface(floorY));
      physics.catBody = Bodies.rectangle(
        startX,
        startY + cat.collider.offsetY,
        cat.collider.w,
        cat.collider.h,
        {
          // Horizontal speed is set by the controller every frame. Contact
          // friction is applied per physics step, so any friction here made
          // the cat run at half speed on 120 Hz displays; air drag made jumps
          // floaty.
          friction: 0,
          frictionStatic: 0,
          frictionAir: 0,
          restitution: 0,
          slop: 0.01
        }
      );
      Body.setInertia(physics.catBody, Infinity);
      Body.setAngle(physics.catBody, 0);

      physics.platformBodies = world.platforms.map((platform, i) => {
        const thickness = 60;
        platform.category = 0x0002 << i;
        // Narrower than drawn by the same inset surfaceUnderCat() uses, so the
        // physics never holds the cat up on a sliver it doesn't count as ground.
        return Bodies.rectangle(
          (platform.left + platform.right) / 2,
          platform.top + thickness / 2,
          platform.right - platform.left - PLATFORM_EDGE_INSET * 2,
          thickness,
          { isStatic: true, friction: 0.88, collisionFilter: { category: platform.category } }
        );
      });

      Composite.add(physics.engine.world, [
        physics.floorBody,
        physics.leftWallBody,
        physics.rightWallBody,
        physics.boxBody,
        ...physics.platformBodies,
        physics.catBody
      ]);

      cat.x = startX;
      cat.y = startY;
      cat.vx = 0;
      cat.vy = 0;
      cat.ax = 0;
      cat.ay = 0;
    }

    // The screen's safe-area insets (notch, rounded corners, home bar) in CSS
    // px, read from a probe padded with env(safe-area-inset-*).
    const safeProbe = document.createElement("div");
    safeProbe.style.cssText = "position: fixed; visibility: hidden; pointer-events: none; " +
      "padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);";
    document.body.appendChild(safeProbe);
    function safeInsets() {
      const style = getComputedStyle(safeProbe);
      const px = (value) => parseFloat(value) || 0;
      return { top: px(style.paddingTop), right: px(style.paddingRight), bottom: px(style.paddingBottom), left: px(style.paddingLeft) };
    }

    // Fits the view to the screen (see the room constants for how) at the
    // screen's full resolution, and lays out the touch buttons. Returns false
    // while the window has no size (a hidden pane or a background tab).
    function fitCanvas() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      if (W === 0 || H === 0) return false;
      const insets = safeInsets();
      const scale = Math.min(W / VIEW_W, H / MIN_VIEW_H);
      view.w = VIEW_W;
      view.h = Math.min(ROOM_H, H / scale);
      view.top = ROOM_H - view.h;
      const cssW = Math.round(view.w * scale);
      const cssH = Math.round(view.h * scale);
      const left = Math.round((W - cssW) / 2);
      const top = Math.round((H - cssH) / 2);
      // Only the part of an inset that overlaps the view counts.
      view.safe.left = Math.max(0, insets.left - left) / scale;
      view.safe.right = Math.max(0, insets.right - (W - left - cssW)) / scale;
      view.safe.top = Math.max(0, insets.top - top) / scale;
      view.safe.bottom = Math.max(0, insets.bottom - (H - top - cssH)) / scale;
      hud.scale = clamp(0.72 / scale, 1, 1.4);
      hud.w = view.w / hud.scale;
      hud.h = view.h / hud.scale;
      for (const side of Object.keys(view.safe)) hud.safe[side] = view.safe[side] / hud.scale;
      Object.assign(screenLayout, { left, top, width: cssW, height: cssH, scale, insets });

      const ratio = Math.max(1, window.devicePixelRatio || 1);
      canvas.style.left = `${left}px`;
      canvas.style.top = `${top}px`;
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      // Rounded corners only on a view framed by bars.
      canvas.style.borderRadius = cssW < W - 1 && cssH < H - 1 ? "6px" : "0";
      canvas.width = Math.round(cssW * ratio);
      canvas.height = Math.round(cssH * ratio);
      pixelScale = canvas.width / view.w;
      catLayer.width = Math.ceil(CAT_LAYER.w * pixelScale);
      catLayer.height = Math.ceil(CAT_LAYER.h * pixelScale);
      buildBackdrop();
      buildVignette();
      layoutTouch();
      showRotateNotice(touchUI && H > W);
      return true;
    }

    // Lays out the room, once: furniture, mouse holes and the physics world.
    function layoutRoom() {
      world.box.w = 160;
      world.box.h = 82;
      // The box stands at the right end: a lookout, not a wall across the
      // mice's path (mice behind it can't be booped).
      world.box.x = ROOM_W - world.box.w - 76;
      world.box.y = floorY - world.box.h;

      // Bookcase on the left: a cupboard below, an open shelf, and the top.
      // The cupboard and the table sit just above a tapped hop (~170px), so
      // hopping at a mouse never strands the cat up there; a held jump climbs.
      const bookcase = world.bookcase;
      bookcase.w = 160;
      bookcase.x = 96;
      const caseHeight = 324;
      const firstLevel = 180;
      bookcase.levels = [0, 0.5, 1].map((f) => floorY - Math.round(firstLevel + (caseHeight - firstLevel) * f));
      const table = world.table;
      table.w = 240;
      table.x = 480;
      table.top = floorY - firstLevel;
      const lamp = world.hangingLamp;
      lamp.x = table.x + table.w / 2;
      lamp.length = table.top - 150;

      // The open floor between the table and the box, left to right: a mouse
      // hole, the window high on the wall, the scratching post, another hole
      // and the floor lamp. The sill is in reach of a full jump from the
      // floor; the post's top is a little higher than the table.
      const openLeft = table.x + table.w;
      const openFloor = world.box.x - openLeft;
      const win = world.window;
      win.w = 170;
      win.h = 136;
      win.x = Math.round(openLeft + openFloor * 0.33);
      win.sill = floorY - 250;
      win.top = win.sill - 8 - win.h;
      const panelW = Math.round(win.w * 0.24);
      world.curtains = [-1, 1].map((side) => {
        const outer = side < 0 ? win.x - win.w / 2 - 38 : win.x + win.w / 2 + 38;
        const inner = outer - side * panelW;
        return {
          side,
          inner,
          outer,
          left: Math.min(inner, outer),
          right: Math.max(inner, outer),
          top: win.top - 20,
          bottom: win.sill + 80,
          sway: 0,
          swayVel: 0
        };
      });
      const post = world.post;
      post.x = Math.round(openLeft + openFloor * 0.57);
      post.top = floorY - 200;
      world.platforms = [
        { kind: "table", left: table.x, right: table.x + table.w, top: table.top },
        { kind: "sill", left: win.x - win.w / 2 - 10, right: win.x + win.w / 2 + 10, top: win.sill },
        { kind: "post", left: post.x - POST.top / 2, right: post.x + POST.top / 2, top: post.top },
        ...bookcase.levels.map((top, i) => ({
          kind: i === 2 ? "bookcase-top" : "shelf",
          left: bookcase.x,
          right: bookcase.x + bookcase.w,
          top
        }))
      ];
      buildPhysicsWorld();

      // One hole between the bookcase and the table, two on the open floor
      // either side of the scratching post.
      world.floorLamp.x = Math.round(openLeft + openFloor * 0.84);
      world.floorLamp.top = floorY - 330;
      world.holes = [
        (bookcase.x + bookcase.w + table.x) / 2,
        openLeft + openFloor * 0.18,
        openLeft + openFloor * 0.66
      ].map((x) => ({ x: Math.round(x) }));
      spawnBird(true);
    }

    function buildBackdrop() {
      backdropScale = Math.min(pixelScale, BACKDROP_MAX_SCALE);
      backdrop.width = Math.ceil(ROOM_W * backdropScale);
      backdrop.height = Math.ceil(ROOM_H * backdropScale);
      const b = backdropCtx;
      b.setTransform(backdropScale, 0, 0, backdropScale, 0, 0);

      const wall = b.createLinearGradient(0, 0, 0, floorY);
      wall.addColorStop(0, SCENE.wallTop);
      wall.addColorStop(1, SCENE.wallBottom);
      b.fillStyle = wall;
      b.fillRect(0, 0, ROOM_W, floorY);

      // Skirting board along the wall line.
      const skirting = 12;
      b.fillStyle = SCENE.skirting;
      b.fillRect(0, floorY - skirting, ROOM_W, skirting);
      b.fillStyle = SCENE.skirtingEdge;
      b.fillRect(0, floorY - skirting, ROOM_W, 1.5);

      const floor = b.createLinearGradient(0, floorY, 0, ROOM_H);
      floor.addColorStop(0, SCENE.floorTop);
      floor.addColorStop(1, SCENE.floorBottom);
      b.fillStyle = floor;
      b.fillRect(0, floorY, ROOM_W, ROOM_H - floorY);

      // Plank rows widen toward the viewer for a hint of depth; joints are
      // staggered per row with a fixed pseudo-random offset.
      b.strokeStyle = SCENE.floorSeam;
      b.lineWidth = 1;
      b.beginPath();
      let rowTop = floorY;
      let rowHeight = 9;
      for (let row = 0; rowTop < ROOM_H; row += 1) {
        const rowBottom = rowTop + rowHeight;
        const seamY = Math.round(rowBottom) + 0.5;
        b.moveTo(0, seamY);
        b.lineTo(ROOM_W, seamY);
        const plankW = 150 + rowHeight * 6;
        for (let x = (((row * 97) % 7) / 7) * plankW; x < ROOM_W; x += plankW) {
          b.moveTo(Math.round(x) + 0.5, rowTop);
          b.lineTo(Math.round(x) + 0.5, rowBottom);
        }
        rowTop = rowBottom;
        rowHeight *= 1.45;
      }
      b.stroke();

      b.fillStyle = SCENE.floorEdge;
      b.fillRect(0, floorY - 1, ROOM_W, 2);

      // Arched mouse holes cut through the skirting: a soft rim, then a dark
      // interior that gets a little lighter toward the floor.
      const archPath = (cx, w, h) => {
        b.beginPath();
        b.moveTo(cx - w / 2, floorY);
        b.lineTo(cx - w / 2, floorY - h + w / 2);
        b.arc(cx, floorY - h + w / 2, w / 2, Math.PI, 0);
        b.lineTo(cx + w / 2, floorY);
        b.closePath();
      };
      for (const hole of world.holes) {
        b.fillStyle = SCENE.holeRim;
        archPath(hole.x, MOUSE_HOLE.w + 5, MOUSE_HOLE.h + 3);
        b.fill();
        const inside = b.createLinearGradient(0, floorY - MOUSE_HOLE.h, 0, floorY);
        inside.addColorStop(0, SCENE.holeTop);
        inside.addColorStop(1, SCENE.holeBottom);
        b.fillStyle = inside;
        archPath(hole.x, MOUSE_HOLE.w, MOUSE_HOLE.h);
        b.fill();
      }

      drawSunPatch(b);
      drawBookcase(b);
      drawTable(b);
      drawScratchingPost(b);
      drawFloorLamp(b);
    }

    // Keeps the eye near the middle of the view.
    function buildVignette() {
      vignette.width = canvas.width;
      vignette.height = canvas.height;
      const g = vignette.getContext("2d");
      g.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
      const cx = view.w / 2;
      const cy = view.h * 0.55;
      const gradient = g.createRadialGradient(cx, cy, Math.min(view.w, view.h) * 0.35, cx, cy, Math.hypot(view.w, view.h) * 0.65);
      gradient.addColorStop(0, `rgba(${SCENE.vignette}, 0)`);
      gradient.addColorStop(1, `rgba(${SCENE.vignette}, 0.12)`);
      g.fillStyle = gradient;
      g.fillRect(0, 0, view.w, view.h);
    }

    // Light from the window falling across the floor below it.
    function drawSunPatch(g) {
      const win = world.window;
      const left = win.x - win.w / 2 + 40;
      const patch = g.createLinearGradient(0, floorY, 0, floorY + 40);
      patch.addColorStop(0, `rgba(${SCENE.sunlight}, 0.45)`);
      patch.addColorStop(1, `rgba(${SCENE.sunlight}, 0)`);
      g.fillStyle = patch;
      g.beginPath();
      g.moveTo(left, floorY);
      g.lineTo(left + win.w, floorY);
      g.lineTo(left + win.w + 70, floorY + 40);
      g.lineTo(left + 70, floorY + 40);
      g.closePath();
      g.fill();
    }

    function drawScratchingPost(g) {
      // A carpeted base, a sisal-wrapped post and a carpeted top.
      const { x, top } = world.post;
      g.fillStyle = SCENE.woodShadow;
      g.beginPath();
      g.ellipse(x, floorY + 1, POST.base * 0.55, 4, 0, 0, TAU);
      g.fill();
      const poleTop = top + 12;
      const poleBottom = floorY - 10;
      const sisal = g.createLinearGradient(x - POST.pole / 2, 0, x + POST.pole / 2, 0);
      sisal.addColorStop(0, SCENE.sisalDark);
      sisal.addColorStop(0.45, SCENE.sisal);
      sisal.addColorStop(1, SCENE.sisalDark);
      g.fillStyle = sisal;
      g.fillRect(x - POST.pole / 2, poleTop, POST.pole, poleBottom - poleTop);
      // Rope wraps: thin slanted grooves all the way up.
      g.save();
      g.beginPath();
      g.rect(x - POST.pole / 2, poleTop, POST.pole, poleBottom - poleTop);
      g.clip();
      g.strokeStyle = "rgba(110, 80, 45, 0.35)";
      g.lineWidth = 1;
      g.beginPath();
      for (let y = poleTop; y < poleBottom + 6; y += 4) {
        g.moveTo(x - POST.pole / 2, y + 2);
        g.lineTo(x + POST.pole / 2, y - 2);
      }
      g.stroke();
      g.restore();
      const carpet = (cx, y, w, h) => {
        const pad = g.createLinearGradient(0, y, 0, y + h);
        pad.addColorStop(0, SCENE.carpet);
        pad.addColorStop(1, SCENE.carpetDark);
        g.fillStyle = pad;
        g.beginPath();
        g.roundRect(cx - w / 2, y, w, h, 5);
        g.fill();
        g.fillStyle = "rgba(255, 255, 255, 0.18)";
        g.fillRect(cx - w / 2 + 4, y + 1.5, w - 8, 1.5);
      };
      carpet(x, floorY - 11, POST.base, 11);
      carpet(x, top, POST.top, 13);
    }

    function updatePostToy(dt) {
      // The pompom swings on its string; a head or forepaw bats it.
      const post = world.post;
      post.toyCooldown = Math.max(0, post.toyCooldown - dt);
      post.toyOmega += -Math.sin(post.toyAngle) * 22 * dt;
      post.toyOmega *= Math.exp(-dt * 0.9);
      post.toyAngle = clamp(post.toyAngle + post.toyOmega * dt, -1.2, 1.2);
      const toy = postToyPoint();
      if (post.toyCooldown <= 0 && catTouches(toy.x, toy.y, POST.toy + 4)) {
        const side = Math.abs(cat.vx) > 20 ? Math.sign(cat.vx) : Math.sign(toy.x - cat.x) || 1;
        post.toyOmega += side * (2.5 + Math.min(Math.abs(cat.vx), 400) / 160);
        post.toyCooldown = 0.4;
        sfx.jingle();
      }
    }

    // Where the pompom hangs: below the front edge of the post's top.
    function postToyPoint() {
      const { x, top, toyAngle } = world.post;
      const ax = x + POST.top / 2 - 8;
      const ay = top + 12;
      return { ax, ay, x: ax + Math.sin(toyAngle) * POST.string, y: ay + Math.cos(toyAngle) * POST.string };
    }

    function drawPostToy() {
      const toy = postToyPoint();
      ctx.strokeStyle = SCENE.toyString;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(toy.ax, toy.ay);
      ctx.lineTo(toy.x, toy.y);
      ctx.stroke();
      // A fluffy pompom: a soft blurred halo round a ball with a lighter top.
      fillSoft(() => {
        ctx.moveTo(toy.x + POST.toy + 1.5, toy.y);
        ctx.arc(toy.x, toy.y, POST.toy + 1.5, 0, TAU);
      }, SCENE.toy, 2.5);
      const ball = ctx.createRadialGradient(toy.x - 2, toy.y - 2, 1, toy.x, toy.y, POST.toy);
      ball.addColorStop(0, "#f8a8bc");
      ball.addColorStop(1, SCENE.toy);
      ctx.fillStyle = ball;
      ctx.beginPath();
      ctx.arc(toy.x, toy.y, POST.toy, 0, TAU);
      ctx.fill();
    }

    function drawWindow() {
      // Sky with drifting clouds, hills and a tree outside; a white frame
      // with a sill; curtains either side that stir in a breeze.
      const win = world.window;
      const left = win.x - win.w / 2;
      const { top, w, h } = win;
      ctx.save();
      ctx.beginPath();
      ctx.rect(left, top, w, h);
      ctx.clip();
      const sky = ctx.createLinearGradient(0, top, 0, top + h);
      sky.addColorStop(0, SCENE.sky);
      sky.addColorStop(1, SCENE.skyLow);
      ctx.fillStyle = sky;
      ctx.fillRect(left, top, w, h);
      const sun = ctx.createRadialGradient(left + w * 0.75, top + h * 0.22, 2, left + w * 0.75, top + h * 0.22, w * 0.5);
      sun.addColorStop(0, "rgba(255, 250, 225, 0.95)");
      sun.addColorStop(1, "rgba(255, 250, 225, 0)");
      ctx.fillStyle = sun;
      ctx.fillRect(left, top, w, h);
      for (let i = 0; i < 3; i += 1) {
        const span = w + 120;
        const cx = left - 60 + ((nowSeconds * (6 + i * 3) + i * 97) % span);
        const cy = top + h * (0.2 + i * 0.16);
        ctx.fillStyle = `rgba(${SCENE.cloud}, 0.9)`;
        ctx.beginPath();
        for (const [dx, dy, r] of [[-14, 3, 9], [-3, -3, 12], [10, 2, 10], [20, 5, 7]]) {
          ctx.moveTo(cx + dx + r, cy + dy);
          ctx.arc(cx + dx, cy + dy, r * (0.8 + i * 0.1), 0, TAU);
        }
        ctx.fill();
      }
      const hill = (color, base, amp, phase) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(left, top + h);
        for (let x = 0; x <= w; x += 8) {
          ctx.lineTo(left + x, top + h * base - Math.sin(x / w * Math.PI * 1.3 + phase) * amp);
        }
        ctx.lineTo(left + w, top + h);
        ctx.closePath();
        ctx.fill();
      };
      hill(SCENE.hillFar, 0.78, h * 0.08, 0.4);
      hill(SCENE.hillNear, 0.9, h * 0.06, 2.1);
      // A tree just outside, its crown swaying a little.
      const sway = Math.sin(nowSeconds * 0.9) * 1.5;
      ctx.fillStyle = SCENE.trunk;
      ctx.fillRect(left + w * 0.2 - 3, top + h * 0.55, 6, h * 0.45);
      for (const [dx, dy, r, color] of [[-10, 0.5, 16, SCENE.treeDark], [8, 0.47, 15, SCENE.treeDark], [-2, 0.38, 18, SCENE.tree], [12, 0.52, 11, SCENE.tree]]) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(left + w * 0.2 + dx + sway, top + h * dy, r, 0, TAU);
        ctx.fill();
      }
      // A light streak across the glass.
      ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
      ctx.beginPath();
      ctx.moveTo(left + w * 0.55, top);
      ctx.lineTo(left + w * 0.72, top);
      ctx.lineTo(left + w * 0.35, top + h);
      ctx.lineTo(left + w * 0.18, top + h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Frame, glazing bars and sill.
      const frameW = 7;
      ctx.strokeStyle = SCENE.frame;
      ctx.lineWidth = frameW;
      ctx.strokeRect(left - frameW / 2, top - frameW / 2, w + frameW, h + frameW);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(win.x, top);
      ctx.lineTo(win.x, top + h);
      ctx.moveTo(left, top + h * 0.48);
      ctx.lineTo(left + w, top + h * 0.48);
      ctx.stroke();
      ctx.strokeStyle = SCENE.frameEdge;
      ctx.lineWidth = 1;
      ctx.strokeRect(left - frameW, top - frameW, w + frameW * 2, h + frameW * 2);

      // Curtains on a rod, gathered in soft folds, their hems swaying.
      const rodY = top - 20;
      ctx.fillStyle = SCENE.curtainRod;
      ctx.fillRect(left - 44, rodY - 2, w + 88, 4);
      for (const curtain of world.curtains) {
        const { side, inner, outer, bottom: hemY } = curtain;
        const breeze = Math.sin(nowSeconds * 1.3 + side) * 3 + curtain.sway;
        const cloth = ctx.createLinearGradient(curtain.left, 0, curtain.right, 0);
        for (let k = 0; k <= 6; k += 1) cloth.addColorStop(k / 6, k % 2 ? SCENE.curtainDark : SCENE.curtain);
        ctx.fillStyle = cloth;
        ctx.beginPath();
        ctx.moveTo(outer, rodY);
        ctx.lineTo(inner, rodY);
        ctx.quadraticCurveTo(inner - side * 6 + curtain.sway * 0.5, (rodY + hemY) / 2, inner + breeze, hemY);
        ctx.lineTo(outer + breeze * 0.5, hemY + 4);
        ctx.closePath();
        ctx.fill();
        // A cat stuck in the curtain pulls the cloth into folds: from along
        // the rod down to its claws, and from its claws to the hem.
        if (cat.cling?.curtain === curtain) {
          ctx.save();
          ctx.clip();
          ctx.strokeStyle = SCENE.curtainDark;
          ctx.lineCap = "round";
          for (const leg of cat.legs) {
            const paw = leg.foot;
            const front = leg.name.startsWith("front");
            ctx.lineWidth = leg.near ? 2.4 : 1.8;
            ctx.globalAlpha = leg.near ? 0.85 : 0.6;
            ctx.beginPath();
            for (const t of front ? [0.15, 0.5, 0.85] : [0.3, 0.7]) {
              const fromX = lerp(curtain.left, curtain.right, t);
              const fromY = front ? rodY + 2 : hemY;
              ctx.moveTo(fromX, fromY);
              ctx.quadraticCurveTo(lerp(fromX, paw.x, 0.6), lerp(fromY, paw.y, 0.35), paw.x, paw.y);
            }
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // The sill, in front of the curtains: a perch.
      ctx.fillStyle = SCENE.woodShadow;
      ctx.fillRect(left - 10, win.sill + 9, w + 20, 4);
      ctx.fillStyle = SCENE.frame;
      ctx.beginPath();
      ctx.roundRect(left - 14, win.sill, w + 28, 9, 2);
      ctx.fill();
      ctx.strokeStyle = SCENE.frameEdge;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawFloorLamp(g) {
      // Drum shade on a thin pole, with a warm glow on the wall around it.
      const { x, top } = world.floorLamp;
      const shadeH = 46;
      const topW = 40;
      const bottomW = 66;
      const glow = g.createRadialGradient(x, top + shadeH * 0.6, 0, x, top + shadeH * 0.6, 160);
      glow.addColorStop(0, `rgba(${SCENE.lampLight}, 0.38)`);
      glow.addColorStop(1, `rgba(${SCENE.lampLight}, 0)`);
      g.fillStyle = glow;
      g.fillRect(x - 160, top - 130, 320, 330);
      g.fillStyle = SCENE.woodShadow;
      g.beginPath();
      g.ellipse(x, floorY + 1, 26, 4, 0, 0, TAU);
      g.fill();
      g.fillStyle = SCENE.lampPole;
      g.beginPath();
      g.roundRect(x - 18, floorY - 6, 36, 7, 3);
      g.fill();
      g.fillRect(x - 2, top + shadeH - 4, 4, floorY - (top + shadeH) - 2);
      const shade = g.createLinearGradient(0, top, 0, top + shadeH);
      shade.addColorStop(0, SCENE.floorLampShade);
      shade.addColorStop(1, "#fff4dc");
      g.fillStyle = shade;
      g.beginPath();
      g.moveTo(x - topW / 2, top);
      g.lineTo(x + topW / 2, top);
      g.lineTo(x + bottomW / 2, top + shadeH);
      g.lineTo(x - bottomW / 2, top + shadeH);
      g.closePath();
      g.fill();
      g.strokeStyle = SCENE.floorLampEdge;
      g.lineWidth = 1.5;
      g.stroke();
      // Light spilling out under the shade.
      g.fillStyle = `rgba(${SCENE.lampLight}, 0.55)`;
      g.beginPath();
      g.ellipse(x, top + shadeH, bottomW / 2 - 4, 4, 0, 0, TAU);
      g.fill();
    }

    // Where the hanging lamp's cord meets the shade.
    function lampAttach() {
      const lamp = world.hangingLamp;
      return { x: lamp.x + Math.sin(lamp.angle) * lamp.length, y: Math.cos(lamp.angle) * lamp.length };
    }

    function updateHangingLamp(dt) {
      // A damped pendulum. Bumping the shade with the head or body pushes it
      // along with the cat's motion.
      const lamp = world.hangingLamp;
      lamp.omega += -(GRAVITY / lamp.length) * Math.sin(lamp.angle) * dt;
      lamp.omega *= Math.exp(-dt * 0.5);
      lamp.angle = clamp(lamp.angle + lamp.omega * dt, -0.9, 0.9);
      lamp.bumpCooldown = Math.max(0, lamp.bumpCooldown - dt);
      const attach = lampAttach();
      const center = { x: attach.x + Math.sin(lamp.angle) * 14, y: attach.y + Math.cos(lamp.angle) * 14 };
      const rect = colliderRectAt();
      const headHit = Math.hypot(cat.head.pos.x - center.x, cat.head.pos.y - center.y) < 34;
      const bodyHit = center.x > rect.left - 16 && center.x < rect.right + 16 &&
        center.y + 16 > rect.top - RIG_LIFT && center.y - 16 < rect.bottom;
      if ((headHit || bodyHit) && lamp.bumpCooldown <= 0) {
        const side = Math.abs(cat.vx) > 20 ? Math.sign(cat.vx) : Math.sign(center.x - cat.x) || 1;
        lamp.omega += side * (0.9 + Math.min(Math.abs(cat.vx), 500) / 500);
        lamp.bumpCooldown = 0.4;
        lamp.bumpedAt = nowSeconds;
        sfx.lampTink();
      }
    }

    function drawHangingLamp() {
      const lamp = world.hangingLamp;
      const attach = lampAttach();
      ctx.save();
      ctx.strokeStyle = SCENE.cord;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(lamp.x, 0);
      ctx.lineTo(attach.x, attach.y);
      ctx.stroke();
      ctx.translate(attach.x, attach.y);
      ctx.rotate(-lamp.angle);
      // Light cone first, so the shade sits on top of it.
      const cone = ctx.createLinearGradient(0, 26, 0, 270);
      cone.addColorStop(0, `rgba(${SCENE.lampLight}, 0.24)`);
      cone.addColorStop(1, `rgba(${SCENE.lampLight}, 0)`);
      ctx.fillStyle = cone;
      ctx.beginPath();
      ctx.moveTo(-22, 26);
      ctx.lineTo(22, 26);
      ctx.lineTo(125, 270);
      ctx.lineTo(-125, 270);
      ctx.closePath();
      ctx.fill();
      const glow = ctx.createRadialGradient(0, 28, 0, 0, 28, 70);
      glow.addColorStop(0, `rgba(${SCENE.lampLight}, 0.45)`);
      glow.addColorStop(1, `rgba(${SCENE.lampLight}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 28, 70, 0, TAU);
      ctx.fill();
      // Bulb, then the dome shade.
      ctx.fillStyle = `rgba(${SCENE.lampLight}, 0.95)`;
      fillEllipse(0, 25, 9, 6);
      const shade = ctx.createLinearGradient(-26, 0, 26, 0);
      shade.addColorStop(0, SCENE.lampShadeDark);
      shade.addColorStop(0.45, SCENE.lampShade);
      shade.addColorStop(1, SCENE.lampShadeDark);
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(6, 0);
      ctx.quadraticCurveTo(26, 4, 27, 25);
      ctx.lineTo(-27, 25);
      ctx.quadraticCurveTo(-26, 4, -6, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = SCENE.cord;
      ctx.fillRect(-4, -4, 8, 5);
      ctx.restore();
    }

    // Static furniture is painted into the backdrop, so these take a context.
    function drawTable(g) {
      const { x, w, top } = world.table;
      const thickness = 12;
      const legW = 10;
      g.fillStyle = SCENE.woodShadow;
      g.beginPath();
      g.ellipse(x + w / 2, floorY + 1, w * 0.48, 4, 0, 0, TAU);
      g.fill();
      // Two legs splay very slightly toward the floor.
      g.fillStyle = SCENE.wood;
      for (const legX of [x + 10, x + w - 10 - legW]) {
        g.beginPath();
        g.moveTo(legX, top + thickness);
        g.lineTo(legX + legW, top + thickness);
        g.lineTo(legX + legW - 1.5, floorY);
        g.lineTo(legX + 1.5, floorY);
        g.closePath();
        g.fill();
      }
      // Apron under the top, then the top with a lighter front edge.
      g.fillStyle = SCENE.woodDark;
      g.fillRect(x + 8, top + thickness, w - 16, 9);
      const slab = g.createLinearGradient(0, top, 0, top + thickness);
      slab.addColorStop(0, SCENE.woodLight);
      slab.addColorStop(1, SCENE.wood);
      g.fillStyle = slab;
      g.beginPath();
      g.roundRect(x - 4, top, w + 8, thickness, 3);
      g.fill();
      g.fillStyle = "rgba(255, 245, 225, 0.35)";
      g.fillRect(x - 2, top + 1, w + 4, 1.5);
    }

    function drawBookcase(g) {
      // Cupboard with two doors at the bottom, an open shelf of books above,
      // and books on the cupboard top. Shelf boards line up with the platforms.
      const { x, w, levels } = world.bookcase;
      const [cupboardTop, shelfTop, caseTop] = levels;
      const side = 8;
      g.fillStyle = SCENE.woodShadow;
      g.fillRect(x + 4, caseTop + 4, w, floorY - caseTop);
      // Back panel of the open part, darker so books read against it.
      g.fillStyle = SCENE.woodDark;
      g.fillRect(x, caseTop, w, cupboardTop - caseTop);
      // Books on the cupboard top and on the middle shelf. Heights and colours
      // come from a fixed pattern so they don't change between redraws.
      for (const [base, ceiling, seed] of [[cupboardTop, shelfTop, 3], [shelfTop, caseTop, 7]]) {
        const room = base - ceiling - 10;
        let bx = x + side + 2;
        let i = seed;
        while (bx < x + w - side - 8) {
          const bw = 7 + ((i * 5) % 6);
          const bh = Math.min(room, room * (0.55 + ((i * 37) % 10) / 30));
          if ((i * 3) % 11 === 0) {
            bx += 10;
          } else {
            g.fillStyle = SCENE.books[i % SCENE.books.length];
            g.fillRect(bx, base - bh, bw, bh);
            g.fillStyle = "rgba(255, 255, 255, 0.18)";
            g.fillRect(bx + 1.5, base - bh + 4, bw - 3, 2);
            bx += bw + 1;
          }
          i += 1;
        }
      }
      // Frame: sides, cornice, shelf board.
      g.fillStyle = SCENE.wood;
      g.fillRect(x, caseTop, side, floorY - caseTop);
      g.fillRect(x + w - side, caseTop, side, floorY - caseTop);
      g.fillStyle = SCENE.woodLight;
      g.fillRect(x - 4, caseTop - 8, w + 8, 10);
      g.fillRect(x, shelfTop, w, 7);
      // Cupboard: front panel, two doors and knobs.
      const doorTop = cupboardTop;
      const cupboard = g.createLinearGradient(0, doorTop, 0, floorY);
      cupboard.addColorStop(0, SCENE.woodLight);
      cupboard.addColorStop(1, SCENE.wood);
      g.fillStyle = cupboard;
      g.fillRect(x, doorTop, w, floorY - doorTop);
      g.strokeStyle = SCENE.woodDark;
      g.lineWidth = 1.5;
      const inset = 9;
      const doorW = (w - inset * 3) / 2;
      for (const doorX of [x + inset, x + inset * 2 + doorW]) {
        g.strokeRect(doorX + 0.5, doorTop + 12.5, doorW, floorY - doorTop - 22);
      }
      g.fillStyle = SCENE.knob;
      const knobY = doorTop + (floorY - doorTop) / 2;
      for (const knobX of [x + inset + doorW - 7, x + inset * 2 + doorW + 7]) {
        g.beginPath();
        g.arc(knobX, knobY, 2.8, 0, TAU);
        g.fill();
      }
      g.fillStyle = SCENE.woodLight;
      g.fillRect(x - 3, doorTop, w + 6, 8);
    }

    function boxRect() {
      return {
        left: world.box.x,
        right: world.box.x + world.box.w,
        top: world.box.y,
        bottom: world.box.y + world.box.h
      };
    }

    // Returns the collider rectangle used by physics, centered on the torso.
    function colliderRectAt(x = cat.x, y = cat.y) {
      return sharedColliderRectAt(x, y, cat.collider);
    }

    // Converts a desired ground surface Y to cat center Y for our collider.
    function centerYForSurface(surfaceY) {
      return sharedCenterYForSurface(surfaceY, cat.collider);
    }

    function overlapsX(rect, box) {
      return sharedOverlapsX(rect, box);
    }

    function overlapsY(rect, box) {
      return sharedOverlapsY(rect, box);
    }

    function resolveHorizontal(args) {
      return sharedResolveHorizontal(args);
    }

    // Where the drawn torso's centre is. The take-off rear-up (pose.launch)
    // pitches the body about the shoulders rather than its middle, so the
    // hips drop back toward the hind paws while the front rises.
    function bodyCenter() {
      const pitch = -cat.facing * cat.pose.launch;
      const px = 40 * cat.facing;
      const py = -6;
      return {
        x: cat.x + px - (px * Math.cos(pitch) - py * Math.sin(pitch)),
        y: cat.y + cat.pose.bob - RIG_LIFT + py - (px * Math.sin(pitch) + py * Math.cos(pitch))
      };
    }

    // A point of the resting torso (facing right, x along the body, y down
    // from the spine) carried onto the current spine (see spineMap).
    function spinePoint(x, y) {
      return spineMap(x, y, {
        rearX: SPINE_REAR_X,
        frontX: SPINE_FRONT_X,
        arch: cat.pose.arch,
        length: cat.pose.length
      });
    }

    function bodyPoint(localX, localY) {
      // Most rig anchors are defined in local body-space (x mirrored by
      // facing), carried along the spine, then turned by the torso's tilt
      // into world-space.
      const p = spinePoint(localX * cat.facing, localY);
      const { x: cx, y: cy } = bodyCenter();
      const wx = p.x * cat.facing;
      const a = cat.pose.tilt;
      const cos = Math.cos(a);
      const sin = Math.sin(a);
      return {
        x: cx + (wx * cos - p.y * sin),
        y: cy + (wx * sin + p.y * cos)
      };
    }

    // A local vector (x mirrored by facing) at body position atX, turned with
    // the spine there and the torso's tilt.
    function bodyToWorldVector(localX, localY, atX = 0) {
      return rotateVector(localX, localY, cat.pose.tilt + cat.facing * spinePoint(atX, 0).angle);
    }

    function ensureDynamicPoseState() {
      // Tail arrays are rebuilt lazily so resize/reload stays robust.
      const tailCount = cat.tail.lengths.length + 1;
      if (cat.tail.joints.length !== tailCount) {
        const base = bodyPoint(TAIL_BASE.x * cat.facing, TAIL_BASE.y);
        cat.tail.joints = new Array(tailCount).fill(0).map((_, i) => ({
          x: base.x - cat.facing * i * 14,
          y: base.y - i * 1.2
        }));
      }

      if (cat.tail.angles.length !== cat.tail.lengths.length) {
        cat.tail.angles = new Array(cat.tail.lengths.length).fill(cat.facing > 0 ? Math.PI - 0.5 : -0.5);
      }

      if (cat.tail.velocities.length !== cat.tail.lengths.length) {
        cat.tail.velocities = new Array(cat.tail.lengths.length).fill(0);
      }
    }

    function isOnBoxTop() {
      return sharedIsOnBoxTop({
        x: cat.x,
        y: cat.y,
        collider: cat.collider,
        box: boxRect(),
        epsilon: 7,
        inset: 9
      });
    }

    // Everything the cat can stand on, highest first, ending with the floor.
    function walkableSurfaces() {
      const box = boxRect();
      return [
        ...world.platforms.map((p) => ({ ...p, oneWay: true })),
        { kind: "box", left: box.left, right: box.right, top: box.top },
        { kind: "floor", left: -Infinity, right: Infinity, top: floorY }
      ].sort((a, b) => a.top - b.top);
    }

    function surfaceUnderCat() {
      // The surface the torso collider rests on, if any. A rising cat is
      // passing through one-way platforms, not standing on them.
      const rect = colliderRectAt();
      for (const surface of walkableSurfaces()) {
        if (surface.oneWay && (cat.vy < -40 || cat.dropTimer > 0)) continue;
        const inset = surface.kind === "box" ? 10 : PLATFORM_EDGE_INSET;
        if (surface.kind !== "floor" && !(rect.right - inset > surface.left && rect.left + inset < surface.right)) continue;
        const tolerance = surface.kind === "box" ? 10 : 6;
        if (Math.abs(rect.bottom - surface.top) <= tolerance) return surface;
      }
      // A cat at rest on a corner is standing, however small the overlap.
      if (Math.abs(cat.vy) < 1) {
        return walkableSurfaces().find((surface) =>
          Math.abs(rect.bottom - surface.top) <= 2 && rect.right > surface.left && rect.left < surface.right) ?? null;
      }
      return null;
    }

    function supportSurfaceYForFoot(footX, hipX, hipY) {
      // Highest surface under the paw that lies below the hip. Paws may hang a
      // little past the edges of the surface the cat is standing on, so they
      // don't drop to the floor as soon as the body nears an edge.
      let best = floorY;
      for (const surface of walkableSurfaces()) {
        if (surface.kind === "floor" || surface.top < hipY + 8 || surface.top >= best) continue;
        const standingOn = cat.onGround && cat.support?.top === surface.top && cat.support?.left === surface.left;
        const pad = standingOn ? 12 : -6;
        if (footX < surface.left - pad || footX > surface.right + pad) continue;
        best = surface.top;
      }
      return best;
    }

    function clampFootX(desiredX, hipX, hipY, targetSurfaceY) {
      // Paws on a raised surface stay on it; paws on the floor stay out of
      // the box's sides.
      const box = boxRect();
      if (targetSurfaceY === box.top) {
        return clamp(desiredX, box.left + 7, box.right - 7);
      }
      if (targetSurfaceY !== floorY) {
        const surface = world.platforms.find((p) => p.top === targetSurfaceY && desiredX > p.left - 14 && desiredX < p.right + 14);
        if (surface) return clamp(desiredX, surface.left + 4, surface.right - 4);
        return desiredX;
      }

      // When the leg is on floor support, keep floor feet outside side walls.
      // We disable this while hips are high so jump trajectories can pass cleanly.
      if (hipY < box.top + 6) return desiredX;
      const sidePadding = 14;
      if (desiredX > box.left - sidePadding && desiredX < box.right + sidePadding) {
        return hipX <= box.left ? box.left - sidePadding : box.right + sidePadding;
      }
      if (hipX < box.left && desiredX > box.left - sidePadding) return box.left - sidePadding;
      if (hipX > box.right && desiredX < box.right + sidePadding) return box.right + sidePadding;
      return desiredX;
    }

    function resolveSidePenetration() {
      if (!physics.catBody) return;
      const resolved = resolveHorizontal({
        x: cat.x,
        y: cat.y,
        vx: cat.vx,
        dt: 0,
        collider: cat.collider,
        box: boxRect(),
        worldWidth: ROOM_W,
        headBumper: HEAD_BUMPER
      });
      if (Math.abs(resolved.x - cat.x) < 0.001) return;

      Body.setPosition(physics.catBody, { x: resolved.x, y: physics.catBody.position.y });
      Body.setVelocity(physics.catBody, { x: resolved.vx / MATTER_FPS, y: physics.catBody.velocity.y });
      cat.x = resolved.x;
      cat.vx = resolved.vx;
    }

    // A leaping cat whose chest flies into a curtain gets its claws stuck in
    // it. Only after a jump (stepping off the table just drops past), and
    // only from beside the window: a cat over the sill is going for the
    // sill, not the curtains.
    function tryCling() {
      if (cat.onGround || !cat.leapt || cat.cling || cat.clingCooldown > 0 || game.dizzy > 0) return;
      if (Math.abs(cat.x - world.window.x) < world.window.w / 2) return;
      // The front half of the body, from the middle to the chest.
      const middle = bodyPoint(0, 6);
      const chest = bodyPoint(54 * cat.facing, 6);
      // It has to be flying up and toward the curtain (from beside the
      // window), not hopping straight up next to it or falling past it, and
      // high: a low pounce at a mouse goes under the loose cloth near the
      // hem, which hangs below the sill.
      if (cat.vy > 150) return;
      const curtain = world.curtains.find((c) => c.side * cat.vx < -60 &&
        Math.max(middle.x, chest.x) > c.left - 6 && Math.min(middle.x, chest.x) < c.right + 6 &&
        chest.y > c.top + 34 && chest.y < world.window.sill + 20);
      if (!curtain) return;
      // It hangs over the middle of the curtain, the whole cat on the cloth.
      const middleY = clamp(cat.y - RIG_LIFT, curtain.top + 78, curtain.bottom - 36);
      cat.cling = {
        curtain,
        t: 0,
        dur: CLING_TIME,
        x: (curtain.left + curtain.right) / 2 - cat.facing * 4,
        y: middleY + RIG_LIFT,
        maxY: curtain.bottom - 30 + RIG_LIFT,
        struggle: 0.6,
        slipIn: 0.5
      };
      curtain.swayVel += clamp(cat.vx, -500, 500) * 0.12 + cat.facing * 20;
      popups.push({ x: cat.x, y: middleY - 70, text: "Stuck!", color: SCENE.popup, life: 0 });
      sfx.stuck();
    }

    // Holds the stuck cat on the curtain. Now and then its claws slip a
    // little way down the cloth. Returns false once it comes free.
    function updateCling(dt) {
      const c = cat.cling;
      c.t += dt;
      c.struggle = Math.max(0, c.struggle - dt * 2.2);
      c.slipIn -= dt;
      if (c.slipIn <= 0) {
        c.slipIn = 0.35 + Math.random() * 0.3;
        c.y = Math.min(c.y + 5, c.maxY);
      }
      c.curtain.swayVel += Math.sin(c.t * 16) * (0.4 + c.struggle) * 90 * dt;
      const ease = 1 - Math.exp(-dt * 16);
      cat.x = lerp(cat.x, c.x, ease);
      cat.y = lerp(cat.y, c.y, ease);
      Body.setPosition(physics.catBody, { x: cat.x, y: cat.y + cat.collider.offsetY });
      Body.setVelocity(physics.catBody, { x: 0, y: 0 });
      cat.vx = 0;
      cat.vy = 0;
      cat.ax = 0;
      cat.ay = 0;
      cat.onGround = false;
      cat.support = null;
      cat.supportSurface = null;
      cat.jumpQueued = false;
      cat.jumpBuffer = 0;
      cat.coyoteTime = 0;
      cat.crouch = null;
      if (c.t < c.dur) return true;
      // Free: the cat drops, kicking off the way an arrow key points.
      cat.cling = null;
      cat.clingCooldown = CLING_REST;
      const push = (input.ArrowRight ? 1 : 0) - (input.ArrowLeft ? 1 : 0);
      Body.setVelocity(physics.catBody, { x: (push * 220) / MATTER_FPS, y: -160 / MATTER_FPS });
      c.curtain.swayVel -= cat.facing * 40;
      sfx.unstuck();
      return false;
    }

    function updateCurtains(dt) {
      for (const curtain of world.curtains) {
        curtain.swayVel += (-60 * curtain.sway - 3 * curtain.swayVel) * dt;
        curtain.sway = clamp(curtain.sway + curtain.swayVel * dt, -14, 14);
      }
    }

    function updatePhysics(dt) {
      // Rigid-body collision comes from Matter.js; control is velocity-driven.
      if (!physics.engine || !physics.catBody) return;
      cat.clingCooldown = Math.max(0, cat.clingCooldown - dt);
      if (cat.cling && updateCling(dt)) return;
      // A cat bumped by the dog is dizzy for a moment: no running or jumping.
      const dizzy = game.dizzy > 0;
      const moveDir = dizzy ? 0 : (input.ArrowRight ? 1 : 0) + (input.ArrowLeft ? -1 : 0);
      const jumpState = updateJumpWindow({
        jumpQueued: cat.jumpQueued && !dizzy,
        jumpBuffer: cat.jumpBuffer,
        coyoteTime: cat.coyoteTime,
        onGround: cat.onGround,
        dt
      });
      cat.jumpBuffer = jumpState.jumpBuffer;
      cat.coyoteTime = jumpState.coyoteTime;
      cat.jumpQueued = false;

      const vx = physics.catBody.velocity.x * MATTER_FPS;
      const zoom = game.zoomies > 0 ? ZOOMIES_BOOST : 1;
      cat.sneaking = input.ArrowDown && cat.onGround && !cat.support?.oneWay;
      const groundSpeed = cat.sneaking ? SNEAK_SPEED : RUN_SPEED;
      const speedTarget = moveDir * (cat.onGround ? groundSpeed : LEAP_SPEED) * zoom;
      const accel = cat.onGround ? 2600 : 1450;
      const drag = cat.onGround ? 2600 : 300;
      let nextVx = moveDir === 0
        ? approach(vx, 0, drag * dt)
        : approach(vx, speedTarget, accel * dt);

      // Hard side clipping removes corner-climb artifacts from rigid-body contact.
      const side = resolveHorizontal({
        x: cat.x,
        y: cat.y,
        vx: nextVx,
        dt,
        collider: cat.collider,
        box: boxRect(),
        worldWidth: ROOM_W,
        headBumper: HEAD_BUMPER
      });
      // Only move the body when the resolver clipped the step. Matter already
      // integrates nextVx, so applying an unclipped step here would move the
      // cat twice.
      if (Math.abs(side.x - (cat.x + nextVx * dt)) > 0.001 || side.vx !== nextVx) {
        Body.setPosition(physics.catBody, {
          x: side.x - side.vx * dt,
          y: physics.catBody.position.y
        });
      }
      nextVx = side.vx;

      Body.setVelocity(physics.catBody, {
        x: nextVx / MATTER_FPS,
        y: physics.catBody.velocity.y
      });

      if (Math.abs(nextVx) > 7) {
        // Turning round mirrors the body's lean too, so a cat pitched nose
        // down in the air stays nose down.
        if (Math.sign(nextVx) !== cat.facing) cat.pose.lean = -cat.pose.lean;
        cat.facing = Math.sign(nextVx);
      }

      // A jump from the ground starts with a quick crouch onto the hind legs
      // and takes off at the end of it. Off a ledge (coyote time) there is
      // nothing to push from, so it goes at once.
      let launch = false;
      if (jumpState.shouldJump && !cat.crouch) {
        if (cat.onGround) {
          cat.crouch = { t: 0, dur: Math.abs(nextVx) > 120 ? JUMP_CROUCH_RUN : JUMP_CROUCH };
          // A hind paw still mid-step comes down to push.
          for (const leg of cat.legs) {
            if (leg.name.startsWith("rear") && leg.mode === "swing") leg.swingRate = Math.max(leg.swingRate, 16);
          }
        } else {
          launch = true;
        }
